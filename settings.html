<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Equity Mixed Assets</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 90px;">

  <!-- Header -->
  <div class="header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100;">
    <div class="brand-title" style="font-weight: 700; font-size: 16px;">Settings</div>
    <button class="back-btn" onclick="window.location.href='dashboard.html'" style="background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;">← Back</button>
  </div>

  <div style="padding: 16px; max-width: 600px; margin: 0 auto;">
    
    <!-- Settings Options Group -->
    <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; margin-bottom: 20px;">
      
      <!-- Profile Option -->
      <div onclick="window.location.href='profile.html';" style="padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(51, 65, 85, 0.5); cursor: pointer;">
        <div>
          <div style="font-size: 15px; font-weight: 600; color: #fff;">Profile</div>
          <div style="font-size: 12px; color: #94a3b8; margin-top: 2px;">View and update your account details</div>
        </div>
        <span style="color: #64748b; font-size: 16px;">→</span>
      </div>

      <!-- Log Out Option -->
      <div onclick="confirmLogout()" style="padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(51, 65, 85, 0.5); cursor: pointer;">
        <div>
          <div style="font-size: 15px; font-weight: 600; color: #3b82f6;">Log Out</div>
          <div style="font-size: 12px; color: #94a3b8; margin-top: 2px;">Sign out of your active session</div>
        </div>
        <span style="color: #3b82f6; font-size: 16px;">→</span>
      </div>

      <!-- Delete Account Option -->
      <div onclick="confirmDelete()" style="padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
        <div>
          <div style="font-size: 15px; font-weight: 600; color: #ef4444;">Delete Account</div>
          <div style="font-size: 12px; color: #94a3b8; margin-top: 2px;">Permanently remove your account and data</div>
        </div>
        <span style="color: #ef4444; font-size: 16px;">→</span>
      </div>

    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav" style="position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000;">
    <button class="nav-item" onclick="window.location.href='dashboard.html'" style="background: none; border: none; color: #94a3b8; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center;">
      <span class="nav-icon" style="font-size: 18px; margin-bottom: 2px;">🏠</span> Home
    </button>
    <button class="nav-item" onclick="window.location.href='plans.html'" style="background: none; border: none; color: #94a3b8; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center;">
      <span class="nav-icon" style="font-size: 18px; margin-bottom: 2px;">📈</span> Plans
    </button>
    <button class="nav-item" onclick="window.location.href='dashboard.html'" style="background: none; border: none; color: #94a3b8; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center;">
      <span class="nav-icon" style="font-size: 18px; margin-bottom: 2px;">💳</span> Deposit
    </button>
    <button class="nav-item active" onclick="window.location.href='settings.html'" style="background: none; border: none; color: #3b82f6; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-weight: bold;">
      <span class="nav-icon" style="font-size: 18px; margin-bottom: 2px;">⚙️</span> Settings
    </button>
    <button class="nav-item" onclick="toggleMenu()" style="background: none; border: none; color: #94a3b8; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center;">
      <span class="nav-icon" style="font-size: 18px; margin-bottom: 2px;">☰</span> Menu
    </button>
  </div>

  <!-- Slide-out Menu Drawer -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="toggleMenu()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div style="font-weight: 700;">Menu</div>
      <button class="drawer-close" onclick="toggleMenu()">✕</button>
    </div>
    <div class="drawer-links">
      <a onclick="window.location.href='dashboard.html';">Dashboard</a>
      <a onclick="window.location.href='dashboard.html';">Deposit Funds</a>
      <a onclick="window.location.href='plans.html';">Investment Plans</a>
      <a onclick="window.location.href='settings.html';">Settings</a>
    </div>
    <button class="logout-btn" onclick="confirmLogout()">Log Out</button>
  </div>

  <!-- Custom Modal UI -->
  <div id="custom-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
    <div style="background: #1e293b; padding: 25px; border-radius: 12px; width: 80%; max-width: 320px; text-align: center; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <div id="modal-message" style="color: #fff; font-size: 16px; font-weight: 500; margin-bottom: 20px; line-height: 1.5;"></div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button id="modal-cancel-btn" style="flex: 1; padding: 12px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; border-radius: 8px; font-weight: 600; cursor: pointer; display: none;">Cancel</button>
        <button id="modal-ok-btn" style="flex: 1; padding: 12px; border: none; background: #3b82f6; color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer;">OK</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Custom Modal Logic
    let confirmCallback = null;

    function showModal(message, isConfirm = false, callback = null) {
      document.getElementById('modal-message').innerText = message;
      document.getElementById('custom-modal').style.display = 'flex';
      confirmCallback = callback;

      if (isConfirm) {
        document.getElementById('modal-cancel-btn').style.display = 'block';
        document.getElementById('modal-ok-btn').style.background = '#ef4444'; // Red for confirm actions
      } else {
        document.getElementById('modal-cancel-btn').style.display = 'none';
        document.getElementById('modal-ok-btn').style.background = '#3b82f6'; // Blue for info
      }
    }

    document.getElementById('modal-cancel-btn').onclick = function() {
      document.getElementById('custom-modal').style.display = 'none';
      confirmCallback = null;
    };

    document.getElementById('modal-ok-btn').onclick = function() {
      document.getElementById('custom-modal').style.display = 'none';
      if (confirmCallback) confirmCallback();
    };

    // Action Functions
    function confirmLogout() {
      showModal("Are you sure you want to log out?", true, function() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'index.html'; 
      });
    }

    function confirmDelete() {
      showModal("WARNING: Deleting your account is permanent. Are you sure you want to proceed?", true, function() {
        showModal("Account deletion request submitted to administration.");
      });
    }

    // Fallback menu toggle if app.js is missing
    if(typeof toggleMenu !== "function") {
      window.toggleMenu = function() {
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawer-overlay');
        if (drawer.classList.contains('open')) {
          drawer.classList.remove('open');
          overlay.classList.remove('open');
        } else {
          drawer.classList.add('open');
          overlay.classList.add('open');
        }
      }
    }
  </script>
</body>
</html>
