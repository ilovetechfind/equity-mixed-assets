<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Customer Care Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: white;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 16px;
      padding-bottom: 90px;
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 14px 0; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #818cf8; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }

    .chat-box { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; height: 320px; overflow-y: auto; padding: 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { padding: 10px 14px; border-radius: 10px; max-width: 75%; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg-admin { background: var(--primary); color: white; align-self: flex-end; }
    .msg-user { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; align-self: flex-start; }
    .chat-msg img { max-width: 100%; border-radius: 8px; display: block; margin-top: 6px; cursor: pointer; }

    .chat-input-row { display: flex; gap: 8px; align-items: center; }
    input[type="text"] { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; }
    input:focus { border-color: var(--primary); }

    .icon-btn { background: rgba(255,255,255,0.08); border: none; color: white; width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; }
    .send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; height: 44px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #image-preview-bar { display: none; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 10px; font-size: 0.8rem; color: var(--text-muted); }
    #image-preview-bar img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
    #image-preview-bar button { margin-left: auto; background: none; border: none; color: #f87171; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">Customer Care Live Chat</h1>
    </header>

    <a href="#" id="back-to-user" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to User Info
    </a>

    <div class="card">
      <h2 class="card-title">Live Conversation</h2>
      <div class="chat-box" id="chat-messages">
        <div style="color: var(--text-muted); text-align: center; margin: auto; font-size: 0.85rem;">Loading messages...</div>
      </div>

      <div id="image-preview-bar">
        <img id="preview-thumb" src="" alt="preview">
        <span>Image ready to send</span>
        <button type="button" onclick="clearPendingImage()">Remove</button>
      </div>

      <form class="chat-input-row" onsubmit="sendChatMessage(event)">
        <button type="button" class="icon-btn" id="attach-btn" title="Attach image">📎</button>
        <input type="file" id="file-input" accept="image/*" style="display:none">
        <input type="text" id="chat-input" placeholder="Type a message to client..." autocomplete="off">
        <button type="submit" class="send-btn" id="send-btn">Send</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id');
    let pendingImageFile = null;

    if (targetUserId) {
      document.getElementById('back-to-user').setAttribute('href', `user-info.html?id=${targetUserId}`);
    }

    function appendMessage(m) {
      const chatBox = document.getElementById('chat-messages');
      const emptyMsg = chatBox.querySelector('div[style*="text-align: center"]');
      if (emptyMsg) {
        chatBox.innerHTML = '';
      }

      const div = document.createElement('div');
      div.className = `chat-msg ${m.sender === 'admin' ? 'msg-admin' : 'msg-user'}`;

      if (m.message) {
        const textSpan = document.createElement('div');
        textSpan.innerText = m.message;
        div.appendChild(textSpan);
      }
      if (m.image_url) {
        const img = document.createElement('img');
        img.src = m.image_url;
        img.alt = 'attachment';
        img.onclick = () => window.open(m.image_url, '_blank');
        div.appendChild(img);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function loadMessages() {
      if (!targetUserId) return;
      const { data, error } = await client
        .from('messages')
        .select('*')
        .eq('user_id', targetUserId)
        .order('created_at', { ascending: true });

      const chatBox = document.getElementById('chat-messages');
      if (error || !data || data.length === 0) {
        chatBox.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin: auto; font-size: 0.85rem;">No messages yet. Start the conversation!</div>`;
        return;
      }

      chatBox.innerHTML = '';
      data.forEach(m => appendMessage(m));
    }

    function clearPendingImage() {
      pendingImageFile = null;
      document.getElementById('image-preview-bar').style.display = 'none';
      document.getElementById('file-input').value = '';
    }

    document.getElementById('attach-btn').addEventListener('click', () => {
      document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pendingImageFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('preview-thumb').src = ev.target.result;
        document.getElementById('image-preview-bar').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    });

    async function uploadImage(file) {
      const ext = file.name.split('.').pop();
      const path = `${targetUserId}/admin-${Date.now()}.${ext}`;
      const { error: uploadError } = await client.storage
        .from('chat-images')
        .upload(path, file);

      if (uploadError) {
        throw uploadError;
      }

      const { data } = client.storage.from('chat-images').getPublicUrl(path);
      return data.publicUrl;
    }

    async function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('send-btn');
      const text = input.value.trim();

      if (!text && !pendingImageFile) return;
      if (!targetUserId) return;

      sendBtn.disabled = true;
      let imageUrl = null;

      try {
        if (pendingImageFile) {
          imageUrl = await uploadImage(pendingImageFile);
        }

        const row = {
          user_id: targetUserId,
          sender: 'admin',
          message: text || null,
          image_url: imageUrl
        };

        input.value = '';
        clearPendingImage();
        appendMessage(row);

        const { error } = await client.from('messages').insert(row);

        if (error) {
          console.error("Error sending message:", error.message);
          alert("Failed to send: " + error.message);
        }
      } catch (err) {
        console.error("Error sending message:", err.message);
        alert("Failed to send: " + err.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    if (targetUserId) {
      loadMessages();

      client
        .channel('admin-chat-' + targetUserId)
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'messages',
            filter: `user_id=eq.${targetUserId}`
          },
          (payload) => {
            if (payload.new.sender !== 'admin') {
              appendMessage(payload.new);
            }
          }
        )
        .subscribe();
    }
  </script>
</body>
</html>
