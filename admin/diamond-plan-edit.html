<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Edit Diamond Tier Payment Wall</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #34d399;
    }
    body { background: var(--bg-gradient); background-attachment: fixed; color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 16px; padding-bottom: 90px; }
    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 14px 0; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #818cf8; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    input[type="text"], input[type="number"] { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); }
    input:disabled { opacity: 0.6; cursor: not-allowed; background: rgba(0,0,0,0.5); }
    .btn-row { display: flex; gap: 10px; margin-top: 10px; }
    .submit-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; flex: 1; transition: opacity 0.2s; }
    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .unlock-btn { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; display: none; }
    .status-msg { font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 10px; display: block; }
    .preview-box { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06); padding: 14px; border-radius: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="logo-text">Diamond Tier Payment Wall</h1>
    </header>
    <a href="#" id="back-link" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Plans Control
    </a>
    <div class="card">
      <h2 class="card-title">Configure Volume, Graph & Payment Parameters</h2>
      <form id="configForm" onsubmit="saveAndLockConfig(event)">
        <div class="form-group">
          <label>Day Text (e.g., Day 24 of 30)</label>
          <input type="text" id="input-day" value="Day 24 of 30">
        </div>
        <div class="form-group">
          <label>Current Value ($)</label>
          <input type="text" id="input-current" value="$137,142.60">
        </div>
        <div class="preview-box">
          <label style="color: #818cf8; margin-bottom: 4px;">📈 Graph Curve Path (SVG path 'd' attribute, viewBox 400x100)</label>
          <div style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px;">Advanced: paste a raw SVG path line, e.g. <code>M0,80 Q100,45 200,20 T400,10</code>. Leave as-is to keep this tier's default curve shape.</div>
          <input type="text" id="input-graph-path" value="M0,80 Q100,35 200,15 T400,10">
        </div>
        <div class="preview-box">
          <label style="color: #818cf8; margin-bottom: 4px;">📊 Installment Volume Progress Bar Control</label>
          <div class="form-group" style="margin-bottom: 6px;">
            <label>Progress Fill Percentage (0% to 100%)</label>
            <input type="number" id="input-progress" value="60" min="0" max="100">
          </div>
        </div>
        <div class="form-group">
          <label>Paid Volume Text (e.g., $1,250 / $5,000 Paid)</label>
          <input type="text" id="input-paid-volume" value="$60,000 / $100,000 Paid">
        </div>
        <div class="form-group">
          <label>Time Remaining Subtext</label>
          <input type="text" id="input-time-remaining" value="6 days remaining to clear installment structure and unlock total maturity claim.">
        </div>
        <div class="form-group">
          <label>Total Investment Goal ($)</label>
          <input type="text" id="input-total-goal" value="$100,000">
        </div>
        <div class="form-group">
          <label>Remaining Balance ($)</label>
          <input type="text" id="input-remaining" value="$40,000">
        </div>
        <div class="form-group">
          <label>Guaranteed Payout Return ($)</label>
          <input type="text" id="input-payout" value="$500,000">
        </div>
        <div class="form-group">
          <label>Installment Button Text</label>
          <input type="text" id="input-btn-text" value="Pay Next Installment ($40,000)">
        </div>
        <div class="btn-row">
          <button type="submit" class="submit-btn" id="saveBtn">Save & Lock Payment Wall</button>
          <button type="button" class="unlock-btn" id="unlockBtn" onclick="unlockForm()">Edit Back (Unlock)</button>
        </div>
        <span id="form-status" class="status-msg"></span>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id') || 'default_user';
    const PLAN_ID = 'diamond';

    document.getElementById('back-link').setAttribute('href', `investment-plans-admin.html?id=${targetUserId}`);

    document.addEventListener("DOMContentLoaded", loadSavedData);

    async function loadSavedData() {
      const { data, error } = await client
        .from('plan_configs')
        .select('*')
        .eq('user_id', targetUserId)
        .eq('plan_id', PLAN_ID)
        .maybeSingle();

      if (error) { console.error('Error loading plan config:', error.message); return; }
      if (!data) return;

      document.getElementById('input-day').value = data.day_text || document.getElementById('input-day').value;
      document.getElementById('input-current').value = data.current_value || document.getElementById('input-current').value;
      document.getElementById('input-progress').value = data.progress_percent ?? document.getElementById('input-progress').value;
      document.getElementById('input-graph-path').value = data.graph_path_line || document.getElementById('input-graph-path').value;
      document.getElementById('input-paid-volume').value = data.paid_volume_text || document.getElementById('input-paid-volume').value;
      document.getElementById('input-time-remaining').value = data.time_remaining || document.getElementById('input-time-remaining').value;
      document.getElementById('input-total-goal').value = data.total_goal || document.getElementById('input-total-goal').value;
      document.getElementById('input-remaining').value = data.remaining_balance || document.getElementById('input-remaining').value;
      document.getElementById('input-payout').value = data.guaranteed_payout || document.getElementById('input-payout').value;
      document.getElementById('input-btn-text').value = data.installment_button_text || document.getElementById('input-btn-text').value;

      if (data.locked) setFormLockState(true);
    }

    async function saveAndLockConfig(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;

      const row = {
        user_id: targetUserId,
        plan_id: PLAN_ID,
        day_text: document.getElementById('input-day').value,
        current_value: document.getElementById('input-current').value,
        progress_percent: parseFloat(document.getElementById('input-progress').value),
        graph_path_line: document.getElementById('input-graph-path').value,
        paid_volume_text: document.getElementById('input-paid-volume').value,
        time_remaining: document.getElementById('input-time-remaining').value,
        total_goal: document.getElementById('input-total-goal').value,
        remaining_balance: document.getElementById('input-remaining').value,
        guaranteed_payout: document.getElementById('input-payout').value,
        installment_button_text: document.getElementById('input-btn-text').value,
        locked: true,
        updated_at: new Date().toISOString()
      };

      const { error } = await client
        .from('plan_configs')
        .upsert(row, { onConflict: 'user_id,plan_id' });

      const statusEl = document.getElementById('form-status');

      if (error) {
        statusEl.style.color = "#fca5a5";
        statusEl.innerText = "Failed to save: " + error.message;
        saveBtn.disabled = false;
        return;
      }

      setFormLockState(true);
      statusEl.style.color = "#34d399";
      statusEl.innerText = "Payment wall saved and auto-locked successfully!";
      setTimeout(() => { statusEl.innerText = ""; }, 3000);
      saveBtn.disabled = false;
    }

    async function unlockForm() {
      const { error } = await client
        .from('plan_configs')
        .update({ locked: false })
        .eq('user_id', targetUserId)
        .eq('plan_id', PLAN_ID);

      const statusEl = document.getElementById('form-status');

      if (error) {
        statusEl.style.color = "#fca5a5";
        statusEl.innerText = "Failed to unlock: " + error.message;
        return;
      }

      setFormLockState(false);
      statusEl.style.color = "#fca5a5";
      statusEl.innerText = "Payment wall unlocked for editing.";
      setTimeout(() => { statusEl.innerText = ""; }, 3000);
    }

    function setFormLockState(locked) {
      document.querySelectorAll('#configForm input').forEach(f => f.disabled = locked);
      document.getElementById('saveBtn').style.display = locked ? 'none' : 'block';
      document.getElementById('unlockBtn').style.display = locked ? 'block' : 'none';
    }
  </script>
</body>
</html>
