<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - User Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0; }
    
    .edit-toggle-btn { background: rgba(129, 140, 248, 0.15); border: 1px solid rgba(129, 140, 248, 0.3); color: #818cf8; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .edit-toggle-btn:hover { background: rgba(129, 140, 248, 0.3); }

    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #818cf8; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); }
    input:disabled { opacity: 0.6; cursor: not-allowed; background: rgba(0,0,0,0.15); }

    .range-wrap { display: flex; align-items: center; gap: 12px; }
    .range-wrap input[type="range"] { flex: 1; accent-color: var(--primary); cursor: pointer; }
    .range-value { font-weight: 800; color: #34d399; font-size: 1rem; min-width: 50px; text-align: right; }

    .submit-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.2s; margin-top: 10px; }
    .submit-btn:hover { opacity: 0.9; }
    .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    
    .status-msg { font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 10px; display: block; }

    /* Chat Section Styles */
    .chat-container { display: flex; flex-direction: column; height: 350px; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; background: rgba(0, 0, 0, 0.2); overflow: hidden; margin-bottom: 12px; }
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; line-height: 1.4; word-break: break-word; }
    .chat-bubble.admin { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .chat-bubble.client { background: rgba(255, 255, 255, 0.1); color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
    .chat-input-row { display: flex; gap: 8px; padding: 10px; background: rgba(0, 0, 0, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .chat-input-row input { flex: 1; padding: 10px; border-radius: 8px; }
    .chat-send-btn { background: var(--primary); border: none; color: white; padding: 0 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">User Info</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </header>

    <a href="referred-users.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Network List
    </a>

    <!-- Account Details Form -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-title">Manage Account Details</span>
        <button type="button" class="edit-toggle-btn" id="toggle-edit-btn" onclick="toggleEditMode()">Unlock Fields</button>
      </div>
      
      <form onsubmit="updateUserData(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="user-username" placeholder="Loading..." disabled>
        </div>

        <div class="form-group">
          <label>Email Address (Locked)</label>
          <input type="email" id="user-email" disabled>
        </div>

        <div class="form-group">
          <label>Account Balance ($)</label>
          <input type="number" step="0.01" id="user-balance" placeholder="0.00" disabled>
        </div>

        <div class="form-group">
          <label>Volume Position Percentage</label>
          <div class="range-wrap">
            <input type="range" id="user-volume" min="0" max="100" value="0" disabled oninput="updateRangeText(this.value)">
            <span class="range-value" id="range-val-text">0%</span>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="save-btn" style="display: none;">Save Changes</button>
        <span id="form-status" class="status-msg"></span>
      </form>
    </div>

    <!-- Live Customer Care Chat Card -->
    <div class="card">
      <span class="card-title">Customer Care Live Chat</span>
      <div class="chat-container">
        <div class="chat-messages" id="chat-box">
          <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: auto;">Loading messages...</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Type a message to client..." onkeypress="handleKey(event)">
          <button class="chat-send-btn" onclick="sendAdminMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id');
    let isEditing = false;

    function updateRangeText(val) {
      document.getElementById('range-val-text').innerText = val + '%';
    }

    function toggleEditMode() {
      isEditing = !isEditing;
      const usernameInput = document.getElementById('user-username');
      const balanceInput = document.getElementById('user-balance');
      const volumeInput = document.getElementById('user-volume');
      const saveBtn = document.getElementById('save-btn');
      const toggleBtn = document.getElementById('toggle-edit-btn');

      usernameInput.disabled = !isEditing;
      balanceInput.disabled = !isEditing;
      volumeInput.disabled = !isEditing;

      if (isEditing) {
        saveBtn.style.display = 'block';
        toggleBtn.innerText = 'Lock Fields';
        toggleBtn.style.borderColor = '#34d399';
        toggleBtn.style.color = '#34d399';
      } else {
        saveBtn.style.display = 'none';
        toggleBtn.innerText = 'Unlock Fields';
        toggleBtn.style.borderColor = 'rgba(129, 140, 248, 0.3)';
        toggleBtn.style.color = '#818cf8';
      }
    }

    async function loadUserData() {
      if (!targetUserId) {
        alert("No user ID provided!");
        window.location.replace('referred-users.html');
        return;
      }

      // Fetch from profiles table directly
      const { data, error } = await client
        .from('profiles')
        .select('*')
        .eq('id', targetUserId)
        .maybeSingle();

      if (error || !data) {
        alert("Could not load user profile.");
        return;
      }

      document.getElementById('user-username').value = data.username || data.full_name || data.name || 'Unnamed User';
      document.getElementById('user-email').value = data.email || '';
      document.getElementById('user-balance').value = data.balance || 0;
      
      const vol = data.volume_percentage || 0;
      document.getElementById('user-volume').value = vol;
      updateRangeText(vol);

      loadMessages();
      subscribeToChat();
    }

    async function updateUserData(e) {
      e.preventDefault();
      const newUsername = document.getElementById('user-username').value.trim();
      const newBalance = parseFloat(document.getElementById('user-balance').value) || 0;
      const newVolume = parseInt(document.getElementById('user-volume').value) || 0;
      const statusEl = document.getElementById('form-status');
      const btn = document.getElementById('save-btn');

      btn.innerText = "Saving...";
      btn.disabled = true;
      statusEl.style.color = "#818cf8";
      statusEl.innerText = "Updating user data...";

      const { error } = await client
        .from('profiles')
        .update({ 
          username: newUsername,
          balance: newBalance,
          volume_percentage: newVolume
        })
        .eq('id', targetUserId);

      btn.innerText = "Save Changes";
      btn.disabled = false;

      if (error) {
        statusEl.style.color = "#f87171";
        statusEl.innerText = "Failed to update: " + error.message;
      } else {
        statusEl.style.color = "#34d399";
        statusEl.innerText = "Changes saved successfully!";
        toggleEditMode(); // Locks fields automatically after successful save
        setTimeout(() => { statusEl.innerText = ""; }, 3000);
      }
    }

    async function loadMessages() {
      const { data, error } = await client
        .from('support_messages')
        .select('*')
        .eq('user_id', targetUserId)
        .order('created_at', { ascending: true });

      const chatBox = document.getElementById('chat-box');
      if (error || !data || data.length === 0) {
        chatBox.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: auto;">No messages yet. Start the conversation!</div>`;
        return;
      }

      chatBox.innerHTML = data.map(m => `
        <div class="chat-bubble ${m.sender}">
          <div>${m.message}</div>
        </div>
      `).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function subscribeToChat() {
      client
        .channel('admin-chat-' + targetUserId)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'support_messages',
          filter: `user_id=eq.${targetUserId}`
        }, payload => {
          loadMessages();
        })
        .subscribe();
    }

    async function sendAdminMessage() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;

      const { error } = await client
        .from('support_messages')
        .insert({
          user_id: targetUserId,
          sender: 'admin',
          message: msg
        });

      if (!error) {
        input.value = '';
        loadMessages();
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendAdminMessage();
    }

    async function logout() {
      await client.auth.signOut();
      window.location.replace('login.html');
    }

    loadUserData();
  </script>
</body>
</html>
