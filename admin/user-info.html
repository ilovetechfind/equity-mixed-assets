<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - User Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0; }
    
    .edit-toggle-btn { background: rgba(129, 140, 248, 0.15); border: 1px solid rgba(129, 140, 248, 0.3); color: #818cf8; padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .edit-toggle-btn:hover { background: rgba(129, 140, 248, 0.3); }

    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #818cf8; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); }
    input:disabled { opacity: 0.7; cursor: not-allowed; background: rgba(0,0,0,0.2); color: #cbd5e1; }

    .range-wrap { display: flex; align-items: center; gap: 12px; }
    .range-wrap input[type="range"] { flex: 1; accent-color: var(--primary); cursor: pointer; }
    .range-value { font-weight: 800; color: #34d399; font-size: 1rem; min-width: 50px; text-align: right; }

    .submit-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.2s; margin-top: 10px; display: none; }
    .submit-btn:hover { opacity: 0.9; }
    .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    
    .status-msg { font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 10px; display: block; }

    /* Management Navigation Grid */
    .admin-nav-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .admin-nav-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: white; padding: 14px 16px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; text-decoration: none; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .admin-nav-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--primary); }

    /* Small Floating Bubble */
    .floating-bubble { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); cursor: pointer; z-index: 999; text-decoration: none; font-size: 20px; border: 2px solid rgba(255,255,255,0.2); transition: transform 0.2s; }
    .floating-bubble:hover { transform: scale(1.08); }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">User Info</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </header>

    <a href="referred-users.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Network List
    </a>

    <!-- Account Details Form -->
    <div class="card">
      <div class="card-title-row">
        <span class="card-title">Manage Account Details</span>
        <button type="button" class="edit-toggle-btn" id="toggle-edit-btn" onclick="toggleEditMode()">Unlock Fields</button>
      </div>
      
      <form onsubmit="updateUserData(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="user-username" placeholder="Loading..." disabled>
        </div>

        <div class="form-group">
          <label>Email Address (View Only / Locked)</label>
          <input type="email" id="user-email" disabled placeholder="Loading email...">
        </div>

        <div class="form-group">
          <label>Account Balance ($)</label>
          <input type="number" step="0.01" id="user-balance" placeholder="0.00" disabled>
        </div>

        <div class="form-group">
          <label>Volume Position Percentage</label>
          <div class="range-wrap">
            <input type="range" id="user-volume" min="0" max="100" value="0" disabled oninput="updateRangeText(this.value)">
            <span class="range-value" id="range-val-text">0%</span>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="save-btn">Save Changes</button>
        <span id="form-status" class="status-msg"></span>
      </form>
    </div>

    <!-- Management Files Card -->
    <div class="card">
      <span class="card-title">Client Control Files</span>
      <div class="admin-nav-grid">
        <a href="payment-methods.html" id="btn-payment" class="admin-nav-btn">
          <span>Payment Method Control</span>
          <span>💳</span>
        </a>
        <a href="investment-plans-admin.html" id="btn-plan" class="admin-nav-btn">
          <span>Investment Plan Control</span>
          <span>📈</span>
        </a>
        <a href="customer-care-admin.html" id="btn-chat" class="admin-nav-btn">
          <span>Customer Care Chat Control</span>
          <span>🎧</span>
        </a>
        <a href="user-notifications.html" id="btn-notifications" class="admin-nav-btn">
          <span>All Client Notifications</span>
          <span>🔔</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Clickable Small Floating Bubble -->
  <a href="customer-care-admin.html" id="bubble-link" class="floating-bubble" title="Customer Care">🎧</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id');
    let isEditing = false;

    // Append user ID to control file links if available so the files know which user is being managed
    if (targetUserId) {
      ['btn-payment', 'btn-plan', 'btn-chat', 'bubble-link', 'btn-notifications'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.setAttribute('href', el.getAttribute('href') + '?id=' + targetUserId);
        }
      });
    }

    function updateRangeText(val) {
      document.getElementById('range-val-text').innerText = val + '%';
    }

    function toggleEditMode() {
      isEditing = !isEditing;
      const usernameInput = document.getElementById('user-username');
      const balanceInput = document.getElementById('user-balance');
      const volumeInput = document.getElementById('user-volume');
      const saveBtn = document.getElementById('save-btn');
      const toggleBtn = document.getElementById('toggle-edit-btn');

      usernameInput.disabled = !isEditing;
      balanceInput.disabled = !isEditing;
      volumeInput.disabled = !isEditing;

      if (isEditing) {
        saveBtn.style.display = 'block';
        toggleBtn.innerText = 'Lock Fields';
        toggleBtn.style.borderColor = '#34d399';
        toggleBtn.style.color = '#34d399';
      } else {
        saveBtn.style.display = 'none';
        toggleBtn.innerText = 'Unlock Fields';
        toggleBtn.style.borderColor = 'rgba(129, 140, 248, 0.3)';
        toggleBtn.style.color = '#818cf8';
      }
    }

    async function loadUserData() {
      if (!targetUserId) {
        alert("No user ID provided!");
        window.location.replace('referred-users.html');
        return;
      }

      const { data, error } = await client
        .from('profiles')
        .select('*')
        .eq('id', targetUserId)
        .maybeSingle();

      if (error || !data) {
        alert("Could not load user profile.");
        return;
      }

      document.getElementById('user-username').value = data.username || data.full_name || data.name || '';
      document.getElementById('user-email').value = data.email || data.user_email || 'Not available';
      document.getElementById('user-balance').value = data.balance || 0;
      
      const vol = data.volume_percentage || 0;
      document.getElementById('user-volume').value = vol;
      updateRangeText(vol);
    }

    async function updateUserData(e) {
      e.preventDefault();
      const newUsername = document.getElementById('user-username').value.trim();
      const newBalance = parseFloat(document.getElementById('user-balance').value) || 0;
      const newVolume = parseInt(document.getElementById('user-volume').value) || 0;
      const statusEl = document.getElementById('form-status');
      const btn = document.getElementById('save-btn');

      btn.innerText = "Saving...";
      btn.disabled = true;
      statusEl.style.color = "#818cf8";
      statusEl.innerText = "Updating user data...";

      const { error } = await client
        .from('profiles')
        .update({ 
          username: newUsername,
          balance: newBalance,
          volume_percentage: newVolume
        })
        .eq('id', targetUserId);

      btn.innerText = "Save Changes";
      btn.disabled = false;

      if (error) {
        statusEl.style.color = "#f87171";
        statusEl.innerText = "Failed to update: " + error.message;
      } else {
        statusEl.style.color = "#34d399";
        statusEl.innerText = "Changes saved successfully!";
        toggleEditMode();
        setTimeout(() => { statusEl.innerText = ""; }, 3000);
      }
    }

    async function logout() {
      await client.auth.signOut();
      window.location.replace('login.html');
    }

    loadUserData();
  </script>
</body>
</html>
