<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-glow: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --text-muted: #94a3b8;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      min-height: 100vh;
      display: flex; 
      align-items: center;
      justify-content: center; 
    }

    .container { width: 100%; max-width: 400px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 24px; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 600; }
    input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; }
    input:focus { border-color: #6366f1; }
    
    .submit-btn { background: var(--primary-glow); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1 class="logo-text">Admin Login</h1>
      <form onsubmit="adminLogin(event)">
        <div class="input-group">
          <label>Admin Email</label>
          <input type="email" id="admin-email" placeholder="admin@equitymixed.com" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn" id="login-btn">Sign In to Dashboard</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function adminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('login-btn');
      
      btn.innerText = "Signing in...";
      btn.disabled = true;

      const { data, error } = await client.auth.signInWithPassword({ email, password });
      
      if (error) {
        alert("Login failed: " + error.message);
        btn.innerText = "Sign In to Dashboard";
        btn.disabled = false;
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
