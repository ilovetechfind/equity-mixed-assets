<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Edit Custom Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }
    body { background: var(--bg-gradient); background-attachment: fixed; color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 16px; }
    .container { width: 100%; max-width: 720px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #818cf8; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-bottom: 20px; }
    .back-link:hover { text-decoration: underline; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); position: relative; }
    .card-header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .card-title { font-size: 1.2rem; font-weight: 700; margin: 0 0 4px 0; }
    .card-subtitle { font-size: 0.85rem; color: var(--text-muted); margin: 0; }
    .edit-btn { background: rgba(99, 102, 241, 0.2); border: 1px solid var(--primary); color: #818cf8; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
    .edit-btn:hover { background: var(--primary); color: white; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    input, textarea { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; font-family: inherit; }
    input:disabled, textarea:disabled { opacity: 0.7; cursor: not-allowed; background: rgba(0,0,0,0.1); }
    input:focus:not(:disabled), textarea:focus:not(:disabled) { border-color: var(--primary); }
    .file-input-wrapper { display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px; border-radius: 10px; }
    .file-input-wrapper input[type="file"] { border: none; padding: 0; background: transparent; color: var(--text-muted); font-size: 0.85rem; }
    .action-container { display: none; margin-top: 10px; }
    .submit-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    .submit-btn:hover { opacity: 0.9; }
    .status-msg { font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 10px; display: block; }
    .preview-img { margin-top: 10px; max-width: 120px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); display: none; }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" id="back-hub" class="back-link">Back to Payment Hub</a>
    <div class="card">
      <div class="card-header-flex">
        <div>
          <h2 class="card-title">Request Custom Payment</h2>
          <p class="card-subtitle" id="lock-status-text">Locked (Read-Only)</p>
        </div>
        <button type="button" class="edit-btn" id="unlock-btn" onclick="enableEditing()">Edit Details</button>
      </div>
      <form onsubmit="saveCustomConfig(event)">
        <div class="form-group">
          <label>Custom Payment Destination / Identifier</label>
          <input type="text" id="custom-wallet" placeholder="Enter custom handle..." autocomplete="off" disabled>
        </div>
        <div class="form-group">
          <label>Upload Reference Picture / QR Code</label>
          <div class="file-input-wrapper" id="file-box" style="opacity: 0.6; pointer-events: none;">
            <input type="file" id="custom-image-file" accept="image/*" onchange="previewImage(event)" disabled>
          </div>
          <img id="image-preview" class="preview-img" alt="Preview">
          <input type="hidden" id="custom-image-url">
        </div>
        <div class="form-group">
          <label>Instructions</label>
          <textarea id="custom-instructions" rows="4" placeholder="Enter instructions here..." disabled></textarea>
        </div>
        <div class="action-container" id="action-buttons">
          <button type="submit" class="submit-btn" id="save-btn">Save Changes</button>
        </div>
        <span id="form-status" class="status-msg"></span>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id');
    if (targetUserId) { document.getElementById('back-hub').setAttribute('href', `payment-methods.html?id=${targetUserId}`); }
    function enableEditing() {
      document.getElementById('custom-wallet').disabled = false;
      document.getElementById('custom-instructions').disabled = false;
      document.getElementById('custom-image-file').disabled = false;
      document.getElementById('file-box').style.opacity = "1";
      document.getElementById('file-box').style.pointerEvents = "auto";
      document.getElementById('action-buttons').style.display = "block";
      document.getElementById('unlock-btn').style.display = "none";
      document.getElementById('lock-status-text').innerText = "Unlocked for Editing";
      document.getElementById('lock-status-text').style.color = "#34d399";
    }
    function lockEditing() {
      document.getElementById('custom-wallet').disabled = true;
      document.getElementById('custom-instructions').disabled = true;
      document.getElementById('custom-image-file').disabled = true;
      document.getElementById('file-box').style.opacity = "0.6";
      document.getElementById('file-box').style.pointerEvents = "none";
      document.getElementById('action-buttons').style.display = "none";
      document.getElementById('unlock-btn').style.display = "block";
      document.getElementById('lock-status-text').innerText = "Locked (Read-Only)";
      document.getElementById('lock-status-text').style.color = "var(--text-muted)";
    }
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('image-preview');
          preview.src = e.target.result;
          preview.style.display = 'block';
          document.getElementById('custom-image-url').value = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    }
    async function loadCustomConfig() {
      if (!targetUserId) return;
      const { data } = await client.from('payment_configs').select('custom').eq('user_id', targetUserId).maybeSingle();
      if (data && data.custom) {
        try {
          const parsed = typeof data.custom === 'string' ? JSON.parse(data.custom) : data.custom;
          document.getElementById('custom-wallet').value = parsed.wallet || '';
          document.getElementById('custom-instructions').value = parsed.instructions || '';
          if (parsed.image) {
            document.getElementById('custom-image-url').value = parsed.image;
            const preview = document.getElementById('image-preview');
            preview.src = parsed.image;
            preview.style.display = 'block';
          }
        } catch (err) { document.getElementById('custom-instructions').value = data.custom; }
      }
      lockEditing();
    }
    async function saveCustomConfig(e) {
      e.preventDefault();
      const wallet = document.getElementById('custom-wallet').value.trim();
      const image = document.getElementById('custom-image-url').value.trim();
      const instructions = document.getElementById('custom-instructions').value.trim();
      const statusEl = document.getElementById('form-status');
      const btn = document.getElementById('save-btn');
      if (!targetUserId) { alert("User ID missing."); return; }
      btn.innerText = "Saving..."; btn.disabled = true;
      const payloadData = JSON.stringify({ wallet, image, instructions });
      const { error } = await client.from('payment_configs').upsert({ user_id: targetUserId, custom: payloadData }, { onConflict: 'user_id' });
      btn.innerText = "Save Changes"; btn.disabled = false;
      if (error) {
        statusEl.style.color = "#f87171"; statusEl.innerText = "Error: " + error.message;
      } else {
        statusEl.style.color = "#34d399"; statusEl.innerText = "Custom details saved and locked!";
        setTimeout(() => { statusEl.innerText = ""; lockEditing(); }, 1500);
      }
    }
    loadCustomConfig();
  </script>
</body>
</html>
