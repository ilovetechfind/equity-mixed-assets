<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Referred Users</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; display: block; text-transform: uppercase; }
    
    .stats-box { font-size: 1.1rem; font-weight: 700; color: #34d399; margin-bottom: 16px; }

    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th, td { padding: 14px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    th { color: var(--text-muted); font-weight: 600; }
    td { color: #f8fafc; }
    
    .view-btn { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); color: #818cf8; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 0.75rem; transition: background 0.2s; display: inline-block; }
    .view-btn:hover { background: rgba(99, 102, 241, 0.25); }

    .copy-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #c084fc; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; margin-left: 6px; font-weight: 600; }
    .copy-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(19, 17, 53, 0.85); backdrop-filter: blur(16px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 600; gap: 6px; transition: color 0.2s; }
    .nav-item:hover, .nav-item.active { color: #818cf8; }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">Network List</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </header>

    <div class="card">
      <span class="card-title">Users Who Joined With Your Code</span>
      <div class="stats-box" id="user-count-display">Total Users Joined: 0</div>
      
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>User ID</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Balance</th>
              <th>Joined</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="referred-users-body">
            <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading network data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Home
    </a>
    <a href="referred-users.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Users
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    async function checkAdminAndLoad() {
      const { data: { session }, error } = await client.auth.getSession();
      let currentUser = null;
      
      if (!session || error) {
        const { data: { user } } = await client.auth.getUser();
        if (!user) { 
          window.location.replace('login.html'); 
          return; 
        }
        currentUser = user;
      } else {
        currentUser = session.user;
      }

      // Get the admin's referral code
      const { data: profile, error: profileError } = await client
        .from('profiles')
        .select('referral_code')
        .eq('id', currentUser.id)
        .maybeSingle();

      if (profileError) {
        console.error('Error fetching profile:', profileError);
        document.getElementById('referred-users-body').innerHTML = `<tr><td colspan="6" style="text-align: center; color: #f87171;">Error loading profile.</td></tr>`;
        return;
      }

      const code = profile?.referral_code;

      if (!code || code.trim() === '') {
        document.getElementById('user-count-display').innerText = "Total Users Joined: 0";
        document.getElementById('referred-users-body').innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Please set up your referral code in the Home dashboard first.</td></tr>`;
        return;
      }

      loadReferredUsersList(code);
    }

    async function loadReferredUsersList(code) {
      // Query the profiles table directly – using the correct column names
      const { data, error } = await client
        .from('profiles')
        .select('id, full_name, email, balance, created_at')
        .eq('referred_by', code)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('referred-users-body');
      const countDisplay = document.getElementById('user-count-display');

      if (error) {
        console.error('Error loading referred users:', error);
        countDisplay.innerText = "Total Users Joined: 0";
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #f87171;">Error loading users: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        countDisplay.innerText = "Total Users Joined: 0";
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No users have joined with your code yet.</td></tr>`;
        return;
      }

      countDisplay.innerText = `Total Users Joined: ${data.length}`;

      tbody.innerHTML = data.map(user => `
        <tr>
          <td>
            <div style="display: flex; align-items: center;">
              <span style="font-family: monospace; color: #94a3b8;">${user.id ? user.id.substring(0, 6) + '...' : 'N/A'}</span>
              <button class="copy-btn" onclick="copyId('${user.id}')">Copy</button>
            </div>
          </td>
          <td><strong>${user.full_name || 'N/A'}</strong></td>
          <td>${user.email || 'N/A'}</td>
          <td>$${Number(user.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
          <td>${user.created_at ? new Date(user.created_at).toLocaleDateString() : 'N/A'}</td>
          <td><a href="user-info.html?id=${user.id}" class="view-btn">View Info</a></td>
        </tr>
      `).join('');
    }

    function copyId(id) {
      if(id && id !== 'undefined') {
        navigator.clipboard.writeText(id).then(() => {
          alert('Full User ID copied to clipboard!');
        }).catch(() => {
          alert('Could not copy. Select the ID manually.');
        });
      }
    }

    async function logout() {
      await client.auth.signOut();
      window.location.replace('login.html');
    }

    checkAdminAndLoad();
  </script>
</body>
</html>
