<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
    }

    .container { width: 100%; max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; display: block; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { color: var(--text-muted); font-weight: 600; }
    
    .id-img { width: 50px; height: 35px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: rgba(250, 204, 21, 0.15); color: #facc15; }
    
    .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">Admin Panel — Verifications</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </header>

    <div class="card">
      <span class="card-title">USER SUBMITTED KYC VERIFICATIONS</span>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Gmail</th>
              <th>Phone</th>
              <th>SSN</th>
              <th>ID Front</th>
              <th>ID Back</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="verification-table-body">
            <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Loading records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAdmin() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      loadVerifications();
    }

    async function loadVerifications() {
      const { data, error } = await client
        .from('user_verifications')
        .select('*')
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('verification-table-body');
      
      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No verification records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr>
          <td><strong>${item.full_name || 'N/A'}</strong></td>
          <td>${item.gmail || 'N/A'}</td>
          <td>${item.phone_number || 'N/A'}</td>
          <td><code>${item.ssn || 'N/A'}</code></td>
          <td><a href="${item.id_front_url}" target="_blank"><img src="${item.id_front_url}" class="id-img" alt="Front"></a></td>
          <td><a href="${item.id_back_url}" target="_blank"><img src="${item.id_back_url}" class="id-img" alt="Back"></a></td>
          <td><span class="badge">${item.status}</span></td>
        </tr>
      `).join('');
    }

    async function logout() {
      await client.auth.signOut();
      window.location.href = 'login.html';
    }

    checkAdmin();
  </script>
</bod

</html>
