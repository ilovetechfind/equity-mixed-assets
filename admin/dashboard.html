<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; display: block; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { color: var(--text-muted); font-weight: 600; }
    
    .id-img { width: 45px; height: 32px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge.pending { background: rgba(250, 204, 21, 0.15); color: #facc15; }
    .badge.approved { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .badge.rejected { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

    .action-btns { display: flex; gap: 6px; }
    .btn-approve { background: #059669; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.75rem; }
    .btn-reject { background: #dc2626; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.75rem; }

    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .input-group { flex: 1; min-width: 200px; }
    .input-group label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 600; }
    input, select { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; }
    input:focus, select:focus { border-color: #6366f1; }
    input:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .submit-btn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; height: 45px; }
    .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .code-display { font-size: 1.4rem; font-weight: 800; color: #818cf8; background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); display: inline-block; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">Admin Control Panel</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </header>

    <!-- Admin Referral Code Card -->
    <div class="card">
      <span class="card-title">YOUR ADMIN REFERRAL CODE</span>
      <div>
        <div class="code-display" id="admin-ref-code">Loading...</div>
      </div>
      <div class="form-row" id="code-input-container" style="margin-top: 10px; display: none;">
        <div class="input-group" style="max-width: 300px;">
          <input type="text" id="new-ref-code" placeholder="Set custom code">
        </div>
        <button class="submit-btn" id="save-code-btn" onclick="saveAdminCode()">Save Code</button>
      </div>
    </div>

    <!-- Users Joined Using Admin Code -->
    <div class="card">
      <span class="card-title">USERS WHO JOINED WITH YOUR REFERRAL CODE</span>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Gmail</th>
              <th>Balance</th>
              <th>Joined Date</th>
            </tr>
          </thead>
          <tbody id="referred-users-body">
            <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading referred users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Balance Management Card -->
    <div class="card">
      <span class="card-title">MANAGE USER BALANCES</span>
      <form onsubmit="updateBalance(event)" class="form-row">
        <div class="input-group">
          <label>User Gmail</label>
          <input type="email" id="target-email" placeholder="user@gmail.com" required>
        </div>
        <div class="input-group">
          <label>Amount ($)</label>
          <input type="number" step="0.01" id="target-amount" placeholder="5000.00" required>
        </div>
        <div class="input-group" style="max-width: 150px;">
          <label>Action</label>
          <select id="balance-action">
            <option value="add">Add (+)</option>
            <option value="subtract">Subtract (-)</option>
            <option value="set">Set Exact</option>
          </select>
        </div>
        <button type="submit" class="submit-btn" id="balance-btn">Update Balance</button>
      </form>
    </div>

    <!-- Verifications Card -->
    <div class="card">
      <span class="card-title">USER SUBMITTED KYC VERIFICATIONS</span>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Gmail</th>
              <th>Phone</th>
              <th>SSN</th>
              <th>ID Front</th>
              <th>ID Back</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="verification-table-body">
            <tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Loading records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentAdminId = null;

    async function checkAdmin() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentAdminId = user.id;
      loadAdminCode();
      loadVerifications();
    }

    async function loadAdminCode() {
      const { data: profile } = await client
        .from('profiles')
        .select('referral_code')
        .eq('id', currentAdminId)
        .single();

      const existingCode = profile?.referral_code;

      if (existingCode && existingCode.trim() !== '') {
        // Code is already set and locked in
        document.getElementById('admin-ref-code').innerText = existingCode;
        document.getElementById('code-input-container').style.display = 'none';
        loadReferredUsers(existingCode);
      } else {
        // No code set yet, show input and save button
        document.getElementById('admin-ref-code').innerText = 'Not Set Yet';
        document.getElementById('code-input-container').style.display = 'flex';
        document.getElementById('referred-users-body').innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Please set your referral code first.</td></tr>`;
      }
    }

    async function saveAdminCode() {
      const newCode = document.getElementById('new-ref-code').value.trim();
      if (!newCode) {
        alert("Please enter a valid referral code.");
        return;
      }

      const { error } = await client
        .from('profiles')
        .update({ referral_code: newCode })
        .eq('id', currentAdminId);

      if (error) {
        alert("Failed to save code: " + error.message);
      } else {
        alert("Admin referral code locked in successfully!");
        loadAdminCode();
      }
    }

    async function loadReferredUsers(code) {
      const { data, error } = await client
        .from('profiles')
        .select('username, email, balance, created_at')
        .eq('referred_by', code)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('referred-users-body');

      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No users joined with this code yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(user => `
        <tr>
          <td><strong>${user.username || 'N/A'}</strong></td>
          <td>${user.email || 'N/A'}</td>
          <td>$${Number(user.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
          <td>${new Date(user.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    async function loadVerifications() {
      const { data, error } = await client
        .from('user_verifications')
        .select('*')
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('verification-table-body');
      
      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">No verification records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr>
          <td><strong>${item.full_name || 'N/A'}</strong></td>
          <td>${item.gmail || 'N/A'}</td>
          <td>${item.phone_number || 'N/A'}</td>
          <td><code>${item.ssn || 'N/A'}</code></td>
          <td><a href="${item.id_front_url}" target="_blank"><img src="${item.id_front_url}" class="id-img" alt="Front"></a></td>
          <td><a href="${item.id_back_url}" target="_blank"><img src="${item.id_back_url}" class="id-img" alt="Back"></a></td>
          <td><span class="badge ${item.status}">${item.status}</span></td>
          <td>
            <div class="action-btns">
              <button class="btn-approve" onclick="updateStatus('${item.id}', 'approved')">Approve</button>
              <button class="btn-reject" onclick="updateStatus('${item.id}', 'rejected')">Reject</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, newStatus) {
      const { error } = await client
        .from('user_verifications')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert("Failed to update status: " + error.message);
      } else {
        loadVerifications();
      }
    }

    async function updateBalance(e) {
      e.preventDefault();
      const email = document.getElementById('target-email').value;
      const amount = parseFloat(document.getElementById('target-amount').value);
      const action = document.getElementById('balance-action').value;
      const btn = document.getElementById('balance-btn');

      btn.innerText = "Updating...";
      btn.disabled = true;

      const { data: profile, error: profileError } = await client
        .from('profiles')
        .select('id, balance')
        .eq('email', email)
        .single();

      if (profileError || !profile) {
        alert("User profile not found with that email.");
        btn.innerText = "Update Balance";
        btn.disabled = false;
        return;
      }

      let currentBalance = Number(profile.balance || 0);
      let newBalance = currentBalance;

      if (action === 'add') {
        newBalance += amount;
      } else if (action === 'subtract') {
        newBalance -= amount;
      } else if (action === 'set') {
        newBalance = amount;
      }

      const { error: updateError } = await client
        .from('profiles')
        .update({ balance: newBalance })
        .eq('id', profile.id);

      if (updateError) {
        alert("Failed to update balance: " + updateError.message);
      } else {
        alert(`Balance successfully updated to $${newBalance.toLocaleString(undefined, {minimumFractionDigits: 2})}`);
        document.getElementById('target-email').value = '';
        document.getElementById('target-amount').value = '';
      }

      btn.innerText = "Update Balance";
      btn.disabled = false;
    }

    async function logout() {
      await client.auth.signOut();
      window.location.href = 'login.html';
    }

    checkAdmin();
  </script>
</body>
</html>
