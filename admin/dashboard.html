<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; display: block; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { color: var(--text-muted); font-weight: 600; }
    
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .input-group { flex: 1; min-width: 200px; }
    input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; }
    input:focus { border-color: #6366f1; }
    
    .submit-btn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; height: 45px; }
    .copy-btn { background: rgba(129, 140, 248, 0.15); border: 1px solid rgba(129, 140, 248, 0.3); color: #818cf8; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; height: 45px; }
    .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    
    .code-container { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .code-display { font-size: 1.4rem; font-weight: 800; color: #818cf8; background: rgba(0, 0, 0, 0.2); padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); display: inline-block; }
    .stats-box { font-size: 1.1rem; font-weight: 700; color: #34d399; margin-bottom: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">Admin Control Panel</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </header>

    <!-- Admin Referral Code Card -->
    <div class="card">
      <span class="card-title">YOUR ADMIN REFERRAL CODE</span>
      
      <!-- View / Copy Mode -->
      <div id="code-view-section" style="display: none;">
        <div class="code-container">
          <div class="code-display" id="displayed-admin-code"></div>
          <button class="copy-btn" onclick="copyAdminCode()">Copy Code</button>
        </div>
      </div>

      <!-- Set / Generate Mode -->
      <div id="code-set-section" style="display: none;">
        <form onsubmit="saveAdminCode(event)" class="form-row">
          <div class="input-group" style="max-width: 300px;">
            <input type="text" id="new-ref-code" placeholder="Enter referral code (e.g. ADMIN500)" required>
          </div>
          <button type="submit" class="submit-btn" id="save-code-btn">Save & Lock Code</button>
        </form>
      </div>
    </div>

    <!-- Users Joined Using Admin Code Section -->
    <div class="card">
      <span class="card-title">USERS WHO JOINED WITH YOUR REFERRAL CODE</span>
      <div class="stats-box" id="user-count-display">Total Users Joined: 0</div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Gmail</th>
              <th>Balance</th>
              <th>Joined Date</th>
            </tr>
          </thead>
          <tbody id="referred-users-body">
            <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading referred users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24ildpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentAdminUser = null;
    let savedCodeValue = '';

    async function checkAdmin() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) { 
        window.location.replace('login.html'); 
        return; 
      }
      currentAdminUser = user;
      loadAdminCode();
    }

    async function loadAdminCode() {
      const { data: profile, error } = await client
        .from('profiles')
        .select('referral_code')
        .eq('id', currentAdminUser.id)
        .maybeSingle();

      savedCodeValue = profile?.referral_code;

      if (savedCodeValue && savedCodeValue.trim() !== '') {
        document.getElementById('displayed-admin-code').innerText = savedCodeValue;
        document.getElementById('code-view-section').style.display = 'block';
        document.getElementById('code-set-section').style.display = 'none';
        loadReferredUsers(savedCodeValue);
      } else {
        document.getElementById('code-view-section').style.display = 'none';
        document.getElementById('code-set-section').style.display = 'block';
        document.getElementById('user-count-display').innerText = "Total Users Joined: 0";
        document.getElementById('referred-users-body').innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Please set your referral code first.</td></tr>`;
      }
    }

    async function saveAdminCode(e) {
      e.preventDefault();
      const newCode = document.getElementById('new-ref-code').value.trim();
      if (!newCode) return;

      const btn = document.getElementById('save-code-btn');
      btn.innerText = "Saving...";
      btn.disabled = true;

      const { error } = await client
        .from('profiles')
        .upsert({ 
          id: currentAdminUser.id, 
          referral_code: newCode 
        });

      if (error) {
        alert("Failed to save code: " + error.message);
        btn.innerText = "Save & Lock Code";
        btn.disabled = false;
      } else {
        alert("Admin referral code locked in successfully!");
        loadAdminCode();
      }
    }

    function copyAdminCode() {
      if (!savedCodeValue) return;
      navigator.clipboard.writeText(savedCodeValue).then(() => {
        alert("Referral code copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy code.");
      });
    }

    async function loadReferredUsers(code) {
      const { data, error } = await client
        .from('user_profiles_view')
        .select('*')
        .eq('referred_by', code)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('referred-users-body');
      const countDisplay = document.getElementById('user-count-display');

      if (error || !data || data.length === 0) {
        countDisplay.innerText = "Total Users Joined: 0";
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No users joined with this code yet.</td></tr>`;
        return;
      }

      countDisplay.innerText = `Total Users Joined: ${data.length}`;

      tbody.innerHTML = data.map(user => `
        <tr>
          <td><strong>${user.username || 'N/A'}</strong></td>
          <td>${user.email || 'N/A'}</td>
          <td>$${Number(user.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
          <td>${new Date(user.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    async function logout() {
      await client.auth.signOut();
      window.location.replace('login.html');
    }

    checkAdmin();
  </script>
</body>
  </html>
