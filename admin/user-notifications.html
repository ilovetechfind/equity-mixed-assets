<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - User Notifications</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Your existing styles (unchanged) */
    :root { /* ... */ }
    body { /* ... */ }
    .container { /* ... */ }
    /* ... keep all your existing CSS ... */
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="logo-text">User Activity Logs</h1>
      <button class="refresh-btn" onclick="loadNotifications()">Refresh Log</button>
    </header>

    <a href="#" id="back-to-info" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to User Details
    </a>

    <div class="card">
      <div class="card-title-row">
        <span class="card-title" id="user-header-title">Client Submissions & Alerts</span>
      </div>

      <div class="notif-list" id="notif-container">
        <div class="empty-msg">Fetching client notifications...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    // Ensure client is defined
    let client = window.client || supabase;

    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id');

    if (targetUserId) {
      document.getElementById('back-to-info').setAttribute('href', 'user-info.html?id=' + targetUserId);
    } else {
      document.getElementById('back-to-info').setAttribute('href', 'referred-users.html');
    }

    function createNotifHTML(item) {
      let icon = '🔔';
      if (item.type?.toLowerCase().includes('ssn') || item.type?.toLowerCase().includes('id') || item.type?.toLowerCase().includes('verification')) icon = '🪪';
      if (item.type?.toLowerCase().includes('deposit') || item.type?.toLowerCase().includes('payment')) icon = '💳';
      if (item.type?.toLowerCase().includes('withdraw')) icon = '💸';

      return `
        <div class="notif-item">
          <div class="notif-header">
            <span class="notif-type">${icon} ${item.type || 'Activity Alert'}</span>
            <span class="notif-date">${new Date(item.created_at).toLocaleString()}</span>
          </div>
          <p class="notif-body">${item.message || 'No description provided.'}</p>
          ${item.image_url ? `<img src="${item.image_url}" class="proof-img" alt="Uploaded Document / Proof" />` : ''}
        </div>
      `;
    }

    async function loadNotifications() {
      const container = document.getElementById('notif-container');

      if (!targetUserId) {
        container.innerHTML = `<div class="empty-msg">No user specified.</div>`;
        return;
      }

      const { data, error } = await client
        .from('notifications')
        .select('*')
        .eq('user_id', targetUserId)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="empty-msg" style="color: #f87171;">Failed to load logs: ${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="empty-msg">No client activity recorded yet.</div>`;
        return;
      }

      container.innerHTML = data.map(item => createNotifHTML(item)).join('');
    }

    function subscribeRealtime() {
      if (!targetUserId) return;

      client
        .channel('notifs-' + targetUserId)
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'notifications',
            filter: `user_id=eq.${targetUserId}`
          },
          (payload) => {
            const container = document.getElementById('notif-container');
            if (container.querySelector('.empty-msg')) {
              container.innerHTML = '';
            }
            container.insertAdjacentHTML('afterbegin', createNotifHTML(payload.new));
          }
        )
        .subscribe();
    }

    loadNotifications();
    subscribeRealtime();
  </script>
</body>
</html>
