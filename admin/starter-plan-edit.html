<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Edit Starter Plan Payment Wall</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 14px 0; }
    
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #818cf8; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); }

    .submit-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.2s; margin-top: 10px; }
    .submit-btn:hover { opacity: 0.9; }
    .status-msg { font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 10px; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">Starter Plan Payment Wall</h1>
    </header>

    <a href="#" id="back-link" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Plans Control
    </a>

    <div class="card">
      <h2 class="card-title">Configure Complete Payment Wall & Dashboard Parameters</h2>
      <form onsubmit="savePlanConfig(event)">
        
        <div class="form-group">
          <label>Day Text (e.g., Day 27 of 30)</label>
          <input type="text" id="input-day" value="Day 27 of 30">
        </div>

        <div class="form-group">
          <label>Current Value (e.g., $274,285.20)</label>
          <input type="text" id="input-current" value="$274,285.20">
        </div>

        <div class="form-group">
          <label>Paid Volume Text (e.g., $140,000 / $200,000 Paid)</label>
          <input type="text" id="input-paid-volume" value="$140,000 / $200,000 Paid">
        </div>

        <div class="form-group">
          <label>Progress Bar Percentage (0 to 100)</label>
          <input type="number" id="input-progress" value="70" min="0" max="100">
        </div>

        <div class="form-group">
          <label>Time Remaining Subtext</label>
          <input type="text" id="input-time-remaining" value="3 days remaining to clear installment structure and unlock total maturity claim.">
        </div>

        <div class="form-group">
          <label>Total Investment Goal ($)</label>
          <input type="text" id="input-total-goal" value="$200,000">
        </div>

        <div class="form-group">
          <label>Remaining Balance ($)</label>
          <input type="text" id="input-remaining" value="$60,000">
        </div>

        <div class="form-group">
          <label>Guaranteed Payout Return ($)</label>
          <input type="text" id="input-payout" value="$1,000,000">
        </div>

        <div class="form-group">
          <label>Installment Button Text</label>
          <input type="text" id="input-btn-text" value="Pay Next Installment ($60,000)">
        </div>

        <button type="submit" class="submit-btn" id="save-btn">Save Complete Payment Wall Settings</button>
        <span id="form-status" class="status-msg"></span>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id') || 'default_user';

    const backLink = document.getElementById('back-link');
    backLink.setAttribute('href', `investment-plans-admin.html?id=${targetUserId}`);

    const storageKey = `config_starter_full_${targetUserId}`;

    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem(storageKey);
      if (saved) {
        try {
          const data = JSON.parse(saved);
          document.getElementById('input-day').value = data.dayText || 'Day 27 of 30';
          document.getElementById('input-current').value = data.currentValue || '$274,285.20';
          document.getElementById('input-paid-volume').value = data.paidVolumeText || '$140,000 / $200,000 Paid';
          document.getElementById('input-progress').value = data.progressPercent || 70;
          document.getElementById('input-time-remaining').value = data.timeRemaining || '3 days remaining to clear installment structure and unlock total maturity claim.';
          document.getElementById('input-total-goal').value = data.totalGoal || '$200,000';
          document.getElementById('input-remaining').value = data.remainingBalance || '$60,000';
          document.getElementById('input-payout').value = data.guaranteedPayout || '$1,000,000';
          document.getElementById('input-btn-text').value = data.installmentButtonText || 'Pay Next Installment ($60,000)';
        } catch (e) {}
      }
    });

    function savePlanConfig(e) {
      e.preventDefault();
      const data = {
        dayText: document.getElementById('input-day').value,
        currentValue: document.getElementById('input-current').value,
        paidVolumeText: document.getElementById('input-paid-volume').value,
        progressPercent: document.getElementById('input-progress').value,
        timeRemaining: document.getElementById('input-time-remaining').value,
        totalGoal: document.getElementById('input-total-goal').value,
        remainingBalance: document.getElementById('input-remaining').value,
        guaranteedPayout: document.getElementById('input-payout').value,
        installmentButtonText: document.getElementById('input-btn-text').value
      };
      
      const statusEl = document.getElementById('form-status');
      localStorage.setItem(storageKey, JSON.stringify(data));

      statusEl.style.color = "#34d399";
      statusEl.innerText = "Payment wall and graph values updated successfully!";
      setTimeout(() => { statusEl.innerText = ""; }, 3000);
    }
  </script>
</body>
</html>
