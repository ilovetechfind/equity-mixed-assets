<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Admin Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%); color: #fff;
    }
    .card {
      max-width: 420px; width: 100%; background: rgba(30,27,75,0.7);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 28px; text-align: center;
    }
    h1 { font-size: 1.3rem; margin: 0 0 10px; }
    p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; margin: 0 0 18px; }
    .status {
      display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800;
      letter-spacing: 0.5px; margin-bottom: 16px;
    }
    .pending { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.35); }
    .revoked { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
    .btn {
      width: 100%; border: none; border-radius: 12px; padding: 14px; font-weight: 700;
      cursor: pointer; font-size: 0.95rem; margin-bottom: 10px;
    }
    .primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; }
    .ghost { background: rgba(255,255,255,0.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.12); }
    .msg { min-height: 20px; font-size: 0.85rem; font-weight: 600; margin-top: 8px; }
    .email { color: #c7d2fe; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; }
    .form-block { text-align: left; margin-bottom: 14px; }
    label { display: block; font-size: 0.72rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.4px; }
    input[type="text"], input[type="tel"] {
      width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12);
      color: #fff; padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none; margin-bottom: 12px;
    }
    input:focus { border-color: #818cf8; }
    .selfie-wrap {
      border: 1px dashed rgba(129,140,248,0.45); border-radius: 14px; padding: 16px; text-align: center;
      margin-bottom: 12px; background: rgba(0,0,0,0.25);
    }
    .selfie-wrap img {
      max-width: 160px; max-height: 160px; border-radius: 12px; display: block; margin: 0 auto 12px;
      border: 2px solid rgba(129,140,248,0.5);
    }
    #selfie {
      position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; z-index: -1;
    }
    .selfie-btn {
      display: block; width: 100%; box-sizing: border-box;
      border: none; border-radius: 12px; padding: 16px;
      background: linear-gradient(135deg, #818cf8, #6366f1); color: #fff;
      font-weight: 800; font-size: 0.95rem; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .selfie-btn:active { opacity: 0.85; }
    .hint-sm { font-size: 0.75rem; color: #64748b; margin: 8px 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status pending" id="status-badge">ACCESS PENDING</div>
    <h1>Admin Access Required</h1>
    <div class="email" id="email-line"></div>
    <p id="desc">
      Fill in your details below to request admin access. A developer will review and approve.
    </p>

    <div class="form-block" id="request-form">
      <label for="nin">NIN (National Identification Number)</label>
      <input type="text" id="nin" maxlength="20" placeholder="e.g. 12345678901" autocomplete="off">

      <label for="phone">Phone number (OPay)</label>
      <input type="tel" id="phone" maxlength="15" placeholder="e.g. 08012345678" autocomplete="tel">
      <p class="hint-sm" style="margin:-6px 0 12px">Use the same number registered on your OPay account.</p>

      <label>Selfie</label>
      <div class="selfie-wrap">
        <img id="selfie-preview" alt="Selfie preview" style="display:none">
        <input type="file" id="selfie" accept="image/*" >
        <button type="button" class="selfie-btn" id="selfie-btn">📷 Take or upload selfie</button>
        <p class="hint-sm">Tap the button — camera or gallery will open.</p>
      </div>
    </div>

    <button class="btn primary" id="request-btn" onclick="requestAccess()">Request Admin Access</button>
    <button class="btn ghost" onclick="logout()">Log Out</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let userId = null;
    let selfieDataUrl = null;

    function onSelfieChange(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) {
        selfieDataUrl = null;
        document.getElementById('selfie-preview').style.display = 'none';
        document.getElementById('selfie-btn').textContent = '📷 Take or upload selfie';
        return;
      }
      if (file.size > 3 * 1024 * 1024) {
        alert('Selfie must be under 3 MB. Try a smaller photo.');
        e.target.value = '';
        selfieDataUrl = null;
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        selfieDataUrl = reader.result;
        var img = document.getElementById('selfie-preview');
        img.src = selfieDataUrl;
        img.style.display = 'block';
        document.getElementById('selfie-btn').textContent = '✓ Change selfie';
      };
      reader.onerror = function () {
        alert('Could not read that photo. Try again.');
      };
      reader.readAsDataURL(file);
    }

    function pickSelfie() {
      var input = document.getElementById('selfie');
      input.value = '';
      input.click();
    }

    async function init() {
      document.getElementById('selfie').addEventListener('change', onSelfieChange);
      document.getElementById('selfie-btn').addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        pickSelfie();
      });

      const { data: { session } } = await client.auth.getSession();
      let user = session && session.user;
      if (!user) {
        const r = await client.auth.getUser();
        user = r.data && r.data.user;
      }
      if (!user) { location.replace('login.html'); return; }
      userId = user.id;
      document.getElementById('email-line').textContent = user.email || user.id;

      const { data: profile } = await client.from('profiles')
        .select('admin_access, admin_status, admin_nin, admin_phone, admin_selfie')
        .eq('id', userId).maybeSingle();

      if (profile && profile.admin_access === true) {
        location.replace('dashboard.html');
        return;
      }

      if (profile && profile.admin_nin) document.getElementById('nin').value = profile.admin_nin;
      if (profile && profile.admin_phone) document.getElementById('phone').value = profile.admin_phone;
      if (profile && profile.admin_selfie) {
        selfieDataUrl = profile.admin_selfie;
        var img = document.getElementById('selfie-preview');
        img.src = selfieDataUrl;
        img.style.display = 'block';
        document.getElementById('selfie-btn').textContent = '✓ Change selfie';
      }

      if (profile && profile.admin_status === 'revoked') {
        document.getElementById('status-badge').textContent = 'ACCESS RESTRICTED';
        document.getElementById('status-badge').className = 'status revoked';
        document.getElementById('desc').textContent =
          'Your admin access was restricted. Update your details and request access again.';
      } else if (profile && profile.admin_status === 'pending') {
        document.getElementById('status-badge').textContent = 'ACCESS PENDING';
        document.getElementById('desc').textContent =
          'Your request is waiting for developer approval. You can update details and resubmit.';
      }
    }

    async function requestAccess() {
      const msg = document.getElementById('msg');
      const btn = document.getElementById('request-btn');
      const nin = (document.getElementById('nin').value || '').trim();
      const phone = (document.getElementById('phone').value || '').trim();

      if (!nin || nin.length < 8) {
        msg.style.color = '#f87171';
        msg.textContent = 'Enter a valid NIN.';
        return;
      }
      if (!phone || phone.replace(/\D/g, '').length < 10) {
        msg.style.color = '#f87171';
        msg.textContent = 'Enter a valid OPay phone number.';
        return;
      }
      if (!selfieDataUrl) {
        msg.style.color = '#f87171';
        msg.textContent = 'Please upload a selfie.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const payload = {
          id: userId,
          role: 'admin',
          admin_access: false,
          admin_status: 'pending',
          admin_nin: nin,
          admin_phone: phone,
          admin_selfie: selfieDataUrl
        };
        const { error } = await client.from('profiles').upsert(payload);
        if (error) throw error;
        msg.style.color = '#34d399';
        msg.textContent = 'Request sent with your details. Wait for a developer to approve.';
        document.getElementById('status-badge').textContent = 'ACCESS PENDING';
        document.getElementById('status-badge').className = 'status pending';
      } catch (e) {
        msg.style.color = '#f87171';
        msg.textContent = e.message || 'Could not send request.';
      }
      btn.disabled = false;
      btn.textContent = 'Request Admin Access';
    }

    async function logout() {
      await client.auth.signOut();
      location.replace('login.html');
    }

    init();
    setInterval(async () => {
      if (!userId) return;
      try {
        const { data } = await client.from('profiles').select('admin_access').eq('id', userId).maybeSingle();
        if (data && data.admin_access === true) location.replace('dashboard.html');
      } catch (e) {}
    }, 8000);
  </script>
</body>
</html>
