<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Investment Plans Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.5rem; font-weight: 800; margin: 0; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 14px 0; }
    
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #818cf8; text-decoration: none; font-weight: 600; font-size: 0.85rem; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    input { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); }

    .submit-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.2s; margin-top: 10px; }
    .submit-btn:hover { opacity: 0.9; }
    .status-msg { font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 10px; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="logo-text">Investment Plan Control</h1>
    </header>

    <a href="#" id="back-to-user" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to User Info
    </a>

    <div class="card">
      <h2 class="card-title">Assign Active Plan Settings</h2>
      <form onsubmit="saveInvestmentPlan(event)">
        <div class="form-group">
          <label>Plan Name</label>
          <input type="text" id="plan-name" placeholder="e.g. Gold Tier Plan">
        </div>

        <div class="form-group">
          <label>Active Return Rate / ROI (%)</label>
          <input type="number" step="0.1" id="plan-roi" placeholder="e.g. 15">
        </div>

        <button type="submit" class="submit-btn" id="save-btn">Save Plan Settings</button>
        <span id="form-status" class="status-msg"></span>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id');

    if (targetUserId) {
      document.getElementById('back-to-user').setAttribute('href', `user-info.html?id=${targetUserId}`);
    }

    async function saveInvestmentPlan(e) {
      e.preventDefault();
      const name = document.getElementById('plan-name').value.trim();
      const roi = parseFloat(document.getElementById('plan-roi').value) || 0;
      const statusEl = document.getElementById('form-status');
      const btn = document.getElementById('save-btn');

      if (!targetUserId) {
        alert("Target user ID missing.");
        return;
      }

      btn.innerText = "Saving...";
      btn.disabled = true;

      const { error } = await client
        .from('user_plans')
        .upsert({ user_id: targetUserId, plan_name: name, roi_percentage: roi });

      btn.innerText = "Save Plan Settings";
      btn.disabled = false;

      if (error) {
        statusEl.style.color = "#f87171";
        statusEl.innerText = "Error: " + error.message;
      } else {
        statusEl.style.color = "#34d399";
        statusEl.innerText = "Investment plan updated successfully!";
        setTimeout(() => { statusEl.innerText = ""; }, 3000);
      }
    }
  </script>
</body>
        </html>
