<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Equity Mixed Assets</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    .navbar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 16px 24px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 24px; }
    .logo { font-size: 18px; font-weight: 700; color: #3b82f6; }
    .user-badge { font-size: 14px; color: #94a3b8; }
    .user-badge strong { color: #fff; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-logout:hover { background: #dc2626; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; }
    .card h3 { margin-top: 0; font-size: 16px; color: #94a3b8; }
    .card .stat { font-size: 28px; font-weight: 700; color: #fff; margin: 10px 0 0 0; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">Admin Control Center</div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <div class="user-badge">Logged in as: <strong id="dash-admin-name">Admin</strong></div>
      <button class="btn-logout" onclick="logoutAdmin()">Log Out</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Your Admin Referral Code</h3>
      <p class="stat" id="dash-admin-code" style="color: #3b82f6;">-</p>
    </div>
    <div class="card">
      <h3>System Status</h3>
      <p class="stat" style="color: #10b981;">Active</p>
    </div>
  </div>

  <script>
    const currentAdminName = localStorage.getItem('current_admin_name');
    const currentAdminCode = localStorage.getItem('current_admin_code');

    // Protect dashboard route
    if (!currentAdminCode) {
      window.location.href = 'admin-login.html';
    } else {
      document.getElementById('dash-admin-name').innerText = currentAdminName || 'Admin';
      document.getElementById('dash-admin-code').innerText = currentAdminCode;
    }

    function logoutAdmin() {
      localStorage.removeItem('current_admin_code');
      localStorage.removeItem('current_admin_name');
      window.location.href = 'admin-login.html';
    }
  </script>
</body>
</html>
