<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #0f172a; color: #fff; display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 15px 20px; border-bottom: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .user-item:hover, .user-item.active { background: #334155; }
    .user-info { display: flex; flex-direction: column; }
    .user-code { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
    .chat-header { padding: 20px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 70%; padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
    .msg-user { background: #334155; align-self: flex-start; }
    .msg-admin { background: #2563eb; align-self: flex-end; }
    
    .chat-input-area { padding: 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
    .chat-input-area input { flex: 1; padding: 12px 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
    .chat-input-area button { padding: 12px 24px; background: #2563eb; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: 600; }
    
    .control-pane { padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; gap: 10px; align-items: center; }
    .control-pane input { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; width: 120px; }
    .control-pane button { padding: 8px 15px; background: #10b981; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <span id="admin-welcome-text">My Users</span>
      <button onclick="logoutAdmin()" style="background: #ef4444; border: none; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;">Log Out</button>
    </div>
    <div class="user-list" id="user-list">
      <div style="padding: 20px; color: #94a3b8; text-align: center; font-size: 13px;">Loading your users...</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="current-chat-header">
      <span>Select a user from the left</span>
    </div>

    <div class="control-pane" id="control-pane" style="display: none;">
      <span style="font-size: 13px; color: #94a3b8;">Set Balance ($):</span>
      <input type="number" id="target-user-balance" placeholder="0.00">
      <button onclick="saveUserBalance()">Update Balance</button>
    </div>
    
    <div class="chat-messages" id="admin-chat-body">
      <div class="message msg-user">Choose an assigned user to view messages and manage their account.</div>
    </div>
    
    <div class="chat-input-area">
      <input type="text" id="admin-chat-input" placeholder="Type your reply as customer support...">
      <button onclick="sendAdminMessage()">Send</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let activeUserId = null;
    let activeUserCode = null;
    const currentAdminCode = localStorage.getItem('current_admin_code');

    if (!currentAdminCode) {
      window.location.href = 'admin-login.html';
    }

    document.getElementById('admin-welcome-text').innerText = `Admin: ${localStorage.getItem('current_admin_name') || currentAdminCode}`;

    window.addEventListener('DOMContentLoaded', async () => {
      loadAssignedUsers();
    });

    async function loadAssignedUsers() {
      const userListContainer = document.getElementById('user-list');
      
      const { data: users, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('assigned_admin_code', currentAdminCode);

      if (error) {
        console.error("Error loading users:", error.message);
        return;
      }

      if (users && users.length > 0) {
        userListContainer.innerHTML = '';
        users.forEach(user => {
          const userItem = document.createElement('div');
          userItem.className = 'user-item';
          userItem.onclick = () => selectUser(user, userItem);
          
          userItem.innerHTML = `
            <div class="user-info">
              <span style="font-weight: 600;">${user.full_name || 'Unnamed User'}</span>
              <span class="user-code">Balance: $${user.balance || 0.00}</span>
            </div>
            <span style="color: #10b981; font-size: 12px;">● Active</span>
          `;
          userListContainer.appendChild(userItem);
        });
      } else {
        userListContainer.innerHTML = `<div style="padding: 20px; color: #94a3b8; text-align: center; font-size: 13px;">No users found registered under your code (${currentAdminCode}).</div>`;
      }
    }

    function selectUser(user, element) {
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      activeUserId = user.id;
      activeUserCode = user.admin_code;
      
      document.getElementById('current-chat-header').innerHTML = `<span>Chatting with: ${user.full_name || 'User'}</span>`;
      document.getElementById('control-pane').style.display = 'flex';
      document.getElementById('target-user-balance').value = user.balance || 0;

      const chatBody = document.getElementById('admin-chat-body');
      chatBody.innerHTML = `<div class="message msg-user">Connected to session with ${user.full_name}. You can manage their balance or reply below.</div>`;
    }

    async function saveUserBalance() {
      if (!activeUserId) return;
      const newBalance = parseFloat(document.getElementById('target-user-balance').value);

      const { error } = await supabase
        .from('profiles')
        .update({ balance: newBalance })
        .eq('id', activeUserId);

      if (error) {
        alert("Failed to update balance: " + error.message);
      } else {
        alert("User balance updated successfully!");
        loadAssignedUsers();
      }
    }

    function sendAdminMessage() {
      const input = document.getElementById('admin-chat-input');
      const text = input.value.trim();
      if (!text || !activeUserId) return;

      const chatBody = document.getElementById('admin-chat-body');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message msg-admin';
      msgDiv.innerText = text;
      chatBody.appendChild(msgDiv);

      input.value = '';
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function logoutAdmin() {
      localStorage.removeItem('current_admin_code');
      localStorage.removeItem('current_admin_name');
      window.location.href = 'admin-login.html';
    }
  </script>
</body>
</html>
