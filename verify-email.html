<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background-color: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 420px; border: 1px solid #334155; box-sizing: border-box; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #3b82f6; }
    .text { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    .email-highlight { color: #f8fafc; font-weight: 600; word-break: break-all; }
    .btn { display: block; width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; text-decoration: none; box-sizing: border-box; font-size: 15px; }
    .btn:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">✉️</div>
    <div class="title">Check Your Email</div>
    <div class="text">
      We have sent a verification link to <br>
      <span id="user-email" class="email-highlight">your email address</span>.
      <br><br>
      Please check your inbox and click the confirmation link before logging in.
    </div>
    
    <a href="login.html" class="btn">Proceed to Login</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    if (email) {
      document.getElementById('user-email').innerText = email;
    }
  </script>
</body>
</html>
