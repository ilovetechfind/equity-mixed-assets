<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Registration - Equity Mixed Assets</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .signup-box { background-color: #1e293b; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; box-sizing: border-box; }
    .title { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #3b82f6; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    .input-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #334155; background-color: #0f172a; color: white; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn:hover { background-color: #1d4ed8; }
    .links { text-align: center; margin-top: 20px; font-size: 14px; }
    .links a { color: #3b82f6; text-decoration: none; display: block; margin-top: 8px; }
    .links a:hover { text-decoration: underline; }
    .error { color: #ef4444; font-size: 14px; text-align: center; margin-top: 15px; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 4px; display: none; }
  </style>
</head>
<body>

  <div class="signup-box">
    <div class="title">New Admin Signup</div>
    <p style="text-align: center; font-size: 14px; color: #94a3b8; margin-bottom: 30px;">Create your automated admin account</p>
    
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="admin-signup-name" placeholder="John Doe">
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="admin-signup-email" placeholder="admin@example.com">
    </div>
    
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="admin-signup-password" placeholder="••••••••">
    </div>
    
    <button class="btn" onclick="registerAdmin()">Register Admin</button>
    
    <div class="links">
      <a href="admin-login.html">Already have an account? Login here</a>
    </div>

    <div id="error-msg" class="error"></div>
  </div>

  <script src="config.js"></script>
  <script>
    async function registerAdmin() {
      const name = document.getElementById('admin-signup-name').value.trim();
      const email = document.getElementById('admin-signup-email').value.trim();
      const password = document.getElementById('admin-signup-password').value.trim();
      const errorDiv = document.getElementById('error-msg');

      errorDiv.style.display = 'none';

      if (typeof supabase === 'undefined') {
        alert("Error: Supabase client is not loaded. Check if config.js exists and is correct.");
        return;
      }

      if (!name || !email || !password) {
        errorDiv.innerText = "Please fill in all fields.";
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const generatedCode = 'ADMIN_' + Math.random().toString(36).substring(2, 8).toUpperCase();

        const { data, error } = await supabase.from('admins').insert([
          { admin_name: name, email: email, referral_code: generatedCode, pin: password }
        ]);

        if (error) {
          alert("Database Error: " + error.message);
          errorDiv.innerText = "Error: " + error.message;
          errorDiv.style.display = 'block';
        } else {
          localStorage.setItem('current_admin_code', generatedCode);
          localStorage.setItem('current_admin_name', name);
          alert("Account created successfully! Redirecting...");
          window.location.href = 'admin.html';
        }
      } catch (err) {
        alert("System Error: " + err.message);
      }
    }
  </script>
</body>
</html>
