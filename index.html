<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets | Client Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      position: relative;
      overflow: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      left: 10%;
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 70%);
      bottom: 5%;
      right: 5%;
      border-radius: 50%;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      z-index: 10;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
      margin-bottom: 12px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .brand-sub {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
      font-weight: 600;
      color: #f8fafc;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group.hidden {
      display: none;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 42px;
    }

    .toggle-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 18px;
      padding: 0;
      margin: 0;
      width: auto;
      box-shadow: none;
      opacity: 0.5;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }
    .toggle-eye.blurred {
      filter: blur(1.5px);
      opacity: 0.4;
    }
    .toggle-eye:hover {
      opacity: 1;
    }

    button.btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    button.btn-submit:active {
      transform: scale(0.98);
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
    .switch a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">
      <div class="brand-logo">📈</div>
      <div class="brand-name">Equity Mixed Assets</div>
      <div class="brand-sub">Institutional Grade Asset Management</div>
    </div>

    <div class="card">
      <h2 id="title">Sign In</h2>
      
      <div class="form-group hidden" id="group-fullname">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" class="toggle-eye blurred" id="eye-btn" onclick="togglePasswordVisibility()">👁️</button>
        </div>
      </div>

      <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">Sign In</button>
      
      <div class="switch">
        <span id="toggle-text">Don't have an account?</span> 
        <a onclick="toggleMode()" id="toggle-link">Sign Up</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rrddtmqojyheshznrwl.supabase.co';
    const SUPABASE_ANON_KEY = 'Sb_publishable_0fS5eYtsQL8tZz67eSWDvQ_G4flOw5M';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeBtn = document.getElementById('eye-btn');
      
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeBtn.innerText = '👁️';
        eyeBtn.classList.remove('blurred');
      } else {
        pwdInput.type = 'password';
        eyeBtn.innerText = '👁️';
        eyeBtn.classList.add('blurred');
      }
    }

    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('title').innerText = isSignUp ? 'Create Account' : 'Sign In';
      document.getElementById('btn-submit').innerText = isSignUp ? 'Create Account' : 'Sign In';
      document.getElementById('toggle-text').innerText = isSignUp ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggle-link').innerText = isSignUp ? 'Sign In' : 'Sign Up';
      
      const nameGroup = document.getElementById('group-fullname');
      if (isSignUp) {
        nameGroup.classList.remove('hidden');
      } else {
        nameGroup.classList.add('hidden');
      }
    }

    async function handleSubmit() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullname').value;

      if (!email || !password) return alert('Please enter both email and password.');

      try {
        if (isSignUp) {
          if (!fullName) return alert('Please enter your full name.');
          
          const { data, error } = await supabaseClient.auth.signUp({ 
            email, 
            password,
            options: { data: { full_name: fullName } }
          });

          if (error) {
            alert('Error: ' + error.message);
          } else {
            alert('Account created successfully!');
            window.location.href = 'dashboard.html';
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            alert('Error: ' + error.message);
          } else {
            window.location.href = 'dashboard.html';
          }
        }
      } catch (err) {
        alert('Network/Configuration error: ' + (err.message || 'Failed to communicate with Supabase.'));
      }
    }
  </script>
</body>
</html>
