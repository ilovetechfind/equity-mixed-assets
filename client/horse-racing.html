<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Equity Mixed Assets - Horse Racing</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(18, 24, 38, 0.92);
      --border: rgba(255,255,255,0.08);
      --muted: #8b9bb4;
      --green: #10b981;
      --red: #ef4444;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 14px; padding-bottom: 40px;
      background: radial-gradient(circle at top, #1a2e1a 0%, var(--bg) 55%);
      color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .back {
      background: var(--card); border: 1px solid var(--border); color: #fff;
      padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.85rem;
    }
    .title { font-size: 1.15rem; font-weight: 800; margin: 0; }

    .hero {
      text-align: center; margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(0,0,0,0.2));
      border: 1px solid rgba(34,197,94,0.25); border-radius: 16px; padding: 14px;
    }
    .hero h2 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 800; color: #4ade80; }
    .hero p { margin: 0; font-size: 0.8rem; color: var(--muted); }

    .bal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .bal-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
    }
    .bal-box .lbl { font-size: 0.65rem; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .bal-box .val { font-size: 1.2rem; font-weight: 800; margin-top: 4px; }
    .bal-box.race .val { color: #4ade80; }
    .bal-box.main .val { color: #93c5fd; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px;
    }
    label {
      display: block; font-size: 0.72rem; color: var(--muted); font-weight: 700;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    input[type=number] {
      width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--border); color: #fff;
      padding: 12px 14px; border-radius: 12px; font-size: 1rem; outline: none; margin-bottom: 10px;
    }
    input:focus { border-color: #22c55e; }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .q {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #cbd5e1;
      padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }

    .fund-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fund-btn {
      border: none; border-radius: 12px; padding: 11px; font-weight: 700; font-size: 0.82rem; cursor: pointer;
    }
    .fund-in { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
    .fund-out { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #34d399; }

    .horses { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .horse {
      display: flex; align-items: center; gap: 12px;
      background: rgba(0,0,0,0.3); border: 2px solid var(--border); border-radius: 14px;
      padding: 12px; cursor: pointer; transition: 0.15s;
    }
    .horse:hover { border-color: rgba(74,222,128,0.4); }
    .horse.selected { border-color: #22c55e; background: rgba(34,197,94,0.12); box-shadow: 0 0 16px rgba(34,197,94,0.2); }
    .horse .num {
      width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.95rem; color: #0f172a; flex-shrink: 0;
    }
    .horse .info { flex: 1; min-width: 0; }
    .horse .name { font-weight: 700; font-size: 0.95rem; }
    .horse .meta { font-size: 0.72rem; color: var(--muted); }
    .horse .odds {
      font-weight: 800; font-size: 1rem; color: var(--gold); white-space: nowrap;
    }

    .track {
      background: #14532d; border-radius: 14px; padding: 12px 10px; margin-bottom: 14px;
      border: 1px solid rgba(74,222,128,0.2); position: relative; overflow: hidden;
      display: none;
    }
    .track.show { display: block; }
    .lane {
      position: relative; height: 36px; margin-bottom: 6px;
      background: linear-gradient(90deg, rgba(0,0,0,0.15), transparent 30%, transparent 70%, rgba(0,0,0,0.15));
      border-radius: 8px; border-bottom: 1px dashed rgba(255,255,255,0.08);
    }
    .lane:last-child { margin-bottom: 0; }
    .lane-label {
      position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
      font-size: 0.65rem; font-weight: 800; color: rgba(255,255,255,0.5); z-index: 1;
    }
    .runner {
      position: absolute; left: 0; top: 2px; height: 32px;
      display: flex; align-items: center; gap: 2px;
      transition: left 0.08s linear; white-space: nowrap; z-index: 2;
    }
    .runner .emoji { font-size: 1.4rem; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4)); }
    .finish {
      position: absolute; right: 8px; top: 0; bottom: 0; width: 3px;
      background: repeating-linear-gradient(0deg, #fff 0 4px, #0f172a 4px 8px);
      opacity: 0.7;
    }

    .race-btn {
      width: 100%; border: none; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 1.05rem;
      cursor: pointer; color: #0f172a;
      background: linear-gradient(135deg, #4ade80, #16a34a);
      box-shadow: 0 6px 20px rgba(34,197,94,0.3);
    }
    .race-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    .result-line {
      text-align: center; min-height: 1.4em; margin-top: 12px; font-weight: 700; font-size: 0.95rem;
    }
    .result-line.win { color: var(--green); }
    .result-line.lose { color: var(--red); }

    .note { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.4; }

    .hist-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; color: var(--muted); }
    .hist-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .hist-item:last-child { border-bottom: none; }
    .hist-name { font-weight: 700; font-size: 0.88rem; }
    .hist-meta { font-size: 0.7rem; color: var(--muted); }
    .up { color: var(--green); font-weight: 800; }
    .down { color: var(--red); font-weight: 800; }
    .empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 12px 0; }

    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: #0f172a; border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 100%; max-width: 360px;
    }
    .modal h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .modal p { color: var(--muted); font-size: 0.85rem; margin: 0 0 14px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .modal-cancel {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
      padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .modal-ok {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; color: #fff;
      padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid var(--green); color: #34d399;
      padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 0.85rem;
      display: none; z-index: 100; max-width: 90%; text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="dashboard.html" class="back">← Back</a>
      <h1 class="title">Horse Racing</h1>
    </div>

    <div class="hero">
      <h2>🏇 Race Day</h2>
      <p>Pick a horse · Set your wager · Win at the odds</p>
    </div>

    <div class="bal-grid">
      <div class="bal-box main">
        <div class="lbl">Main Balance</div>
        <div class="val" id="main-bal">$0.00</div>
      </div>
      <div class="bal-box race">
        <div class="lbl">Race Balance</div>
        <div class="val" id="race-bal">$0.00</div>
      </div>
    </div>

    <div class="card">
      <label>Move funds</label>
      <div class="fund-row">
        <button type="button" class="fund-btn fund-in" id="btn-deposit">↓ From Main</button>
        <button type="button" class="fund-btn fund-out" id="btn-withdraw">↑ To Main</button>
      </div>
    </div>

    <div class="card">
      <label>Select a horse</label>
      <div class="horses" id="horses"></div>

      <label>Wager amount</label>
      <input type="number" id="wager" placeholder="10.00" min="1" step="0.01" value="10">
      <div class="quick">
        <button type="button" class="q" data-amt="5">$5</button>
        <button type="button" class="q" data-amt="10">$10</button>
        <button type="button" class="q" data-amt="25">$25</button>
        <button type="button" class="q" data-amt="50">$50</button>
        <button type="button" class="q" data-amt="all">Max</button>
      </div>

      <div class="track" id="track">
        <div class="finish"></div>
      </div>

      <button type="button" class="race-btn" id="race-btn">Start Race</button>
      <div class="result-line" id="result"></div>
      <p class="note">Payout = wager × odds if your horse wins. Only one winner per race.</p>
    </div>

    <div class="card">
      <div class="hist-title">Recent races</div>
      <div id="history"><div class="empty">No races yet</div></div>
    </div>
  </div>

  <div class="modal-bg" id="fund-modal">
    <div class="modal">
      <h3 id="modal-title">Transfer</h3>
      <p id="modal-desc">Move funds</p>
      <label>Amount (USD)</label>
      <input type="number" id="fund-amount" placeholder="0.00" min="1" step="0.01">
      <div class="quick" id="modal-quick"></div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" id="modal-cancel">Cancel</button>
        <button type="button" class="modal-ok" id="modal-ok">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    var HORSES = [
      { id: 1, name: 'Thunder Bolt',  emoji: '🐎', color: '#fbbf24', odds: 2.0 },
      { id: 2, name: 'Silver Arrow',  emoji: '🐴', color: '#94a3b8', odds: 2.5 },
      { id: 3, name: 'Midnight Run',  emoji: '🏇', color: '#6366f1', odds: 3.0 },
      { id: 4, name: 'Golden Hoof',   emoji: '🦄', color: '#f59e0b', odds: 4.0 },
      { id: 5, name: 'Storm Chaser',  emoji: '🐎', color: '#ef4444', odds: 5.0 },
      { id: 6, name: 'Lucky Star',    emoji: '🌟', color: '#22c55e', odds: 8.0 }
    ];

    var userId = null;
    var mainBalance = 0;
    var raceBalance = 0;
    var selected = null;
    var racing = false;
    var fundMode = 'deposit';

    function fmt(n) {
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function raceBalKey() { return 'horse_race_balance_' + userId; }
    function histKey() { return 'horse_race_history_' + userId; }

    function renderBalances() {
      document.getElementById('main-bal').textContent = '$' + fmt(mainBalance);
      document.getElementById('race-bal').textContent = '$' + fmt(raceBalance);
    }

    function renderHorses() {
      var el = document.getElementById('horses');
      el.innerHTML = HORSES.map(function (h) {
        var sel = selected && selected.id === h.id ? ' selected' : '';
        return '<div class="horse' + sel + '" data-id="' + h.id + '">' +
          '<div class="num" style="background:' + h.color + '">' + h.id + '</div>' +
          '<div class="info"><div class="name">' + h.emoji + ' ' + h.name + '</div>' +
          '<div class="meta">Lane ' + h.id + '</div></div>' +
          '<div class="odds">' + h.odds.toFixed(1) + '×</div></div>';
      }).join('');
      el.querySelectorAll('.horse').forEach(function (node) {
        node.addEventListener('click', function () {
          if (racing) return;
          var id = Number(node.getAttribute('data-id'));
          selected = HORSES.find(function (x) { return x.id === id; });
          renderHorses();
        });
      });
    }

    function loadHistory() {
      var list = [];
      try { list = JSON.parse(localStorage.getItem(histKey()) || '[]'); } catch (e) {}
      var el = document.getElementById('history');
      if (!list.length) {
        el.innerHTML = '<div class="empty">No races yet</div>';
        return;
      }
      el.innerHTML = list.slice(0, 12).map(function (h) {
        var cls = h.pnl >= 0 ? 'up' : 'down';
        var sign = h.pnl >= 0 ? '+' : '';
        return '<div class="hist-item"><div><div class="hist-name">' + h.title + '</div>' +
          '<div class="hist-meta">' + (h.detail || '') + ' · ' + new Date(h.ts).toLocaleString() + '</div></div>' +
          '<div class="' + cls + '">' + sign + '$' + fmt(Math.abs(h.pnl)) + '</div></div>';
      }).join('');
    }

    function pushHistory(entry) {
      var list = [];
      try { list = JSON.parse(localStorage.getItem(histKey()) || '[]'); } catch (e) {}
      list.unshift(entry);
      localStorage.setItem(histKey(), JSON.stringify(list.slice(0, 80)));
      loadHistory();
    }

    async function init() {
      var user = null;
      try {
        var s = await client.auth.getSession();
        user = s.data && s.data.session && s.data.session.user;
        if (!user) {
          var g = await client.auth.getUser();
          user = g.data && g.data.user;
        }
      } catch (e) {}
      if (!user) { window.location.href = 'index.html'; return; }
      userId = user.id;

      var { data: profile } = await client.from('profiles')
        .select('balance')
        .eq('id', userId).maybeSingle();
      mainBalance = Number(profile && profile.balance || 0);

      var ls = localStorage.getItem(raceBalKey());
      raceBalance = ls != null ? Number(ls) || 0 : 0;

      renderBalances();
      renderHorses();
      loadHistory();

      document.querySelectorAll('.q').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var a = btn.getAttribute('data-amt');
          if (a === 'all') {
            document.getElementById('wager').value = Math.max(0, Math.floor(raceBalance * 100) / 100);
          } else {
            document.getElementById('wager').value = a;
          }
        });
      });

      document.getElementById('race-btn').addEventListener('click', startRace);
      document.getElementById('btn-deposit').addEventListener('click', function () { openFund('deposit'); });
      document.getElementById('btn-withdraw').addEventListener('click', function () { openFund('withdraw'); });
      document.getElementById('modal-cancel').addEventListener('click', closeFund);
      document.getElementById('modal-ok').addEventListener('click', confirmFund);
    }

    function openFund(mode) {
      fundMode = mode;
      document.getElementById('modal-title').textContent =
        mode === 'deposit' ? 'Deposit to Race' : 'Withdraw to Main';
      document.getElementById('modal-desc').textContent =
        mode === 'deposit'
          ? 'Move money from main balance into race balance.'
          : 'Withdraw any amount from race balance to main.';
      document.getElementById('fund-amount').value = '';
      var q = document.getElementById('modal-quick');
      var max = mode === 'deposit' ? mainBalance : raceBalance;
      q.innerHTML = '';
      [10, 25, 50, 100].forEach(function (n) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'q'; b.textContent = '$' + n;
        b.onclick = function () { document.getElementById('fund-amount').value = n; };
        q.appendChild(b);
      });
      var maxBtn = document.createElement('button');
      maxBtn.type = 'button'; maxBtn.className = 'q'; maxBtn.textContent = 'Max';
      maxBtn.onclick = function () {
        document.getElementById('fund-amount').value = Math.max(0, Math.floor(max * 100) / 100);
      };
      q.appendChild(maxBtn);
      document.getElementById('fund-modal').classList.add('show');
    }

    function closeFund() {
      document.getElementById('fund-modal').classList.remove('show');
    }

    async function confirmFund() {
      var amt = parseFloat(document.getElementById('fund-amount').value);
      if (!amt || amt <= 0) return toast('Enter a valid amount', true);

      if (fundMode === 'deposit') {
        if (amt > mainBalance) return toast('Not enough main balance', true);
        mainBalance = Math.round((mainBalance - amt) * 100) / 100;
        raceBalance = Math.round((raceBalance + amt) * 100) / 100;
      } else {
        if (amt > raceBalance) return toast('Not enough race balance', true);
        raceBalance = Math.round((raceBalance - amt) * 100) / 100;
        mainBalance = Math.round((mainBalance + amt) * 100) / 100;
      }

      localStorage.setItem(raceBalKey(), String(raceBalance));
      await client.from('profiles').update({ balance: mainBalance }).eq('id', userId);

      closeFund();
      renderBalances();
      toast(fundMode === 'deposit'
        ? 'Deposited $' + fmt(amt) + ' to race'
        : 'Withdrew $' + fmt(amt) + ' to main');
    }

    function startRace() {
      if (racing) return;
      if (!selected) return toast('Pick a horse first', true);
      var wager = parseFloat(document.getElementById('wager').value);
      if (!wager || wager <= 0) return toast('Enter a wager', true);
      if (wager > raceBalance) return toast('Not enough race balance — deposit first', true);
      if (wager < 1) return toast('Minimum wager is $1', true);

      racing = true;
      document.getElementById('race-btn').disabled = true;
      document.getElementById('result').textContent = '';
      document.getElementById('result').className = 'result-line';

      raceBalance = Math.round((raceBalance - wager) * 100) / 100;
      localStorage.setItem(raceBalKey(), String(raceBalance));
      renderBalances();

      // Weighted winner: lower odds = higher chance
      // weight = 1/odds so favorites win more often (house edge still via odds)
      var weights = HORSES.map(function (h) { return 1 / h.odds; });
      var total = weights.reduce(function (a, b) { return a + b; }, 0);
      var r = Math.random() * total;
      var winner = HORSES[0];
      for (var i = 0; i < HORSES.length; i++) {
        r -= weights[i];
        if (r <= 0) { winner = HORSES[i]; break; }
      }

      runAnimation(winner, selected, wager);
    }

    function runAnimation(winner, pick, wager) {
      var track = document.getElementById('track');
      track.classList.add('show');
      track.innerHTML = '<div class="finish"></div>';

      var positions = {};
      HORSES.forEach(function (h) {
        var lane = document.createElement('div');
        lane.className = 'lane';
        lane.innerHTML = '<span class="lane-label">' + h.id + '</span>' +
          '<div class="runner" id="runner-' + h.id + '"><span class="emoji">' + h.emoji + '</span></div>';
        track.appendChild(lane);
        positions[h.id] = 0;
      });

      var trackWidth = track.clientWidth - 48;
      var finishLine = trackWidth * 0.88;
      var speeds = {};
      HORSES.forEach(function (h) {
        // winner gets slight speed bias; noise for drama
        var base = 0.9 + Math.random() * 1.1;
        if (h.id === winner.id) base += 0.55;
        speeds[h.id] = base;
      });

      var done = false;
      var start = performance.now();

      function tick(now) {
        var elapsed = (now - start) / 1000;
        HORSES.forEach(function (h) {
          var boost = speeds[h.id] * (1 + elapsed * 0.15);
          positions[h.id] = Math.min(finishLine + 20, positions[h.id] + boost * 2.2 + Math.random() * 1.5);
          var el = document.getElementById('runner-' + h.id);
          if (el) el.style.left = positions[h.id] + 'px';
        });

        if (!done) {
          var finished = HORSES.filter(function (h) { return positions[h.id] >= finishLine; });
          if (finished.length) {
            // ensure declared winner actually finishes first visually
            if (positions[winner.id] < finishLine) {
              positions[winner.id] = finishLine + 5;
              var we = document.getElementById('runner-' + winner.id);
              if (we) we.style.left = positions[winner.id] + 'px';
            }
            done = true;
            setTimeout(function () { settle(winner, pick, wager); }, 400);
            return;
          }
          requestAnimationFrame(tick);
        }
      }
      requestAnimationFrame(tick);
    }

    function settle(winner, pick, wager) {
      var resultEl = document.getElementById('result');
      var won = winner.id === pick.id;
      var payout = 0;
      var pnl = -wager;

      if (won) {
        payout = Math.round(wager * pick.odds * 100) / 100;
        pnl = Math.round((payout - wager) * 100) / 100;
        raceBalance = Math.round((raceBalance + payout) * 100) / 100;
        localStorage.setItem(raceBalKey(), String(raceBalance));
        resultEl.className = 'result-line win';
        resultEl.textContent = '🏆 ' + winner.name + ' wins! You won $' + fmt(payout) + ' (' + pick.odds + '×)';
        toast('You won $' + fmt(payout) + '!');
      } else {
        resultEl.className = 'result-line lose';
        resultEl.textContent = winner.emoji + ' ' + winner.name + ' wins. You lost $' + fmt(wager);
        toast('Lost $' + fmt(wager) + ' — ' + winner.name + ' won', true);
      }

      renderBalances();

      pushHistory({
        kind: 'race',
        title: pick.emoji + ' ' + pick.name + (won ? ' WIN' : ' LOSS'),
        detail: 'Wager $' + fmt(wager) + ' @ ' + pick.odds + '× · Winner: ' + winner.name,
        pnl: won ? pnl : -wager,
        ts: Date.now()
      });

      racing = false;
      document.getElementById('race-btn').disabled = false;
    }

    function toast(msg, isErr) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = isErr ? '#ef4444' : '#10b981';
      t.style.color = isErr ? '#fca5a5' : '#34d399';
      t.style.display = 'block';
      setTimeout(function () { t.style.display = 'none'; }, 2800);
    }

    init();
  </script>
</body>
</html>
