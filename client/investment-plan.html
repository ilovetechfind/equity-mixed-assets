<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Investment Plans</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #070b14;
      --card-bg: rgba(18, 24, 38, 0.6);
      --card-border: rgba(255, 255, 255, 0.05);
      --text-muted: #8b9bb4;
      
      --tier-starter: #94a3b8;
      --tier-bronze: #cd7f32;
      --tier-silver: #c0c0c0;
      --tier-gold: #ffd700;
      --tier-platinum: #38bdf8;
      --tier-diamond: #a855f7;
      --tier-crown: #f43f5e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at top, rgba(29, 39, 61, 0.4) 0%, transparent 60%);
      background-attachment: fixed; 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 100px; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 480px; }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px; }
    .logo-text { background: linear-gradient(90deg, #4ade80, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
    .menu-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: white; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .nav-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .back-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: white; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 6px;}
    .view-title { font-size: 1.4rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }

    .active-banner-link { text-decoration: none; display: block; margin-bottom: 28px; }
    .active-banner { 
      background: rgba(18, 24, 38, 0.4); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(12px); 
      border-radius: 16px; 
      padding: 20px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .banner-left { display: flex; flex-direction: column; gap: 6px; }
    .banner-subtitle { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .banner-title { font-size: 1.3rem; font-weight: 800; margin: 0; color: white; letter-spacing: -0.5px; }
    .banner-status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #ef4444; font-weight: 600; }
    .status-dot { width: 6px; height: 6px; background-color: #ef4444; border-radius: 50%; }
    .banner-arrow { color: var(--text-muted); font-size: 1.2rem; }

    .tier-list { display: flex; flex-direction: column; gap: 16px; }
    .tier-card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      backdrop-filter: blur(12px); 
      border-radius: 16px; 
      padding: 16px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      position: relative;
      overflow: hidden;
    }
    .tier-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--tier-color);
      opacity: 0.7;
    }
    .tier-content { display: flex; align-items: center; gap: 16px; }
    .tier-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.05); color: var(--tier-color);
    }
    .tier-info h4 { font-size: 1.1rem; font-weight: 700; margin: 0; color: white; }
    .select-btn { 
      background: rgba(255,255,255,0.03); color: white; border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 20px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; text-decoration: none; 
    }
    .select-btn:hover { background: var(--tier-color); color: #000; }

    .tier-1 { --tier-color: var(--tier-starter); }
    .tier-2 { --tier-color: var(--tier-bronze); }
    .tier-3 { --tier-color: var(--tier-silver); }
    .tier-4 { --tier-color: var(--tier-gold); }
    .tier-5 { --tier-color: var(--tier-platinum); }
    .tier-6 { --tier-color: var(--tier-diamond); }
    .tier-7 { --tier-color: var(--tier-crown); }

    .bottom-nav { 
      position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 448px; margin: 0 auto; 
      background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); 
      display: flex; justify-content: space-around; padding: 12px 0; border-radius: 20px; z-index: 100; 
    }
    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .nav-item.active { color: white; }
    .nav-icon { font-size: 18px; filter: grayscale(100%) opacity(0.6); }
    .nav-item.active .nav-icon { filter: grayscale(0%) opacity(1); }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1 class="logo-text">Equity Mixed Assets</h1>
    </header>

    <div class="nav-bar">
      <a href="dashboard.html" class="back-btn">Back</a>
      <h2 class="view-title">Investment Plans</h2>
    </div>

    <a href="active-plan.html" class="active-banner-link">
      <div class="active-banner">
        <div class="banner-left">
          <span class="banner-subtitle">Current Active Tier</span>
          <h3 class="banner-title" id="banner-plan-title">None</h3>
          <div class="banner-status" id="banner-status-container">
            <span class="status-dot" id="banner-status-dot"></span> <span id="banner-status-text">No Active Plan</span>
          </div>
        </div>
        <div class="banner-arrow">›</div>
      </div>
    </a>

    <div class="tier-list">
      <div class="tier-card tier-1"><div class="tier-content"><div class="tier-icon">🌱</div><div class="tier-info"><h4>Starter Plan</h4></div></div><a href="starter-plan.html" class="select-btn">Select</a></div>
      <div class="tier-card tier-2"><div class="tier-content"><div class="tier-icon">🥉</div><div class="tier-info"><h4>Bronze Tier</h4></div></div><a href="bronze-plan.html" class="select-btn">Select</a></div>
      <div class="tier-card tier-3"><div class="tier-content"><div class="tier-icon">🥈</div><div class="tier-info"><h4>Silver Tier</h4></div></div><a href="silver-plan.html" class="select-btn">Select</a></div>
      <div class="tier-card tier-4"><div class="tier-content"><div class="tier-icon">🥇</div><div class="tier-info"><h4>Gold Tier</h4></div></div><a href="gold-plan.html" class="select-btn">Select</a></div>
      <div class="tier-card tier-5"><div class="tier-content"><div class="tier-icon">💎</div><div class="tier-info"><h4>Platinum Tier</h4></div></div><a href="platinum-plan.html" class="select-btn">Select</a></div>
      <div class="tier-card tier-6"><div class="tier-content"><div class="tier-icon">🔮</div><div class="tier-info"><h4>Diamond Tier</h4></div></div><a href="diamond-plan.html" class="select-btn">Select</a></div>
      <div class="tier-card tier-7"><div class="tier-content"><div class="tier-icon">👑</div><div class="tier-info"><h4>Crown Elite</h4></div></div><a href="crown-plan.html" class="select-btn">Select</a></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id') || 'default_user';

    const plansMap = {
      'starter': 'Starter Plan',
      'bronze': 'Bronze Tier',
      'silver': 'Silver Tier',
      'gold': 'Gold Tier',
      'platinum': 'Platinum Tier',
      'diamond': 'Diamond Tier',
      'crown': 'Crown Elite'
    };

    const saved = localStorage.getItem(`user_active_plans_list_${targetUserId}`);
    if (saved) {
      try {
        const activeIds = JSON.parse(saved);
        if (Array.isArray(activeIds) && activeIds.length > 0) {
          const names = activeIds.map(id => plansMap[id]).filter(Boolean);
          if (names.length > 0) {
            document.getElementById('banner-plan-title').innerText = names.join(', ');
            document.getElementById('banner-status-text').innerText = 'Active Plan Running';
            document.getElementById('banner-status-dot').style.backgroundColor = '#34d399';
            document.getElementById('banner-status-container').style.color = '#34d399';
          }
        }
      } catch(e) {}
    }
  </script>
</body>
      </html>
