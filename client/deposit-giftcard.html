<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Gift Card Deposit</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
    }
    body { background: var(--bg-gradient); background-attachment: fixed; color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 16px; }
    .container { width: 100%; max-width: 500px; margin: 30px auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .qr-img { width: 180px; height: 180px; object-fit: contain; background: white; padding: 10px; border-radius: 12px; margin: 15px auto; display: block; }
    .address-box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; font-family: monospace; font-size: 0.85rem; word-break: break-all; margin: 15px 0; border: 1px solid rgba(255,255,255,0.1); text-align: left; }
    .instructions-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; font-size: 0.85rem; color: var(--text-muted); margin: 15px 0; text-align: left; white-space: pre-wrap; }
    .btn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    .proof-btn { background: rgba(255, 255, 255, 0.1); color: #818cf8; border: 1px solid rgba(129, 140, 248, 0.3); padding: 12px 20px; border-radius: 10px; font-weight: 600; text-decoration: none; display: block; width: 100%; box-sizing: border-box; margin-top: 12px; font-size: 0.9rem; text-align: center; transition: background 0.2s; }
    .proof-btn:hover { background: rgba(129, 140, 248, 0.15); }
    .back-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; display: inline-block; margin-bottom: 20px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <a href="deposit.html" class="back-btn">← Back</a>
    <div class="card">
      <h2 style="margin-top:0;">Gift Card Deposit</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Review accepted gift cards and follow instructions to deposit.</p>
      
      <div id="content-area">
        <p style="color: var(--text-muted);">Loading gift card details...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6InFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadGiftcard() {
      const area = document.getElementById('content-area');
      const { data: { user } } = await client.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }

      const { data: profile } = await client.from('profiles').select('referred_by, id').eq('id', user.id).maybeSingle();

      let configData = null;
      let lookupIds = [user.id];
      if (profile && profile.referred_by) { lookupIds.push(profile.referred_by); }

      for (const targetId of lookupIds) {
        const { data } = await client.from('payment_configs').select('giftcard').eq('user_id', targetId).maybeSingle();
        if (data && data.giftcard) { configData = data.giftcard; break; }
      }

      if (!configData) {
        area.innerHTML = `<p style="color: var(--text-muted);">Gift card deposit details have not been configured by your account manager yet.</p>`;
        return;
      }

      try {
        const parsed = typeof configData === 'string' ? JSON.parse(configData) : configData;
        area.innerHTML = `
          ${parsed.image ? `<img src="${parsed.image}" class="qr-img" alt="Gift Card Banner">` : ''}
          ${parsed.wallet ? `
            <div class="address-box">${parsed.wallet}</div>
            <button class="btn" onclick="navigator.clipboard.writeText('${parsed.wallet}'); alert('Details copied!');">Copy Details</button>
          ` : ''}
          ${parsed.instructions ? `<div class="instructions-box"><strong>Instructions:</strong><br>${parsed.instructions}</div>` : ''}
          
          <a href="deposit-proof.html" class="proof-btn">I have made payment, proof of payment</a>
        `;
      } catch (err) {
        area.innerHTML = `<p style="color: var(--text-muted);">Gift card deposit details have not been configured by your account manager yet.</p>`;
      }
    }
    loadGiftcard();
  </script>
</body>
<
  /html>
