<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Equity Mixed Assets - Trading Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14; --card: rgba(18, 24, 38, 0.85); --border: rgba(255,255,255,0.08);
      --muted: #8b9bb4; --green: #10b981; --red: #ef4444; --blue: #3b82f6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 12px; padding-bottom: 100px;
      background: radial-gradient(circle at top, #131c38 0%, var(--bg) 60%);
      color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .back {
      background: var(--card); border: 1px solid var(--border); color: #fff;
      padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.85rem;
    }
    .title { font-size: 1.15rem; font-weight: 800; margin: 0; }
    .badge-live {
      margin-left: auto; font-size: 0.65rem; font-weight: 800; letter-spacing: 1px;
      background: rgba(16, 185, 129, 0.15); color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.4); padding: 4px 8px; border-radius: 20px;
    }
    .bal-card {
      background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(16,185,129,0.12));
      border: 1px solid rgba(59,130,246,0.3); border-radius: 18px; padding: 16px; margin-bottom: 14px;
    }
    .bal-label { font-size: 0.7rem; color: var(--muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .bal-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 6px; gap: 10px; }
    .bal-amount { font-size: 1.8rem; font-weight: 800; margin: 0; }
    .main-bal { font-size: 0.8rem; color: var(--muted); text-align: right; }
    .main-bal strong { color: #e2e8f0; }
    .fund-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .fund-btn { border: none; border-radius: 12px; padding: 11px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .fund-in { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
    .fund-out { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #34d399; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
    .tab {
      flex-shrink: 0; background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 8px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    }
    .tab.active { background: rgba(59,130,246,0.2); border-color: var(--blue); color: #93c5fd; }
    .pair-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 180px; overflow-y: auto; }
    .pair {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; cursor: pointer;
    }
    .pair.selected { border-color: var(--blue); }
    .pair-left { display: flex; align-items: center; gap: 10px; }
    .pair-icon {
      width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    }
    .pair-name { font-weight: 700; font-size: 0.95rem; }
    .pair-cat { font-size: 0.7rem; color: var(--muted); }
    .pair-right { text-align: right; }
    .pair-price { font-weight: 700; font-size: 0.95rem; }
    .pair-chg { font-size: 0.75rem; font-weight: 600; }
    .up { color: var(--green); } .down { color: var(--red); }
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 14px; }
    .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .chart-sym { font-weight: 800; font-size: 1rem; }
    .chart-live { font-size: 0.75rem; color: var(--muted); }
    .chart-live span { color: var(--green); }
    canvas { width: 100%; height: 140px; display: block; border-radius: 8px; }
    .trade-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .side-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .side-btn { padding: 12px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; cursor: pointer; border: 2px solid transparent; }
    .side-buy { background: rgba(16,185,129,0.12); color: var(--green); }
    .side-buy.active { border-color: var(--green); background: rgba(16,185,129,0.25); }
    .side-sell { background: rgba(239,68,68,0.12); color: var(--red); }
    .side-sell.active { border-color: var(--red); background: rgba(239,68,68,0.25); }
    label { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
    input[type=number] {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff;
      padding: 12px 14px; border-radius: 12px; font-size: 1rem; outline: none; margin-bottom: 12px;
    }
    .quick { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .q {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #cbd5e1;
      padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .exec { width: 100%; border: none; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 1rem; cursor: pointer; color: #fff; }
    .exec.buy { background: linear-gradient(135deg, #10b981, #059669); }
    .exec.sell { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .pos-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    .pos-title { font-size: 0.7rem; color: var(--muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
    .pos-empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 16px 0; }
    .pos-sym { font-weight: 700; }
    .pos-meta { font-size: 0.72rem; color: var(--muted); }
    .pos-timer {
      display: inline-block; margin-top: 4px; font-size: 0.72rem; font-weight: 800;
      color: #fbbf24; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35);
      padding: 2px 8px; border-radius: 20px; font-variant-numeric: tabular-nums;
    }
    .pos-timer.urgent { color: #f87171; background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); }
    .close-btn {
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5;
      padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: #0f172a; border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 100%; max-width: 360px;
    }
    .modal h3 { margin: 0 0 8px; font-size: 1.1rem; }
    .modal p { color: var(--muted); font-size: 0.85rem; margin: 0 0 14px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .modal-cancel {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
      padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .modal-ok {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; color: #fff;
      padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .choice-btn {
      width: 100%; border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: #fff; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; margin-bottom: 10px; text-align: left;
    }
    .choice-btn:hover, .choice-btn.active { border-color: var(--blue); background: rgba(59,130,246,0.15); }
    .choice-btn small { display: block; color: var(--muted); font-weight: 500; font-size: 0.75rem; margin-top: 4px; }
    .auto-panel { display: none; margin-top: 4px; }
    .auto-panel.show { display: block; }
    .quick-sec { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .qs {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #cbd5e1;
      padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid var(--green); color: #34d399;
      padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 0.85rem;
      display: none; z-index: 100; max-width: 90%;
    }
    .avail-hint { font-size: 0.78rem; color: #93c5fd; margin: -6px 0 10px; font-weight: 600; }
    .pos-item {
      display: block; padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .pos-item:last-child { border-bottom: none; }
    .pos-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .pos-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      margin-top: 10px; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 10px;
    }
    .stat-label { font-size: 0.65rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-val { font-size: 0.88rem; font-weight: 800; margin-top: 2px; }
    .stat-val.win { color: var(--green); }
    .stat-val.loss { color: var(--red); }
    .badge-win, .badge-loss {
      display: inline-block; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.5px;
      padding: 2px 8px; border-radius: 20px; text-transform: uppercase;
    }
    .badge-win { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
    .badge-loss { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
    .pos-actions { margin-top: 10px; display: flex; justify-content: flex-end; }
    .hist-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-top: 14px; }
    .hist-item { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .hist-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="dashboard.html" class="back">← Back</a>
      <h1 class="title">Trading</h1>
      <span class="badge-live">LIVE</span>
    </div>

    <div class="bal-card">
      <div class="bal-label">Trading Balance</div>
      <div class="bal-row">
        <h2 class="bal-amount" id="trade-bal">$0.00</h2>
        <div class="main-bal">Main: <strong id="main-bal">$0.00</strong></div>
      </div>
      <div class="fund-btns">
        <button class="fund-btn fund-in" onclick="openFundModal('deposit')">↓ From Main</button>
        <button class="fund-btn fund-out" onclick="openFundModal('withdraw')">↑ To Main</button>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="all">All</button>
      <button class="tab" data-cat="crypto">Crypto</button>
      <button class="tab" data-cat="forex">Forex</button>
      <button class="tab" data-cat="stocks">Stocks</button>
      <button class="tab" data-cat="commodities">Commodities</button>
    </div>

    <div class="pair-list" id="pair-list"></div>

    <div class="chart-card">
      <div class="chart-head">
        <span class="chart-sym" id="chart-sym">BTC/USD</span>
        <span class="chart-live"><span>●</span> Live</span>
      </div>
      <canvas id="chart" width="400" height="140"></canvas>
    </div>

    <div class="trade-card">
      <div class="side-btns">
        <button class="side-btn side-buy active" id="btn-buy" onclick="setSide('buy')">BUY</button>
        <button class="side-btn side-sell" id="btn-sell" onclick="setSide('sell')">SELL</button>
      </div>
      <label>Amount (USD)</label>
      <input type="number" id="trade-amount" placeholder="100.00" min="1" step="0.01" value="100">
      <div class="quick">
        <button class="q" onclick="setAmt(25)">$25</button>
        <button class="q" onclick="setAmt(50)">$50</button>
        <button class="q" onclick="setAmt(100)">$100</button>
        <button class="q" onclick="setAmt(250)">$250</button>
        <button class="q" onclick="setAmt('all')">Max</button>
      </div>
      <button class="exec buy" id="exec-btn" onclick="openCloseChoice()">Buy BTC/USD</button>
    </div>

    <div class="pos-card">
      <div class="pos-title">OPEN POSITIONS</div>
      <div id="positions"><div class="pos-empty">No open positions</div></div>
    </div>

    <div class="hist-card">
      <div class="pos-title">TRADE HISTORY</div>
      <div id="history"><div class="pos-empty">No closed trades yet</div></div>
    </div>
  </div>

  <div class="modal-bg" id="close-choice-modal">
    <div class="modal">
      <h3 id="choice-title">Place Trade</h3>
      <p id="choice-desc">How do you want to close this trade?</p>

      <button class="choice-btn" id="btn-manual" onclick="selectCloseMode('manual')">
        Close Manually
        <small>You close the trade yourself anytime</small>
      </button>
      <button class="choice-btn" id="btn-auto" onclick="selectCloseMode('auto')">
        Auto Close After Timer
        <small>Trade closes automatically after the time you set</small>
      </button>

      <div class="auto-panel" id="auto-panel">
        <label>Auto-close after (seconds)</label>
        <input type="number" id="auto-close-sec" placeholder="e.g. 30" min="5" max="86400" step="1" value="30">
        <div class="quick-sec">
          <button class="qs" onclick="setAutoSec(15)">15s</button>
          <button class="qs" onclick="setAutoSec(30)">30s</button>
          <button class="qs" onclick="setAutoSec(60)">1m</button>
          <button class="qs" onclick="setAutoSec(120)">2m</button>
          <button class="qs" onclick="setAutoSec(300)">5m</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeChoiceModal()">Cancel</button>
        <button class="modal-ok" id="choice-confirm" onclick="confirmTrade()">Confirm Trade</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="fund-modal">
    <div class="modal">
      <h3 id="modal-title">Transfer</h3>
      <p id="modal-desc">Move funds between accounts</p>
      <div class="avail-hint" id="avail-hint"></div>
      <label>Amount (USD)</label>
      <input type="number" id="fund-amount" placeholder="0.00" min="0.01" step="0.01">
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeFundModal()">Cancel</button>
        <button class="modal-ok" id="modal-ok-btn" onclick="confirmFund()">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const INSTRUMENTS = [
      { id: 'BTCUSD', name: 'BTC/USD', cat: 'crypto', icon: '₿', price: 64250, digits: 2 },
      { id: 'ETHUSD', name: 'ETH/USD', cat: 'crypto', icon: 'Ξ', price: 3120, digits: 2 },
      { id: 'SOLUSD', name: 'SOL/USD', cat: 'crypto', icon: '◎', price: 148.5, digits: 2 },
      { id: 'EURUSD', name: 'EUR/USD', cat: 'forex', icon: '€', price: 1.0842, digits: 4 },
      { id: 'GBPUSD', name: 'GBP/USD', cat: 'forex', icon: '£', price: 1.2635, digits: 4 },
      { id: 'USDJPY', name: 'USD/JPY', cat: 'forex', icon: '¥', price: 151.25, digits: 2 },
      { id: 'AAPL', name: 'AAPL', cat: 'stocks', icon: 'A', price: 178.4, digits: 2 },
      { id: 'TSLA', name: 'TSLA', cat: 'stocks', icon: 'T', price: 248.9, digits: 2 },
      { id: 'NVDA', name: 'NVDA', cat: 'stocks', icon: 'N', price: 875.2, digits: 2 },
      { id: 'XAUUSD', name: 'XAU/USD', cat: 'commodities', icon: 'Au', price: 2345, digits: 2 },
      { id: 'XAGUSD', name: 'XAG/USD', cat: 'commodities', icon: 'Ag', price: 27.85, digits: 2 },
      { id: 'WTI', name: 'WTI Oil', cat: 'commodities', icon: '🛢', price: 78.4, digits: 2 }
    ];

    let userId = null, mainBalance = 0, tradeBalance = 0;
    let selected = INSTRUMENTS[0], side = 'buy', positions = [];
    let fundMode = 'deposit', chartHistory = [], catFilter = 'all';
    let adminControl = null;
    let closeMode = 'manual';

    INSTRUMENTS.forEach(i => { i.base = i.price; i.chg = 0; });

    function parseMoney(v) {
      if (v == null || v === '') return 0;
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      const n = parseFloat(String(v).replace(/[$,\s]/g, ''));
      return isFinite(n) ? n : 0;
    }

    async function refreshBalances() {
      if (!userId) return;
      try {
        const { data: profile } = await client.from('profiles')
          .select('balance, trading_balance, trading_control')
          .eq('id', userId).maybeSingle();
        if (profile) {
          mainBalance = parseMoney(profile.balance);
          if (profile.trading_balance != null) {
            tradeBalance = parseMoney(profile.trading_balance);
          } else {
            const ls = localStorage.getItem('trading_balance_' + userId);
            if (ls != null) tradeBalance = parseMoney(ls);
          }
          if (profile.trading_control) {
            try {
              adminControl = typeof profile.trading_control === 'string'
                ? JSON.parse(profile.trading_control) : profile.trading_control;
            } catch (e) {}
          }
        }
      } catch (e) {}
      renderBalances();
    }

    async function loadAdminControl() {
      if (!userId) return;
      try {
        const { data } = await client.from('profiles').select('trading_control').eq('id', userId).maybeSingle();
        if (data && data.trading_control) {
          adminControl = typeof data.trading_control === 'string'
            ? JSON.parse(data.trading_control) : data.trading_control;
          return;
        }
      } catch (e) {}
      try {
        const raw = localStorage.getItem('ema_trading_control_' + userId)
          || localStorage.getItem('trading_control_' + userId);
        if (raw) adminControl = JSON.parse(raw);
      } catch (e) {}
    }

    function controlApplies(id) {
      if (!adminControl || !adminControl.enabled) return false;
      const pairs = adminControl.pairs || [];
      return !pairs.length || pairs.includes(id);
    }

    async function init() {
      let user = null;
      try {
        const { data: { session } } = await client.auth.getSession();
        user = session && session.user;
        if (!user) { const r = await client.auth.getUser(); user = r.data && r.data.user; }
      } catch (e) {}
      if (!user) { location.href = 'index.html'; return; }
      userId = user.id;

      await refreshBalances();
      if (!adminControl) await loadAdminControl();

      try { positions = JSON.parse(localStorage.getItem('trading_positions_' + userId) || '[]'); } catch(e){}

      renderBalances(); renderPairs(); renderPositions(); renderHistory(); seedChart();
      setInterval(tickPrices, 1200);
      setInterval(drawChart, 400);
      setInterval(checkAutoClose, 500);
      setInterval(renderPositions, 1000);
      setInterval(loadAdminControl, 12000);
      setInterval(refreshBalances, 20000);

      document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
          document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          catFilter = t.dataset.cat;
          renderPairs();
        };
      });
    }

    function fmt(n, d=2) { return Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); }
    function renderBalances() {
      document.getElementById('trade-bal').textContent = '$' + fmt(tradeBalance);
      document.getElementById('main-bal').textContent = '$' + fmt(mainBalance);
    }

    function renderPairs() {
      const items = INSTRUMENTS.filter(i => catFilter === 'all' || i.cat === catFilter);
      document.getElementById('pair-list').innerHTML = items.map(i => {
        const chgCls = i.chg >= 0 ? 'up' : 'down';
        const chgStr = (i.chg >= 0 ? '+' : '') + i.chg.toFixed(2) + '%';
        return `<div class="pair ${selected.id===i.id?'selected':''}" onclick="selectPair('${i.id}')">
          <div class="pair-left"><div class="pair-icon">${i.icon}</div>
          <div><div class="pair-name">${i.name}</div><div class="pair-cat">${i.cat}</div></div></div>
          <div class="pair-right"><div class="pair-price">${fmt(i.price,i.digits)}</div>
          <div class="pair-chg ${chgCls}">${chgStr}</div></div></div>`;
      }).join('');
    }

    function selectPair(id) {
      selected = INSTRUMENTS.find(i => i.id === id);
      document.getElementById('chart-sym').textContent = selected.name;
      updateExecBtn(); seedChart(); renderPairs();
    }
    function setSide(s) {
      side = s;
      document.getElementById('btn-buy').classList.toggle('active', s==='buy');
      document.getElementById('btn-sell').classList.toggle('active', s==='sell');
      updateExecBtn();
    }
    function updateExecBtn() {
      const btn = document.getElementById('exec-btn');
      btn.textContent = (side==='buy'?'Buy ':'Sell ') + selected.name;
      btn.className = 'exec ' + side;
    }
    function setAmt(v) {
      document.getElementById('trade-amount').value = v==='all' ? Math.max(0, Math.floor(tradeBalance*100)/100) : v;
    }

    function openCloseChoice() {
      const amt = parseMoney(document.getElementById('trade-amount').value);
      if (!amt || amt <= 0) return toast('Enter a valid amount', true);
      if (amt > tradeBalance + 0.001) return toast('Insufficient trading balance', true);

      closeMode = 'manual';
      document.getElementById('btn-manual').classList.add('active');
      document.getElementById('btn-auto').classList.remove('active');
      document.getElementById('auto-panel').classList.remove('show');
      document.getElementById('auto-close-sec').value = 30;

      const sideLabel = side === 'buy' ? 'Buy' : 'Sell';
      document.getElementById('choice-title').textContent = sideLabel + ' ' + selected.name;
      document.getElementById('choice-desc').textContent =
        'Amount $' + fmt(amt) + ' · How do you want to close this trade?';
      document.getElementById('close-choice-modal').classList.add('show');
    }

    function closeChoiceModal() {
      document.getElementById('close-choice-modal').classList.remove('show');
    }

    function selectCloseMode(mode) {
      closeMode = mode;
      document.getElementById('btn-manual').classList.toggle('active', mode === 'manual');
      document.getElementById('btn-auto').classList.toggle('active', mode === 'auto');
      document.getElementById('auto-panel').classList.toggle('show', mode === 'auto');
    }

    function setAutoSec(s) {
      document.getElementById('auto-close-sec').value = s;
    }

    function applyControlledMove(inst, now) {
      const controlled = positions.filter(p => p.instrumentId === inst.id && p.control);
      if (!controlled.length) return false;
      let applied = false;
      controlled.forEach(pos => {
        const c = pos.control;
        const ageMin = (now - pos.openedTs) / 60000;
        if (ageMin < c.startAfterMin) return;
        const progressMin = ageMin - c.startAfterMin;
        const dur = Math.max(0.1, c.durationMin);
        let targetDir = 1;
        if (c.direction === 'up') targetDir = 1;
        else if (c.direction === 'down') targetDir = -1;
        else if (c.direction === 'against') targetDir = pos.side === 'buy' ? -1 : 1;
        else if (c.direction === 'with') targetDir = pos.side === 'buy' ? 1 : -1;
        const targetPrice = pos.entry * (1 + targetDir * (c.targetPct / 100));
        if (progressMin <= dur) {
          const t = Math.min(1, progressMin / dur);
          inst.price = pos.entry + (targetPrice - pos.entry) * t;
          applied = true;
        } else if (c.afterBehavior === 'static') {
          inst.price = targetPrice; applied = true;
        } else if (c.afterBehavior === 'drop') {
          const after = progressMin - dur;
          const revT = Math.min(1, after / dur);
          inst.price = targetPrice + (pos.entry - targetPrice) * revT * 0.6;
          applied = true;
        } else {
          const vol = inst.cat === 'crypto' ? 0.002 : 0.001;
          inst.price = targetPrice * (1 + (Math.random() - 0.5) * vol);
          applied = true;
        }
      });
      return applied;
    }

    function tickPrices() {
      const now = Date.now();
      INSTRUMENTS.forEach(i => {
        if (!applyControlledMove(i, now)) {
          const vol = i.cat === 'forex' ? 0.0008 : i.cat === 'crypto' ? 0.004 : 0.002;
          i.price = Math.max(i.price * 0.01, i.price + (Math.random() - 0.48) * i.base * vol);
        }
        i.chg = ((i.price - i.base) / i.base) * 100;
      });
      chartHistory.push(selected.price);
      if (chartHistory.length > 60) chartHistory.shift();
      renderPairs();
    }

    function seedChart() {
      chartHistory = [];
      let p = selected.price;
      for (let i = 0; i < 50; i++) { p += (Math.random() - 0.5) * selected.price * 0.003; chartHistory.push(p); }
      drawChart();
    }

    function drawChart() {
      const c = document.getElementById('chart');
      const ctx = c.getContext('2d');
      const w = c.width, h = c.height;
      ctx.clearRect(0, 0, w, h);
      if (chartHistory.length < 2) return;
      const min = Math.min(...chartHistory), max = Math.max(...chartHistory), range = max - min || 1;
      const up = chartHistory[chartHistory.length - 1] >= chartHistory[0];
      ctx.strokeStyle = up ? '#10b981' : '#ef4444'; ctx.lineWidth = 2; ctx.beginPath();
      chartHistory.forEach((p, i) => {
        const x = (i / (chartHistory.length - 1)) * (w - 10) + 5;
        const y = h - 10 - ((p - min) / range) * (h - 20);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    async function confirmTrade() {
      const amt = parseMoney(document.getElementById('trade-amount').value);
      if (!amt || amt <= 0) return toast('Enter a valid amount', true);
      if (amt > tradeBalance + 0.001) return toast('Insufficient trading balance', true);

      let autoCloseSec = null;
      if (closeMode === 'auto') {
        autoCloseSec = parseInt(document.getElementById('auto-close-sec').value, 10);
        if (!autoCloseSec || autoCloseSec < 5) return toast('Enter at least 5 seconds for auto-close', true);
      }

      const entry = selected.price;
      const pos = {
        id: Date.now(),
        symbol: selected.name,
        instrumentId: selected.id,
        side,
        amount: amt,
        entry,
        digits: selected.digits,
        openedAt: new Date().toISOString(),
        openedTs: Date.now(),
        autoCloseSec: autoCloseSec
      };

      if (adminControl && adminControl.enabled && controlApplies(selected.id)) {
        pos.control = {
          direction: adminControl.direction || 'against',
          targetPct: Number(adminControl.targetPct) || 2.5,
          startAfterMin: Number(adminControl.startAfterMin) || 0,
          durationMin: Number(adminControl.durationMin) || 3,
          afterBehavior: adminControl.afterBehavior || 'static'
        };
      }

      positions.unshift(pos);
      tradeBalance -= amt;
      await saveTradeState();
      closeChoiceModal();
      renderBalances();
      renderPositions();
      toast((side === 'buy' ? 'Bought' : 'Sold') + ' ' + selected.name + ' @ ' + fmt(entry, selected.digits) +
        (autoCloseSec ? ' · auto-close ' + autoCloseSec + 's' : ' · close manually'));
    }

    function currentPnL(pos) {
      const inst = INSTRUMENTS.find(i => i.id === pos.instrumentId);
      if (!inst) return 0;
      const move = (inst.price - pos.entry) / pos.entry;
      return pos.amount * move * (pos.side === 'buy' ? 1 : -1);
    }

    function formatCountdown(totalSec) {
      totalSec = Math.max(0, Math.floor(totalSec));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      if (m > 0) return m + 'm ' + String(s).padStart(2, '0') + 's';
      return s + 's';
    }

    function renderPositions() {
      const el = document.getElementById('positions');
      if (!positions.length) { el.innerHTML = '<div class="pos-empty">No open positions</div>'; return; }
      const now = Date.now();
      el.innerHTML = positions.map(p => {
        const pnl = currentPnL(p);
        const isWin = pnl >= 0;
        const badge = isWin
          ? '<span class="badge-win">Unrealized Win</span>'
          : '<span class="badge-loss">Unrealized Loss</span>';
        let timerHtml = '';
        let totalSec = null;
        if (p.autoCloseSec) totalSec = p.autoCloseSec;
        else if (p.autoCloseMin) totalSec = p.autoCloseMin * 60;
        if (totalSec) {
          const left = Math.max(0, totalSec - (now - p.openedTs) / 1000);
          const urgent = left <= 10 ? ' urgent' : '';
          timerHtml = '<div class="pos-timer' + urgent + '">⏱ Auto-close ' + formatCountdown(left) + '</div>';
        }
        const currentVal = p.amount + pnl;
        return `<div class="pos-item">
          <div class="pos-top">
            <div>
              <div class="pos-sym">${p.side.toUpperCase()} ${p.symbol}</div>
              <div class="pos-meta">Entry @ ${fmt(p.entry, p.digits)}</div>
              ${timerHtml}
            </div>
            <div style="text-align:right">${badge}</div>
          </div>
          <div class="pos-stats">
            <div>
              <div class="stat-label">Original</div>
              <div class="stat-val">$${fmt(p.amount)}</div>
            </div>
            <div>
              <div class="stat-label">P/L</div>
              <div class="stat-val ${isWin?'win':'loss'}">${isWin?'+':''}$${fmt(pnl)}</div>
            </div>
            <div>
              <div class="stat-label">Current</div>
              <div class="stat-val ${isWin?'win':'loss'}">$${fmt(currentVal)}</div>
            </div>
          </div>
          <div class="pos-actions">
            <button class="close-btn" onclick="closePosition(${p.id})">Close Trade</button>
          </div>
        </div>`;
      }).join('');
    }

    function renderHistory() {
      const el = document.getElementById('history');
      if (!el) return;
      let hist = [];
      try { hist = JSON.parse(localStorage.getItem('trading_history_' + userId) || '[]'); } catch (e) {}
      if (!hist.length) { el.innerHTML = '<div class="pos-empty">No closed trades yet</div>'; return; }
      el.innerHTML = hist.slice(0, 30).map(h => {
        const amount = h.amount != null ? h.amount : null;
        const pnl = h.pnl != null ? h.pnl : 0;
        const isWin = pnl >= 0;
        const badge = isWin
          ? '<span class="badge-win">Win</span>'
          : '<span class="badge-loss">Loss</span>';
        const side = (h.side || '').toUpperCase();
        const sym = h.symbol || (h.title || '').replace(/^(BUY|SELL)\s+/i, '');
        const when = h.ts ? new Date(h.ts).toLocaleString() : '';
        const entry = h.entry != null ? fmt(h.entry, h.digits || 2) : null;
        const exit = h.exit != null ? fmt(h.exit, h.digits || 2) : null;
        return `<div class="hist-item">
          <div class="pos-top">
            <div>
              <div class="pos-sym">${side ? side + ' ' : ''}${sym}</div>
              <div class="pos-meta">${when}${entry ? ' · Entry ' + entry : ''}${exit ? ' · Exit ' + exit : ''}</div>
            </div>
            <div style="text-align:right">${badge}</div>
          </div>
          <div class="pos-stats">
            <div>
              <div class="stat-label">Original</div>
              <div class="stat-val">${amount != null ? '$' + fmt(amount) : '—'}</div>
            </div>
            <div>
              <div class="stat-label">P/L</div>
              <div class="stat-val ${isWin?'win':'loss'}">${isWin?'+':''}$${fmt(pnl)}</div>
            </div>
            <div>
              <div class="stat-label">Returned</div>
              <div class="stat-val ${isWin?'win':'loss'}">${amount != null ? '$' + fmt(Math.max(0, amount + pnl)) : '—'}</div>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    async function closePosition(id) {
      const idx = positions.findIndex(p => p.id === id);
      if (idx < 0) return;
      const p = positions[idx];
      const pnl = currentPnL(p);
      tradeBalance += Math.max(0, p.amount + pnl);
      positions.splice(idx, 1);
      try {
        const inst = INSTRUMENTS.find(i => i.id === p.instrumentId);
        const hist = JSON.parse(localStorage.getItem('trading_history_' + userId) || '[]');
        hist.unshift({
          title: p.side.toUpperCase() + ' ' + p.symbol,
          side: p.side,
          symbol: p.symbol,
          amount: p.amount,
          entry: p.entry,
          exit: inst ? inst.price : p.entry,
          digits: p.digits,
          pnl,
          ts: Date.now()
        });
        localStorage.setItem('trading_history_' + userId, JSON.stringify(hist.slice(0, 100)));
      } catch (e) {}
      await saveTradeState();
      renderBalances(); renderPositions(); renderHistory();
      toast('Closed ' + p.symbol + ' · ' + (pnl >= 0 ? 'Win' : 'Loss') + ' ' + (pnl >= 0 ? '+' : '') + '$' + fmt(pnl));
    }

    function checkAutoClose() {
      const now = Date.now();
      positions.filter(p => {
        if (p.autoCloseSec) return (now - p.openedTs) >= p.autoCloseSec * 1000;
        if (p.autoCloseMin) return (now - p.openedTs) >= p.autoCloseMin * 60000;
        return false;
      }).forEach(p => closePosition(p.id));
    }

    async function openFundModal(mode) {
      fundMode = mode;
      await refreshBalances();
      document.getElementById('modal-title').textContent = mode === 'deposit' ? 'Deposit to Trading' : 'Withdraw to Main';
      document.getElementById('modal-desc').textContent = mode === 'deposit'
        ? 'Move funds from your main balance into trading.'
        : 'Move trading profits back to your main balance.';
      const avail = mode === 'deposit' ? mainBalance : tradeBalance;
      document.getElementById('avail-hint').textContent =
        'Available: $' + fmt(avail) + (mode === 'deposit' ? ' (main balance)' : ' (trading balance)');
      document.getElementById('fund-amount').value = '';
      document.getElementById('fund-modal').classList.add('show');
    }
    function closeFundModal() { document.getElementById('fund-modal').classList.remove('show'); }

    async function confirmFund() {
      const btn = document.getElementById('modal-ok-btn');
      btn.disabled = true;
      btn.textContent = 'Working...';
      await refreshBalances();
      const amt = parseMoney(document.getElementById('fund-amount').value);
      if (!amt || amt <= 0) {
        btn.disabled = false; btn.textContent = 'Confirm';
        return toast('Enter a valid amount', true);
      }
      if (fundMode === 'deposit') {
        if (amt > mainBalance + 0.001) {
          btn.disabled = false; btn.textContent = 'Confirm';
          return toast('Not enough main balance (have $' + fmt(mainBalance) + ')', true);
        }
        mainBalance = Math.max(0, mainBalance - amt);
        tradeBalance = tradeBalance + amt;
      } else {
        if (amt > tradeBalance + 0.001) {
          btn.disabled = false; btn.textContent = 'Confirm';
          return toast('Not enough trading balance (have $' + fmt(tradeBalance) + ')', true);
        }
        tradeBalance = Math.max(0, tradeBalance - amt);
        mainBalance = mainBalance + amt;
      }
      try {
        const { error } = await client.from('profiles')
          .update({ balance: mainBalance, trading_balance: tradeBalance })
          .eq('id', userId);
        if (error) await client.from('profiles').update({ balance: mainBalance }).eq('id', userId);
      } catch (e) {}
      localStorage.setItem('trading_balance_' + userId, String(tradeBalance));
      btn.disabled = false; btn.textContent = 'Confirm';
      closeFundModal();
      renderBalances();
      toast(fundMode === 'deposit' ? 'Deposited $' + fmt(amt) + ' to trading' : 'Withdrew $' + fmt(amt) + ' to main');
    }

    async function saveTradeState() {
      localStorage.setItem('trading_balance_' + userId, String(tradeBalance));
      localStorage.setItem('trading_positions_' + userId, JSON.stringify(positions));
      try { await client.from('profiles').update({ trading_balance: tradeBalance }).eq('id', userId); } catch (e) {}
    }

    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = isErr ? '#ef4444' : '#10b981';
      t.style.color = isErr ? '#fca5a5' : '#34d399';
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3200);
    }

    init();
  </script>
</body>
</html>
