<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #131c38 0%, #070b19 100%);
      --card-bg: rgba(19, 27, 54, 0.7);
      --card-border: rgba(255, 255, 255, 0.07);
      --text-muted: #94a3b8;
    }

    body { background: var(--bg-gradient); background-attachment: fixed; color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 16px; padding-bottom: 100px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px; }
    .logo-text { background: linear-gradient(90deg, #4ade80, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
    .menu-btn { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: white; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; display: block; }
    
    .profile-header-box { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .avatar-wrapper { position: relative; width: 72px; height: 72px; cursor: pointer; flex-shrink: 0; }
    .avatar-preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.15); background: #1e294b; display: flex; align-items: center; justify-content: center; font-size: 32px; overflow: hidden; }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; font-size: 14px; }
    .avatar-wrapper:hover .avatar-overlay { opacity: 1; }

    .profile-info h3 { margin: 0 0 4px 0; font-size: 1.1rem; word-break: break-all; }
    .profile-info p { margin: 0; font-size: 0.8rem; color: var(--text-muted); }

    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 6px; }
    input { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.08); color: white; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; margin-bottom: 14px; }
    input:focus { border-color: #3b82f6; }
    
    .btn-main { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
    .btn-edit { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 10px; }
    .btn-logout { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; }

    .bottom-nav { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 448px; margin: 0 auto; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-around; padding: 10px 0; border-radius: 20px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; }
    .nav-item.active { color: #4ade80; }
    .nav-icon { font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1 class="logo-text">Equity Mixed Assets</h1>
      <button class="menu-btn" onclick="window.location.href='dashboard.html'">✕</button>
    </header>

    <!-- SAVED VIEW MODE -->
    <div class="card" id="profile-view-card" style="display: none;">
      <span class="card-title">MY PROFILE</span>
      <div class="profile-header-box">
        <div class="avatar-preview" id="view-avatar-box">👤</div>
        <div class="profile-info">
          <h3 id="view-username">Username</h3>
          <p>Active Profile</p>
        </div>
      </div>
      <button class="btn-edit" onclick="enableEditMode()">Edit Profile</button>
    </div>

    <!-- EDIT / SETUP MODE -->
    <div class="card" id="profile-edit-card">
      <span class="card-title" id="setup-title">PROFILE SETUP</span>
      
      <div class="profile-header-box">
        <div class="avatar-wrapper" onclick="document.getElementById('file-input').click()">
          <div class="avatar-preview" id="edit-avatar-box">👤</div>
          <div class="avatar-overlay">📷</div>
        </div>
        <div class="profile-info">
          <h3 id="edit-name-preview">Set Identity</h3>
          <p>Tap icon to upload picture</p>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

      <label>Username</label>
      <input type="text" id="username-input" placeholder="Enter your unique username">

      <button class="btn-main" onclick="saveProfileData()">Save & Continue</button>
    </div>

    <div class="card">
      <span class="card-title">SESSION</span>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="investment-plan.html" class="nav-item"><span class="nav-icon">📈</span>Plans</a>
    <a href="deposit.html" class="nav-item"><span class="nav-icon">💳</span>Deposit</a>
    <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙️</span>Settings</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentAvatarData = "";

    async function loadProfile() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      
      const { data, error } = await client.from('profiles').select('username, avatar_url').eq('id', user.id).single();
      
      if (data && data.username && data.username.trim() !== "") {
        // Hide setup, show locked view card
        document.getElementById('profile-view-card').style.display = 'block';
        document.getElementById('profile-edit-card').style.display = 'none';
        
        document.getElementById('view-username').innerText = data.username;
        if (data.avatar_url) {
          currentAvatarData = data.avatar_url;
          document.getElementById('view-avatar-box').innerHTML = `<img src="${data.avatar_url}" alt="Avatar">`;
        }
      } else {
        // Show setup view
        document.getElementById('profile-view-card').style.display = 'none';
        document.getElementById('profile-edit-card').style.display = 'block';
      }
    }

    function enableEditMode() {
      document.getElementById('profile-view-card').style.display = 'none';
      document.getElementById('profile-edit-card').style.display = 'block';
      document.getElementById('setup-title').innerText = "EDIT PROFILE";
      
      // Populate inputs with current values
      document.getElementById('username-input').value = document.getElementById('view-username').innerText;
      if (currentAvatarData) {
        document.getElementById('edit-avatar-box').innerHTML = `<img src="${currentAvatarData}" alt="Avatar">`;
      }
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        // Compress image using canvas to ensure it fits safely inside Supabase text columns
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxSize = 200; // max dimension
          let width = img.width;
          let height = img.height;
          
          if (width > height) {
            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
          } else {
            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
          }
          
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          
          currentAvatarData = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('edit-avatar-box').innerHTML = `<img src="${currentAvatarData}" alt="Avatar">`;
          document.getElementById('edit-name-preview').innerText = "Picture Ready";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveProfileData() {
      const username = document.getElementById('username-input').value.trim();
      if (!username) {
        alert('Please enter a username.');
        return;
      }

      const { data: { user } } = await client.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }

      const updatePayload = { username: username };
      if (currentAvatarData) {
        updatePayload.avatar_url = currentAvatarData;
      }

      const { error } = await client.from('profiles').update(updatePayload).eq('id', user.id);

      if (error) {
        alert('Save failed: ' + error.message);
      } else {
        alert('Profile saved successfully!');
        loadProfile();
      }
    }

    async function logout() {
      await client.auth.signOut();
      window.location.href = 'index.html';
    }

    loadProfile();
  </script>
</body>
</html>
