<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Equity Mixed Assets - Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #131c38 0%, #070b19 100%);
      --card-bg: rgba(19, 27, 54, 0.85);
      --card-border: rgba(255, 255, 255, 0.07);
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-gradient); background-attachment: fixed; color: white;
      font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 16px; padding-bottom: 110px;
      display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 480px; }
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px; }
    .logo-text {
      background: linear-gradient(90deg, #4ade80, #38bdf8); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; margin: 0;
    }
    .menu-btn {
      background: var(--card-bg); border: 1px solid var(--card-border); color: white;
      width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px;
      padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .card-title { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; display: block; }
    .profile-header-box { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .avatar-wrapper { position: relative; width: 48px; height: 48px; cursor: pointer; flex-shrink: 0; }
    .avatar-preview {
      width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15);
      background: #1e294b; display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .avatar-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.5); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .profile-info h3 { margin: 0 0 2px 0; font-size: 1rem; word-break: break-all; }
    .profile-info p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }
    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 6px; }
    input {
      background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); color: white;
      padding: 14px; border-radius: 12px; width: 100%; outline: none; font-size: 0.9rem; margin-bottom: 14px;
    }
    input:focus { border-color: #3b82f6; }
    .btn-main {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none;
      padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer;
      box-shadow: 0 4px 15px rgba(59,130,246,0.4); font-size: 0.95rem;
    }
    .btn-edit {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: white;
      padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 6px; font-size: 0.9rem;
    }
    .btn-cancel {
      background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted);
      padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 8px;
    }
    .btn-logout {
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5;
      padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer;
    }
    .locked-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    }
    .locked-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .locked-value { font-size: 1rem; font-weight: 700; margin-top: 2px; letter-spacing: 2px; }
    .status-ok { color: #34d399; font-size: 0.8rem; font-weight: 700; }
    .status-warn { color: #fbbf24; font-size: 0.8rem; font-weight: 700; }
    .hint { color: var(--text-muted); font-size: 0.85rem; margin: 0 0 12px; line-height: 1.4; }
    .msg { font-size: 0.8rem; margin: 10px 0 0; text-align: center; min-height: 1.2em; }
    .hidden { display: none !important; }
    .bottom-nav {
      position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 448px; margin: 0 auto;
      background: rgba(15,23,42,0.92); border: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-around; padding: 10px 0; border-radius: 20px; z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .nav-item {
      color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .nav-item.active { color: #4ade80; }
    .nav-icon { font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1 class="logo-text">Equity Mixed Assets</h1>
      <button type="button" class="menu-btn" id="btn-close">✕</button>
    </header>

    <!-- PROFILE VIEW (locked) -->
    <div class="card" id="profile-view-card">
      <span class="card-title">MY PROFILE</span>
      <div class="profile-header-box">
        <div class="avatar-preview" id="view-avatar-box">👤</div>
        <div class="profile-info">
          <h3 id="view-username">Loading…</h3>
          <p id="view-sub">Active Profile</p>
        </div>
      </div>
      <button type="button" class="btn-edit" id="btn-edit-profile">Edit Profile</button>
    </div>

    <!-- PROFILE EDIT -->
    <div class="card hidden" id="profile-edit-card">
      <span class="card-title" id="setup-title">EDIT PROFILE</span>
      <div class="profile-header-box">
        <div class="avatar-wrapper" id="avatar-pick">
          <div class="avatar-preview" id="edit-avatar-box">👤</div>
          <div class="avatar-overlay">📷</div>
        </div>
        <div class="profile-info">
          <h3 id="edit-name-preview">Tap icon for photo</h3>
          <p>Profile picture</p>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" class="hidden">
      <label>Username</label>
      <input type="text" id="username-input" placeholder="Enter your unique username" autocomplete="username">
      <button type="button" class="btn-main" id="btn-save-profile">Save Profile</button>
      <button type="button" class="btn-cancel" id="btn-cancel-profile">Cancel</button>
      <p class="msg" id="profile-msg"></p>
    </div>

    <!-- PIN VIEW (locked) -->
    <div class="card" id="pin-view-card">
      <span class="card-title">TRANSFER PIN</span>
      <p class="hint">Required when sending money. Locked until you edit.</p>
      <div class="locked-row">
        <div>
          <div class="locked-label">Status</div>
          <div class="locked-value" id="pin-status-text">—</div>
        </div>
        <div id="pin-status-badge" class="status-warn">…</div>
      </div>
      <button type="button" class="btn-edit" id="btn-edit-pin">Edit PIN</button>
    </div>

    <!-- PIN EDIT -->
    <div class="card hidden" id="pin-edit-card">
      <span class="card-title">EDIT TRANSFER PIN</span>
      <p class="hint">Min 4 characters. Keep it private.</p>
      <div id="pin-current-wrap">
        <label>CURRENT PIN</label>
        <input type="password" id="pin-current" placeholder="Enter current PIN" autocomplete="off">
      </div>
      <label>NEW PIN</label>
      <input type="password" id="pin-new" placeholder="••••" inputmode="numeric" maxlength="12" autocomplete="new-password">
      <label>CONFIRM NEW PIN</label>
      <input type="password" id="pin-confirm" placeholder="••••" inputmode="numeric" maxlength="12" autocomplete="new-password">
      <button type="button" class="btn-main" id="btn-save-pin">Save Transfer PIN</button>
      <button type="button" class="btn-cancel" id="btn-cancel-pin">Cancel</button>
      <p class="msg" id="pin-msg"></p>
    </div>

    <div class="card">
      <span class="card-title">SESSION</span>
      <button type="button" class="btn-logout" id="btn-logout">Log Out</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="investment-plan.html" class="nav-item"><span class="nav-icon">📈</span>Plans</a>
    <a href="deposit.html" class="nav-item"><span class="nav-icon">💳</span>Deposit</a>
    <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙️</span>Settings</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Own client — do not depend on config.js so buttons always work
    var SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage }
    });

    var currentAvatarData = "";
    var currentUserId = null;
    var hasUsername = false;
    var storedPin = "";

    function $(id) { return document.getElementById(id); }
    function show(el) { if (el) el.classList.remove('hidden'); }
    function hide(el) { if (el) el.classList.add('hidden'); }

    function pinKey() {
      return currentUserId ? ('transfer_pin_' + currentUserId) : 'transfer_pin_guest';
    }

    function refreshPinBadge() {
      var text = $('pin-status-text');
      var badge = $('pin-status-badge');
      if (storedPin && storedPin.length >= 4) {
        text.textContent = '••••••';
        badge.textContent = 'Locked';
        badge.className = 'status-ok';
      } else {
        text.textContent = 'Not set';
        badge.textContent = 'Required';
        badge.className = 'status-warn';
      }
    }

    function showProfileView() {
      show($('profile-view-card'));
      hide($('profile-edit-card'));
    }
    function showProfileEdit() {
      hide($('profile-view-card'));
      show($('profile-edit-card'));
      $('username-input').value = hasUsername ? ($('view-username').innerText || '') : '';
      if (currentAvatarData) {
        $('edit-avatar-box').innerHTML = '<img src="' + currentAvatarData + '" alt="Avatar">';
      }
      $('profile-msg').textContent = '';
      $('setup-title').textContent = hasUsername ? 'EDIT PROFILE' : 'PROFILE SETUP';
    }
    function showPinView() {
      show($('pin-view-card'));
      hide($('pin-edit-card'));
      refreshPinBadge();
    }
    function showPinEdit() {
      hide($('pin-view-card'));
      show($('pin-edit-card'));
      $('pin-current').value = '';
      $('pin-new').value = '';
      $('pin-confirm').value = '';
      $('pin-msg').textContent = '';
      if (storedPin && storedPin.length >= 4) {
        show($('pin-current-wrap'));
      } else {
        hide($('pin-current-wrap'));
      }
    }

    async function loadProfile() {
      try {
        var user = null;
        var sess = await client.auth.getSession();
        user = sess.data && sess.data.session && sess.data.session.user;
        if (!user) {
          var gu = await client.auth.getUser();
          user = gu.data && gu.data.user;
        }
        if (!user) {
          window.location.href = 'index.html';
          return;
        }
        currentUserId = user.id;

        // PIN from localStorage only (works even if DB column missing)
        storedPin = localStorage.getItem(pinKey()) || '';
        refreshPinBadge();

        // Profile fields only — no transfer_pin column required
        var res = await client.from('profiles')
          .select('username, avatar_url')
          .eq('id', user.id)
          .maybeSingle();

        var data = res.data;
        if (data && data.username && String(data.username).trim() !== '') {
          hasUsername = true;
          $('view-username').innerText = data.username;
          $('view-sub').innerText = 'Active Profile';
          if (data.avatar_url) {
            currentAvatarData = data.avatar_url;
            $('view-avatar-box').innerHTML = '<img src="' + data.avatar_url + '" alt="Avatar">';
          }
          showProfileView();
        } else {
          hasUsername = false;
          $('view-username').innerText = 'No username';
          $('view-sub').innerText = 'Tap Edit to set up';
          showProfileView();
        }
      } catch (e) {
        console.error(e);
        $('view-username').innerText = 'Profile';
        $('view-sub').innerText = 'Tap Edit to set up';
        showProfileView();
        refreshPinBadge();
      }
    }

    function handleImageUpload(event) {
      var file = event.target.files && event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var maxSize = 150;
          var width = img.width, height = img.height;
          if (width > height) {
            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
          } else {
            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
          }
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          currentAvatarData = canvas.toDataURL('image/jpeg', 0.7);
          $('edit-avatar-box').innerHTML = '<img src="' + currentAvatarData + '" alt="Avatar">';
          $('edit-name-preview').innerText = 'Picture Ready';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveProfileData() {
      var msg = $('profile-msg');
      var username = ($('username-input').value || '').trim();
      if (!username) {
        msg.style.color = '#fca5a5';
        msg.textContent = 'Please enter a username';
        return;
      }
      if (!currentUserId) {
        msg.style.color = '#fca5a5';
        msg.textContent = 'Not logged in';
        return;
      }
      msg.style.color = '#94a3b8';
      msg.textContent = 'Saving…';

      var payload = { id: currentUserId, username: username };
      if (currentAvatarData) payload.avatar_url = currentAvatarData;

      try {
        var res = await client.from('profiles').upsert(payload);
        if (res.error) {
          msg.style.color = '#fca5a5';
          msg.textContent = 'Save failed: ' + res.error.message;
          return;
        }
        hasUsername = true;
        $('view-username').innerText = username;
        $('view-sub').innerText = 'Active Profile';
        if (currentAvatarData) {
          $('view-avatar-box').innerHTML = '<img src="' + currentAvatarData + '" alt="Avatar">';
        }
        msg.style.color = '#34d399';
        msg.textContent = 'Saved';
        setTimeout(showProfileView, 400);
      } catch (e) {
        msg.style.color = '#fca5a5';
        msg.textContent = 'Save failed';
      }
    }

    function saveTransferPin() {
      var msg = $('pin-msg');
      var cur = $('pin-current').value || '';
      var neu = $('pin-new').value || '';
      var conf = $('pin-confirm').value || '';

      if (neu.length < 4) {
        msg.style.color = '#fca5a5';
        msg.textContent = 'PIN must be at least 4 characters';
        return;
      }
      if (neu !== conf) {
        msg.style.color = '#fca5a5';
        msg.textContent = 'New PIN and confirm do not match';
        return;
      }
      if (storedPin && storedPin.length >= 4 && cur !== storedPin) {
        msg.style.color = '#fca5a5';
        msg.textContent = 'Current PIN is incorrect';
        return;
      }
      if (!currentUserId) {
        msg.style.color = '#fca5a5';
        msg.textContent = 'Not logged in — refresh and try again';
        return;
      }

      // Local lock — always works without Supabase column
      try {
        localStorage.setItem(pinKey(), neu);
        storedPin = neu;
      } catch (e) {
        msg.style.color = '#fca5a5';
        msg.textContent = 'Could not save on this device';
        return;
      }

      // Optional cloud sync (ignore errors if column missing)
      try {
        client.from('profiles').update({ transfer_pin: neu }).eq('id', currentUserId).then(function () {});
      } catch (e) {}

      msg.style.color = '#34d399';
      msg.textContent = 'PIN saved & locked';
      setTimeout(showPinView, 500);
    }

    async function doLogout() {
      try { await client.auth.signOut(); } catch (e) {}
      window.location.href = 'index.html';
    }

    // Wire buttons with addEventListener (more reliable than inline onclick on mobile)
    function bind() {
      $('btn-close').addEventListener('click', function () {
        window.location.href = 'dashboard.html';
      });
      $('btn-edit-profile').addEventListener('click', function (e) {
        e.preventDefault();
        showProfileEdit();
      });
      $('btn-cancel-profile').addEventListener('click', function (e) {
        e.preventDefault();
        showProfileView();
      });
      $('btn-save-profile').addEventListener('click', function (e) {
        e.preventDefault();
        saveProfileData();
      });
      $('avatar-pick').addEventListener('click', function () {
        $('file-input').click();
      });
      $('file-input').addEventListener('change', handleImageUpload);

      $('btn-edit-pin').addEventListener('click', function (e) {
        e.preventDefault();
        showPinEdit();
      });
      $('btn-cancel-pin').addEventListener('click', function (e) {
        e.preventDefault();
        showPinView();
      });
      $('btn-save-pin').addEventListener('click', function (e) {
        e.preventDefault();
        saveTransferPin();
      });
      $('btn-logout').addEventListener('click', function (e) {
        e.preventDefault();
        doLogout();
      });
    }

    bind();
    loadProfile();
  </script>
</body>
</html>
