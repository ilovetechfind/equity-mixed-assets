<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #131c38 0%, #070b19 100%);
      --card-bg: rgba(19, 27, 54, 0.7);
      --card-border: rgba(255, 255, 255, 0.07);
      --text-muted: #94a3b8;
    }

    body { background: var(--bg-gradient); background-attachment: fixed; color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 16px; padding-bottom: 100px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px; }
    .logo-text { background: linear-gradient(90deg, #4ade80, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
    .menu-btn { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: white; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; display: block; }
    
    .profile-preview-container { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .avatar-preview { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); background: #1e294b; display: flex; align-items: center; justify-content: center; font-size: 28px; }

    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 6px; }
    input { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.08); color: white; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; outline: none; font-size: 0.9rem; margin-bottom: 14px; }
    input:focus { border-color: #3b82f6; }
    
    .btn-save { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); margin-bottom: 10px; }
    .btn-logout { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; }

    .bottom-nav { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 448px; margin: 0 auto; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-around; padding: 10px 0; border-radius: 20px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; }
    .nav-item.active { color: #4ade80; }
    .nav-icon { font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1 class="logo-text">Equity Mixed Assets</h1>
      <button class="menu-btn" onclick="window.location.href='dashboard.html'">✕</button>
    </header>

    <div class="card">
      <span class="card-title">PROFILE CUSTOMIZATION</span>
      
      <div class="profile-preview-container">
        <div id="avatar-container">
          <div class="avatar-preview" id="avatar-placeholder">👤</div>
        </div>
        <div>
          <h3 id="profile-name-display" style="margin:0 0 4px 0; font-size:1.1rem;">User</h3>
          <p style="margin:0; font-size:0.75rem; color:var(--text-muted);">Manage your public identity</p>
        </div>
      </div>

      <label>Username</label>
      <input type="text" id="username-input" placeholder="Enter your username">

      <label>Profile Picture URL</label>
      <input type="text" id="avatar-url-input" placeholder="https://example.com/your-image.jpg">

      <button class="btn-save" onclick="updateProfile()">Save Profile Details</button>
    </div>

    <div class="card">
      <span class="card-title">SESSION</span>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="investment-plan.html" class="nav-item"><span class="nav-icon">📈</span>Plans</a>
    <a href="deposit.html" class="nav-item"><span class="nav-icon">💳</span>Deposit</a>
    <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙️</span>Settings</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadProfile() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      
      const { data } = await client.from('profiles').select('username, avatar_url').eq('id', user.id).single();
      if (data) {
        if (data.username) {
          document.getElementById('username-input').value = data.username;
          document.getElementById('profile-name-display').innerText = data.username;
        }
        if (data.avatar_url) {
          document.getElementById('avatar-url-input').value = data.avatar_url;
          document.getElementById('avatar-container').innerHTML = `<img src="${data.avatar_url}" class="avatar-preview" alt="Avatar">`;
        }
      }
    }

    async function updateProfile() {
      const { data: { user } } = await client.auth.getUser();
      const newUsername = document.getElementById('username-input').value;
      const newAvatarUrl = document.getElementById('avatar-url-input').value;
      
      const { error } = await client.from('profiles').update({ 
        username: newUsername, 
        avatar_url: newAvatarUrl 
      }).eq('id', user.id);

      if (error) {
        alert('Error updating profile: ' + error.message);
      } else {
        alert('Profile updated successfully!');
        loadProfile();
      }
    }

    async function logout() {
      await client.auth.signOut();
      window.location.href = 'index.html';
    }

    loadProfile();
  </script>
</body>
</html>
