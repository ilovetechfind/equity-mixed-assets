<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Sign Up</title>
  
  <!-- Load Supabase FIRST, then your config.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background-color: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #334155; box-sizing: border-box; }
    .badge { background: #10b981; color: white; font-size: 11px; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; display: inline-block; margin-bottom: 12px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
    .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: white; box-sizing: border-box; font-size: 14px; outline: none; }
    .btn { width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 15px; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .links { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
    .links a { color: #10b981; text-decoration: none; }
    .alert-msg { font-size: 13px; text-align: center; margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Client Portal</span>
    <div class="title">Create Client Account</div>
    
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe">
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="client@example.com">
    </div>
    
    <div class="input-group">
      <label>Password</label>
      <div style="position: relative; width: 100%;">
        <input type="password" id="password" placeholder="••••••••" style="padding-right: 50px;">
        <button type="button" id="eye-btn" onclick="togglePass()" style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: #94a3b8; padding: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 50;">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    
    <button class="btn" id="signup-btn" onclick="handleClientSignUp()">Sign Up</button>
    
    <div id="alert-box" class="alert-msg"></div>

    <div class="links">
      Already have an account? <a href="index.html">Log in here</a>
    </div>
  </div>

  <script>
    function togglePass() {
      const input = document.getElementById('password');
      const btn = document.getElementById('eye-btn');
      
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }

    async function handleClientSignUp() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const alertBox = document.getElementById('alert-box');
      const signupBtn = document.getElementById('signup-btn');

      alertBox.style.display = 'none';

      if (!name || !email || !password) {
        alertBox.style.color = '#ef4444';
        alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
        alertBox.innerText = "Please fill in all fields.";
        alertBox.style.display = 'block';
        return;
      }

      signupBtn.innerText = "Processing...";
      signupBtn.disabled = true;

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: { data: { role: 'client', full_name: name } }
      });

      signupBtn.innerText = "Sign Up";
      signupBtn.disabled = false;

      if (error) {
        alertBox.style.color = '#ef4444';
        alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
        alertBox.innerText = error.message;
        alertBox.style.display = 'block';
      } else if (data.user && !data.session) {
        // Supabase requires email verification
        alertBox.style.color = '#10b981';
        alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
        alertBox.innerText = "Success! Please check your email inbox to verify your account.";
        alertBox.style.display = 'block';
      } else {
        // No email verification required, auto-login successful
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
