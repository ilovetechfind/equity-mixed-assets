<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background-color: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #334155; box-sizing: border-box; }
    .badge { background: #10b981; color: white; font-size: 11px; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; display: inline-block; margin-bottom: 12px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
    .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: white; box-sizing: border-box; font-size: 14px; outline: none; }
    .btn { width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 15px; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .links { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
    .links a { color: #10b981; text-decoration: none; }
    .alert-msg { font-size: 13px; text-align: center; margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Client Portal</span>
    <div class="title" id="page-title">Create Client Account</div>
    
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe">
    </div>
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="client@example.com">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    
    <button class="btn" id="signup-btn" onclick="handleSignUp()">Sign Up</button>
    <div id="alert-box" class="alert-msg"></div>

    <div class="links">
      Already have an account? <a href="index.html">Log in here</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    if (refCode) {
      document.getElementById('page-title').innerText = `Sign Up (Invited)`;
    }

    async function handleSignUp() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const alertBox = document.getElementById('alert-box');
      const btn = document.getElementById('signup-btn');

      alertBox.style.display = 'none';
      if (!name || !email || !password) {
        alertBox.style.color = '#ef4444';
        alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
        alertBox.innerText = "Please fill in all fields.";
        alertBox.style.display = 'block';
        return;
      }

      btn.innerText = "Processing...";
      btn.disabled = true;

      const { data, error } = await client.auth.signUp({ email, password });
      if (error) {
        alertBox.style.color = '#ef4444';
        alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
        alertBox.innerText = error.message;
        alertBox.style.display = 'block';
        btn.innerText = "Sign Up";
        btn.disabled = false;
        return;
      }

      const userId = data.user.id;

      await client.from('profiles').insert([{
        id: userId,
        full_name: name,
        role: 'client',
        referred_by: refCode || null,
        balance: 0.00,
        volume: 0.00
      }]);

      await client.auth.signInWithPassword({ email, password });
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
