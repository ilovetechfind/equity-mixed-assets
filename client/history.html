<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Equity Mixed Assets - History</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(18, 24, 38, 0.85);
      --border: rgba(255,255,255,0.08);
      --muted: #8b9bb4;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px; padding-bottom: 40px;
      background: radial-gradient(circle at top, #131c38 0%, var(--bg) 60%);
      color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .back {
      background: var(--card); border: 1px solid var(--border); color: #fff;
      padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.85rem;
    }
    .title { font-size: 1.15rem; font-weight: 800; margin: 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }
    .tab.active { background: rgba(59,130,246,0.2); border-color: var(--blue); color: #93c5fd; }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
    }
    .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .item-title { font-weight: 700; font-size: 0.95rem; }
    .item-amt { font-weight: 800; font-size: 0.95rem; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .item-meta { font-size: 0.75rem; color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
    .badge {
      font-size: 0.65rem; font-weight: 800; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 20px;
      background: rgba(255,255,255,0.06); color: var(--muted);
    }
    .badge.trade { color: #93c5fd; background: rgba(59,130,246,0.15); }
    .badge.bet { color: #fca5a5; background: rgba(239,68,68,0.15); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="dashboard.html" class="back">← Back</a>
      <h1 class="title">History</h1>
    </div>

    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="trade">Trading</button>
      <button class="tab" data-filter="bet">Red / Black</button>
    </div>

    <div class="list" id="list">
      <div class="empty">Loading…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    let userId = null;
    let allItems = [];
    let filter = 'all';

    async function init() {
      const { data: { session } } = await client.auth.getSession();
      let user = session && session.user;
      if (!user) {
        const res = await client.auth.getUser();
        user = res.data && res.data.user;
      }
      if (!user) { window.location.href = 'index.html'; return; }
      userId = user.id;

      // Trading positions closed history
      const tradeHist = JSON.parse(localStorage.getItem('trading_history_' + userId) || '[]');
      // Open positions still active aren't history
      const betHist = JSON.parse(localStorage.getItem('redblack_history_' + userId) || '[]');

      allItems = [
        ...tradeHist.map(h => ({ ...h, kind: 'trade' })),
        ...betHist.map(h => ({ ...h, kind: 'bet' }))
      ].sort((a, b) => (b.ts || 0) - (a.ts || 0));

      document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
          document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          filter = t.dataset.filter;
          render();
        };
      });

      render();
    }

    function fmt(n) {
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function render() {
      const list = document.getElementById('list');
      const items = allItems.filter(i => filter === 'all' || i.kind === filter);
      if (!items.length) {
        list.innerHTML = '<div class="empty">No history yet. Place trades or bets to see them here.</div>';
        return;
      }
      list.innerHTML = items.map(i => {
        const pnl = Number(i.pnl || 0);
        const cls = pnl >= 0 ? 'up' : 'down';
        const sign = pnl >= 0 ? '+' : '';
        const when = i.ts ? new Date(i.ts).toLocaleString() : '';
        const badge = i.kind === 'trade' ? 'trade' : 'bet';
        const label = i.kind === 'trade' ? 'TRADE' : 'BET';
        return `<div class="item">
          <div class="item-top">
            <div>
              <span class="badge ${badge}">${label}</span>
              <span class="item-title" style="margin-left:8px">${i.title || i.symbol || '—'}</span>
            </div>
            <div class="item-amt ${cls}">${sign}$${fmt(pnl)}</div>
          </div>
          <div class="item-meta">${i.detail || ''} · ${when}</div>
        </div>`;
      }).join('');
    }

    init();
  </script>
</body>
</html>
