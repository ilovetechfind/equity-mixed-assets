<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Equity Mixed Assets - History</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(18, 24, 38, 0.85);
      --border: rgba(255,255,255,0.08);
      --muted: #8b9bb4;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px; padding-bottom: 40px;
      background: radial-gradient(circle at top, #131c38 0%, var(--bg) 60%);
      color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .back {
      background: var(--card); border: 1px solid var(--border); color: #fff;
      padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.85rem;
    }
    .title { font-size: 1.15rem; font-weight: 800; margin: 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab {
      flex: 1; min-width: 70px; background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 10px 8px; border-radius: 12px; font-weight: 700; font-size: 0.78rem; cursor: pointer;
    }
    .tab.active { background: rgba(59,130,246,0.2); border-color: var(--blue); color: #93c5fd; }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
    }
    .item-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
    .item-title { font-weight: 700; font-size: 0.95rem; }
    .item-amt { font-weight: 800; font-size: 0.95rem; white-space: nowrap; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .item-meta { font-size: 0.75rem; color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
    .badge {
      font-size: 0.65rem; font-weight: 800; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 20px;
      background: rgba(255,255,255,0.06); color: var(--muted);
    }
    .badge.trade { color: #93c5fd; background: rgba(59,130,246,0.15); }
    .badge.bet { color: #fca5a5; background: rgba(239,68,68,0.15); }
    .badge.transfer { color: #6ee7b7; background: rgba(16,185,129,0.15); }
    .badge.race { color: #4ade80; background: rgba(34,197,94,0.15); }
    .badge.win { color: #34d399; background: rgba(16,185,129,0.15); }
    .badge.loss { color: #fca5a5; background: rgba(239,68,68,0.15); }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      margin-top: 10px; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 10px;
    }
    .stat-label { font-size: 0.62rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-val { font-size: 0.85rem; font-weight: 800; margin-top: 2px; }
    .stat-val.up { color: var(--green); }
    .stat-val.down { color: var(--red); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="dashboard.html" class="back">← Back</a>
      <h1 class="title">History</h1>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-filter="all">All</button>
      <button type="button" class="tab" data-filter="trade">Trading</button>
      <button type="button" class="tab" data-filter="bet">Red / Black</button>
      <button type="button" class="tab" data-filter="transfer">Transfers</button>
      <button type="button" class="tab" data-filter="race">Horse Race</button>
    </div>

    <div class="list" id="list">
      <div class="empty">Loading…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    var userId = null;
    var allItems = [];
    var filter = 'all';

    function fmt(n) {
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function parseNotif(n) {
      try {
        var j = JSON.parse(n.message);
        if (j && (j.dir === 'sent' || j.dir === 'recv')) {
          return {
            kind: 'transfer',
            dir: j.dir,
            title: j.dir === 'sent' ? ('To @' + (j.other || 'User')) : ('From @' + (j.other || 'User')),
            detail: j.note || (j.dir === 'sent' ? 'Money sent' : 'Money received'),
            pnl: j.dir === 'sent' ? -Number(j.amount || 0) : Number(j.amount || 0),
            amount: Number(j.amount || 0),
            ts: n.created_at ? new Date(n.created_at).getTime() : Date.now()
          };
        }
      } catch (e) {}
      var msg = n.message || '';
      var m = msg.match(/\$([\d,]+(?:\.\d+)?)/);
      var amt = m ? parseFloat(m[1].replace(/,/g, '')) : 0;
      if (n.type === 'transfer_sent') {
        var u = msg.match(/@([\w.-]+)/);
        return { kind: 'transfer', dir: 'sent', title: 'To @' + (u ? u[1] : 'User'), detail: 'Money sent', pnl: -amt, amount: amt, ts: n.created_at ? new Date(n.created_at).getTime() : Date.now() };
      }
      if (n.type === 'transfer_received') {
        var u2 = msg.match(/from @([\w.-]+)/i) || msg.match(/@([\w.-]+)/);
        return { kind: 'transfer', dir: 'recv', title: 'From @' + (u2 ? u2[1] : 'User'), detail: 'Money received', pnl: amt, amount: amt, ts: n.created_at ? new Date(n.created_at).getTime() : Date.now() };
      }
      return null;
    }

    async function init() {
      var session = await client.auth.getSession();
      var user = session.data && session.data.session && session.data.session.user;
      if (!user) {
        var res = await client.auth.getUser();
        user = res.data && res.data.user;
      }
      if (!user) { window.location.href = 'index.html'; return; }
      userId = user.id;

      var tradeHist = [];
      var betHist = [];
      try { tradeHist = JSON.parse(localStorage.getItem('trading_history_' + userId) || '[]'); } catch (e) {}
      try { betHist = JSON.parse(localStorage.getItem('redblack_history_' + userId) || '[]'); } catch (e) {}
      var raceHist = [];
      try { raceHist = JSON.parse(localStorage.getItem('horse_race_history_' + userId) || '[]'); } catch (e) {}

      allItems = [];
      tradeHist.forEach(function (h) {
        var side = (h.side || '').toUpperCase();
        var sym = h.symbol || (h.title || '').replace(/^(BUY|SELL)\s+/i, '') || 'Trade';
        var title = (side ? side + ' ' : '') + sym;
        if (!side && h.title) title = h.title;
        allItems.push({
          kind: 'trade',
          title: title,
          detail: '',
          pnl: Number(h.pnl || 0),
          amount: h.amount != null ? Number(h.amount) : null,
          entry: h.entry,
          exit: h.exit,
          digits: h.digits || 2,
          ts: h.ts || 0
        });
      });
      betHist.forEach(function (h) {
        allItems.push({
          kind: 'bet',
          title: h.title || 'Red / Black',
          detail: h.detail || '',
          pnl: Number(h.pnl || 0),
          amount: h.amount != null ? Number(h.amount) : (h.stake != null ? Number(h.stake) : null),
          ts: h.ts || 0
        });
      });
      raceHist.forEach(function (h) {
        allItems.push({
          kind: 'race',
          title: h.title || 'Horse Race',
          detail: h.detail || '',
          pnl: Number(h.pnl || 0),
          amount: h.amount != null ? Number(h.amount) : (h.stake != null ? Number(h.stake) : null),
          ts: h.ts || 0
        });
      });

      try {
        var { data } = await client.from('notifications')
          .select('type, message, created_at')
          .eq('user_id', userId)
          .in('type', ['transfer_sent', 'transfer_received'])
          .order('created_at', { ascending: false })
          .limit(50);
        if (data) {
          data.forEach(function (n) {
            var p = parseNotif(n);
            if (p) allItems.push(p);
          });
        }
      } catch (e) {}

      try {
        var local = JSON.parse(localStorage.getItem('transfers_' + userId) || '[]');
        local.forEach(function (h) {
          var exists = allItems.some(function (x) {
            return x.kind === 'transfer' && Math.abs((x.ts || 0) - (h.ts || 0)) < 5000 && Math.abs(Math.abs(x.pnl) - Number(h.amount || 0)) < 0.01;
          });
          if (!exists) {
            allItems.push({
              kind: 'transfer',
              dir: h.dir,
              title: h.dir === 'sent' ? ('To @' + h.other) : ('From @' + h.other),
              detail: h.note || (h.dir === 'sent' ? 'Money sent' : 'Money received'),
              pnl: h.dir === 'sent' ? -Number(h.amount || 0) : Number(h.amount || 0),
              amount: Number(h.amount || 0),
              ts: h.ts || 0
            });
          }
        });
      } catch (e) {}

      allItems.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });

      document.querySelectorAll('.tab').forEach(function (t) {
        t.onclick = function () {
          document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
          t.classList.add('active');
          filter = t.getAttribute('data-filter');
          render();
        };
      });

      render();
    }

    function render() {
      var list = document.getElementById('list');
      var items = allItems.filter(function (i) {
        return filter === 'all' || i.kind === filter;
      });
      if (!items.length) {
        var emptyMsg = 'No history yet.';
        if (filter === 'transfer') emptyMsg = 'No transfers yet. Send or receive money to see them here.';
        else if (filter === 'trade') emptyMsg = 'No trades yet.';
        else if (filter === 'bet') emptyMsg = 'No Red / Black bets yet.';
        else if (filter === 'race') emptyMsg = 'No horse races yet.';
        else emptyMsg = 'No history yet. Place trades, bets, or transfers to see them here.';
        list.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
        return;
      }
      list.innerHTML = items.map(function (i) {
        var pnl = Number(i.pnl || 0);
        var cls = pnl >= 0 ? 'up' : 'down';
        var sign = pnl >= 0 ? '+' : '';
        var when = i.ts ? new Date(i.ts).toLocaleString() : '';
        var badge = i.kind === 'trade' ? 'trade' : (i.kind === 'bet' ? 'bet' : (i.kind === 'race' ? 'race' : 'transfer'));
        var label = i.kind === 'trade' ? 'TRADE' : (i.kind === 'bet' ? 'BET' : (i.kind === 'race' ? 'RACE' : 'TRANSFER'));
        var resultBadge = '';
        if (i.kind === 'trade' || i.kind === 'bet' || i.kind === 'race') {
          resultBadge = pnl >= 0
            ? ' <span class="badge win">WIN</span>'
            : ' <span class="badge loss">LOSS</span>';
        }

        var metaParts = [];
        if (i.kind === 'trade') {
          if (i.entry != null) metaParts.push('Entry ' + Number(i.entry).toLocaleString(undefined, { maximumFractionDigits: i.digits || 2 }));
          if (i.exit != null) metaParts.push('Exit ' + Number(i.exit).toLocaleString(undefined, { maximumFractionDigits: i.digits || 2 }));
        } else if (i.detail) {
          metaParts.push(i.detail);
        }
        if (when) metaParts.push(when);

        var statsHtml = '';
        if (i.kind === 'trade' || i.kind === 'bet' || i.kind === 'race') {
          var orig = i.amount != null ? '$' + fmt(i.amount) : '—';
          var returned = i.amount != null ? '$' + fmt(Math.max(0, Number(i.amount) + pnl)) : '—';
          statsHtml =
            '<div class="stats">' +
              '<div><div class="stat-label">Original</div><div class="stat-val">' + orig + '</div></div>' +
              '<div><div class="stat-label">P/L</div><div class="stat-val ' + cls + '">' + sign + '$' + fmt(Math.abs(pnl)) + '</div></div>' +
              '<div><div class="stat-label">Returned</div><div class="stat-val ' + cls + '">' + returned + '</div></div>' +
            '</div>';
        }

        return '<div class="item">' +
          '<div class="item-top">' +
            '<div><span class="badge ' + badge + '">' + label + '</span>' + resultBadge +
            '<div class="item-title" style="margin-top:6px">' + (i.title || '—') + '</div></div>' +
            '<div class="item-amt ' + cls + '">' + sign + '$' + fmt(Math.abs(pnl)) + '</div>' +
          '</div>' +
          (metaParts.length ? '<div class="item-meta">' + metaParts.join(' · ') + '</div>' : '') +
          statsHtml +
        '</div>';
      }).join('');
    }

    init();
  </script>
</body>
</html>
