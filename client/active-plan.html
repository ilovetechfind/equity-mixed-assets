<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Active Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #070b14;
      --card-bg: rgba(18, 24, 38, 0.6);
      --card-border: rgba(255, 255, 255, 0.05);
      --text-muted: #8b9bb4;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at top, rgba(29, 39, 61, 0.4) 0%, transparent 60%);
      background-attachment: fixed; 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 480px; }
    
    .nav-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; margin-top: 10px; }
    .back-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: white; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 6px;}
    .view-title { font-size: 1.4rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }

    .empty-state {
      background: var(--card-bg); 
      border: 1px dashed rgba(255, 255, 255, 0.15); 
      backdrop-filter: blur(12px); 
      border-radius: 20px; 
      padding: 40px 24px; 
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .empty-icon {
      font-size: 3rem;
      background: rgba(255,255,255,0.03);
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .empty-title { font-size: 1.3rem; font-weight: 800; margin: 0; }
    .empty-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin: 0; }

    .action-btn {
      margin-top: 10px;
      padding: 14px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
      transition: 0.2s;
    }
    .action-btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <a href="investment-plan.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <h2 class="view-title">Active Investment</h2>
    </div>

    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <h3 class="empty-title">No Active Plans</h3>
      <p class="empty-desc">You currently do not have any active investments running. Choose a plan to start generating daily returns.</p>
      <a href="investment-plan.html" class="action-btn">Browse Plans</a>
    </div>

  </div>
</body>
</html>
