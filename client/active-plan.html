<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Active Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #070b14;
      --card-bg: rgba(18, 24, 38, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #8b9bb4;
    }
    * { box-sizing: border-box; }
    body { 
      background-color: var(--bg-main); color: white; font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh;
    }
    .container { width: 100%; max-width: 480px; }
    .nav-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; margin-top: 10px; }
    .back-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); color: white; padding: 10px 16px; border-radius: 12px; text-decoration: none; font-weight: 600; }
    .view-title { font-size: 1.4rem; font-weight: 800; margin: 0; }
    .empty-state { background: var(--card-bg); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 40px 24px; text-align: center; }
    .plans-list { display: flex; flex-direction: column; gap: 16px; }
    .plan-card { background: var(--card-bg); border: 1px solid rgba(52, 211, 153, 0.35); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 20px rgba(52, 211, 153, 0.12); }
    .plan-card-header { display: flex; justify-content: space-between; align-items: center; }
    .plan-title-wrapper { display: flex; align-items: center; gap: 12px; }
    .plan-name { font-size: 1.1rem; font-weight: 700; margin: 0; }
    .plan-status { background: rgba(52, 211, 153, 0.15); color: #34d399; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <a href="investment-plan.html" id="back-btn" class="back-btn">Back</a>
      <h2 class="view-title">Active Investment</h2>
    </div>
    <div id="active-plans-container">
      <div class="empty-state"><h3>Loading...</h3></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const plansDictionary = {
      'starter': { name: 'Starter Plan', icon: '🌱' },
      'bronze': { name: 'Bronze Tier', icon: '🥉' },
      'silver': { name: 'Silver Tier', icon: '🥈' },
      'gold': { name: 'Gold Tier', icon: '🥇' },
      'platinum': { name: 'Platinum Tier', icon: '💎' },
      'diamond': { name: 'Diamond Tier', icon: '🔮' },
      'crown': { name: 'Crown Elite', icon: '👑' }
    };

    async function resolveUserId() {
      const urlParams = new URLSearchParams(window.location.search);
      let targetUserId = urlParams.get('id');
      if (!targetUserId) {
        try {
          const { data } = await client.auth.getUser();
          if (data && data.user && data.user.id) targetUserId = data.user.id;
        } catch (e) {}
      }
      return targetUserId || 'default_user';
    }

    async function loadActivePlans(userId) {
      try {
        const { data, error } = await client
          .from('profiles')
          .select('active_plans')
          .eq('id', userId)
          .maybeSingle();

        if (!error && data && data.active_plans != null) {
          if (Array.isArray(data.active_plans)) return data.active_plans;
          if (typeof data.active_plans === 'string') {
            try {
              const parsed = JSON.parse(data.active_plans);
              if (Array.isArray(parsed)) return parsed;
            } catch (e) {}
          }
        }
      } catch (e) {}

      let saved = localStorage.getItem(`user_active_plans_list_${userId}`);
      if (!saved && userId !== 'default_user') {
        saved = localStorage.getItem(`user_active_plans_list_default_user`);
      }
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return [];
    }

    async function init() {
      const targetUserId = await resolveUserId();
      document.getElementById('back-btn').href = `investment-plan.html?id=${targetUserId}`;

      const container = document.getElementById('active-plans-container');
      const activeIds = await loadActivePlans(targetUserId);

      if (!activeIds || activeIds.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3 style="margin-top:0;">No Active Plans</h3>
            <p style="color: var(--text-muted); font-size: 0.95rem;">You currently do not have any active investments running.</p>
            <a href="investment-plan.html?id=${targetUserId}" style="color: #34d399; font-weight: bold; text-decoration: none;">Browse Plans</a>
          </div>
        `;
      } else {
        let html = '<div class="plans-list">';
        activeIds.forEach(id => {
          const plan = plansDictionary[id];
          if (plan) {
            html += `
              <div class="plan-card">
                <div class="plan-card-header">
                  <div class="plan-title-wrapper">
                    <span style="font-size: 1.8rem;">${plan.icon}</span>
                    <h3 class="plan-name">${plan.name}</h3>
                  </div>
                  <span class="plan-status">Active</span>
                </div>
              </div>
            `;
          }
        });
        html += '</div>';
        container.innerHTML = html;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
