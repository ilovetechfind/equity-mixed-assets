<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Silver Tier</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #070b14;
      --card-bg: rgba(18, 24, 38, 0.6);
      --card-border: rgba(255, 255, 255, 0.05);
      --text-muted: #8b9bb4;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at top, rgba(29, 39, 61, 0.4) 0%, transparent 60%);
      background-attachment: fixed; 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 40px;
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 480px; }
    
    .nav-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; margin-top: 10px; }
    .back-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: white; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 6px;}
    .view-title { font-size: 1.4rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }

    .plan-header { text-align: center; margin-bottom: 24px; }
    .plan-icon { font-size: 3.5rem; margin-bottom: 10px; display: inline-block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
    .plan-name { font-size: 1.8rem; font-weight: 800; margin: 0; color: #c0c0c0; }
    
    .details-card {
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      backdrop-filter: blur(12px); 
      border-radius: 20px; 
      padding: 20px 24px; 
      margin-bottom: 24px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .detail-row:last-child { border-bottom: none; padding-bottom: 0; }
    .detail-row:first-child { padding-top: 0; }
    
    .detail-label { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
    .detail-value { font-size: 1.05rem; font-weight: 700; color: white; text-align: right; }
    .highlight { color: #4ade80; font-size: 1.2rem; }
    .primary-highlight { color: var(--accent); }

    .invest-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      transition: 0.2s;
    }
    .invest-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <a href="investment-plan.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <h2 class="view-title">Payment Structure</h2>
    </div>

    <div class="plan-header">
      <div class="plan-icon">🥈</div>
      <h1 class="plan-name">Silver Tier</h1>
    </div>

    <div class="details-card">
      <div class="detail-row">
        <span class="detail-label">Total Investment</span>
        <span class="detail-value primary-highlight">$8,000</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Initial First Payment</span>
        <span class="detail-value">$1,600</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Remaining Balance</span>
        <span class="detail-value">$6,400</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Weekly Payment (4 Wks)</span>
        <span class="detail-value">$1,600 / week</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Daily Payment (28 Days)</span>
        <span class="detail-value">$228.57 / day</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">30-Day Payout Return</span>
        <span class="detail-value highlight">$40,000</span>
      </div>
    </div>

    <button class="invest-btn" onclick="alert('Proceeding to deposit for Silver Tier')">Invest Now</button>
  </div>
</body>
</html>
