<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Spin & Win</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #050811;
      --card-bg: rgba(15, 22, 36, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #8b9bb4;
      --accent: #38bdf8;
      --success: #4ade80;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(74, 222, 128, 0.06) 0%, transparent 40%);
      background-attachment: fixed; 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 50px;
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 480px; text-align: center; }
    
    /* Navigation Bar */
    .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; margin-top: 10px; }
    .back-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); backdrop-filter: blur(12px); color: white; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .back-btn:hover { background: rgba(255,255,255,0.08); }
    .view-title { font-size: 1.2rem; font-weight: 700; margin: 0; color: var(--text-muted); letter-spacing: -0.5px; }

    /* Hero Banner */
    .plan-hero {
      background: linear-gradient(135deg, rgba(25, 35, 55, 0.6) 0%, rgba(15, 22, 36, 0.8) 100%);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .plan-name { font-size: 1.7rem; font-weight: 800; margin: 0 0 4px 0; color: white; }
    .plan-subtitle { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

    /* Wheel Container */
    .wheel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 20px auto;
    }

    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid #38bdf8;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
    }

    /* Action Button */
    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      transition: 0.2s;
      text-decoration: none;
    }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Result Popup Message */
    #result-msg {
      margin-top: 15px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--success);
      min-height: 28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <h2 class="view-title">Lucky Spin</h2>
      <div style="width: 70px;"></div>
    </nav>

    <!-- Hero Banner -->
    <div class="plan-hero">
      <div class="plan-name">Spin & Win Cash</div>
      <div class="plan-subtitle">Test your luck and win instant rewards!</div>
    </div>

    <!-- Wheel Game Card -->
    <div class="wheel-card">
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
      </div>

      <button id="spinBtn" class="action-btn" onclick="startSpin()">
        <span>Spin the Wheel</span>
      </button>

      <div id="result-msg"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultMsg = document.getElementById('result-msg');

    const sectors = [
      { color: '#2563eb', text: '$500' },
      { color: '#10b981', text: '$1,000' },
      { color: '#f59e0b', text: '$100' },
      { color: '#8b5cf6', text: '$5,000' },
      { color: '#ec4899', text: '$250' },
      { color: '#06b6d4', text: '$10,000' }
    ];

    const arc = Math.PI / (sectors.length / 2);
    let startAngle = 0;
    let currentAngle = 0;
    let isSpinning = false;

    function drawSector(sector, i) {
      const angle = startAngle + i * arc;
      ctx.save();
      ctx.beginPath();
      ctx.arc(150, 150, 145, angle, angle + arc, false);
      ctx.lineTo(150, 150);
      ctx.fillStyle = sector.color;
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(150, 150);
      ctx.rotate(angle + arc / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(sector.text, 130, 10);
      ctx.restore();
      ctx.restore();
    }

    function drawWheel() {
      ctx.clearRect(0, 0, 300, 300);
      for (let i = 0; i < sectors.length; i++) {
        drawSector(sectors[i], i);
      }
    }

    function startSpin() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      resultMsg.innerText = '';

      // Random spin between 5 and 8 full rotations plus random sector offset
      const randomSpin = Math.floor(Math.random() * 360) + 1800;
      currentAngle += randomSpin;

      canvas.style.transform = `rotate(${currentAngle}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;

        // Calculate winning prize based on final rotation angle
        const actualDegree = currentAngle % 360;
        const sectorDegree = 360 / sectors.length;
        const winningIndex = Math.floor((360 - (actualDegree % 360)) / sectorDegree) % sectors.length;
        
        const winningPrize = sectors[winningIndex].text;
        resultMsg.innerText = `Congratulations! You won ${winningPrize}!`;
      }, 4000);
    }

    drawWheel();
  </script>
</body>
  </html>
