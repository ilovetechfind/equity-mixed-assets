<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Premium Lucky Spin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #030712;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(212, 175, 55, 0.2);
      --text-muted: #94a3b8;
      --gold-primary: #d4af37;
      --gold-light: #fef08a;
      --gold-gradient: linear-gradient(135deg, #fef08a 0%, #d4af37 50%, #9a7b20 100%);
      --success: #4ade80;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
      background-attachment: fixed; 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 50px;
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 480px; text-align: center; }
    
    /* Navigation Bar */
    .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; margin-top: 10px; }
    .back-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); backdrop-filter: blur(12px); color: var(--gold-light); padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .back-btn:hover { background: rgba(212, 175, 55, 0.1); }
    .view-title { font-size: 1.2rem; font-weight: 700; margin: 0; color: var(--gold-primary); letter-spacing: -0.5px; }
    
    /* Live Balance Display */
    .balance-display {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      color: var(--gold-light);
      font-size: 0.9rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Hero Banner */
    .plan-hero {
      background: linear-gradient(135deg, rgba(30, 27, 12, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .plan-name { font-size: 1.7rem; font-weight: 800; margin: 0 0 4px 0; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .plan-subtitle { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

    /* Wheel Container */
    .wheel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      position: relative;
    }

    .spins-left-badge {
      font-size: 0.85rem;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 16px;
      font-weight: 600;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
    }

    .wheel-container {
      position: relative;
      width: 290px;
      height: 290px;
      margin: 0 auto 20px auto;
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #fef08a;
      z-index: 10;
      filter: drop-shadow(0 4px 8px rgba(212, 175, 55, 0.5));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
      border: 4px solid rgba(212, 175, 55, 0.4);
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
    }

    /* Action Button */
    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--gold-gradient);
      color: #1a1500;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      transition: 0.2s;
      text-decoration: none;
    }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .action-btn.buy-mode { background: linear-gradient(135deg, #38bdf8 0%, #0369a1 100%); color: white; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); }

    /* Result Popup Message */
    #result-msg {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: 700;
      min-height: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <a href="investment-plan.html" id="client-back-btn" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <h2 class="view-title">VIP Lucky Spin</h2>
      <div class="balance-display" id="top-balance-display">$0.00</div>
    </nav>

    <!-- Hero Banner -->
    <div class="plan-hero">
      <div class="plan-name">Elite Rewards Wheel</div>
      <div class="plan-subtitle">Spin to claim your exclusive asset bonuses!</div>
    </div>

    <!-- Wheel Game Card -->
    <div class="wheel-card">
      <div id="spinsCounter" class="spins-left-badge">Spins Remaining: 3</div>

      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="320" height="320"></canvas>
      </div>

      <button id="spinBtn" class="action-btn" onclick="startSpin()">
        <span>Spin the Wheel</span>
      </button>

      <div id="result-msg"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id') || '';

    // Bind Back Button URL parameter dynamically
    document.getElementById('client-back-btn').setAttribute('href', targetUserId ? `investment-plan.html?id=${targetUserId}` : 'investment-plan.html');

    const configKey = `spin_config_${targetUserId}`;
    const userStateKey = `spin_state_${targetUserId}_${new Date().toDateString()}`;
    const balanceKey = `user_balance_${targetUserId}`;

    // Default configuration values
    let config = { dailySpins: 3, costForMore: 150, extraSpinsCount: 3 };
    const savedConfig = localStorage.getItem(configKey);
    if(savedConfig) {
      try { config = JSON.parse(savedConfig); } catch(e){}
    }

    // Load or initialize daily state
    let state = JSON.parse(localStorage.getItem(userStateKey)) || { spinsLeft: config.dailySpins };
    if(state.spinsLeft > config.dailySpins && !state.hasPaid) {
      state.spinsLeft = config.dailySpins;
    }

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultMsg = document.getElementById('result-msg');
    const spinsCounter = document.getElementById('spinsCounter');
    const balanceDisplay = document.getElementById('top-balance-display');

    // Luxurious rich color palette with 12 expansive options (all strictly under $1,000)
    const sectors = [
      { color: '#1e293b', text: '$50', value: 50 },
      { color: '#0f172a', text: '$150', value: 150 },
      { color: '#172554', text: '$250', value: 250 },
      { color: '#1e3a8a', text: '$350', value: 350 },
      { color: '#1e1b4b', text: '$450', value: 450 },
      { color: '#312e81', text: '$550', value: 550 },
      { color: '#581c87', text: '$650', value: 650 },
      { color: '#701a75', text: '$750', value: 750 },
      { color: '#831843', text: '$850', value: 850 },
      { color: '#9f1239', text: '$950', value: 950 },
      { color: '#713f12', text: '$300', value: 300 },
      { color: '#365314', text: '$600', value: 600 }
    ];

    const arc = Math.PI / (sectors.length / 2);
    let startAngle = 0;
    let currentAngle = 0;
    let isSpinning = false;

    // Load and format the user's current balance
    function updateBalanceDisplay() {
      let currentBalance = parseFloat(localStorage.getItem(balanceKey)) || 137142.60;
      balanceDisplay.innerText = `$${currentBalance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function updateUI() {
      if (state.spinsLeft > 0) {
        spinsCounter.innerText = `Spins Remaining: ${state.spinsLeft}`;
        spinBtn.innerHTML = `<span>Spin the Wheel</span>`;
        spinBtn.className = "action-btn";
      } else {
        spinsCounter.innerText = `Spins Remaining: 0`;
        spinBtn.innerHTML = `<span>Buy ${config.extraSpinsCount} more spins for $${config.costForMore}</span>`;
        spinBtn.className = "action-btn buy-mode";
      }
    }

    function drawSector(sector, i) {
      const angle = startAngle + i * arc;
      ctx.save();
      ctx.beginPath();
      ctx.arc(160, 160, 152, angle, angle + arc, false);
      ctx.lineTo(160, 160);
      ctx.fillStyle = sector.color;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.3)';
      ctx.stroke();

      ctx.save();
      ctx.translate(160, 160);
      ctx.rotate(angle + arc / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(sector.text, 138, 5);
      ctx.restore();
      ctx.restore();
    }

    function drawWheel() {
      ctx.clearRect(0, 0, 320, 320);
      for (let i = 0; i < sectors.length; i++) {
        drawSector(sectors[i], i);
      }
    }

    function startSpin() {
      if (isSpinning) return;

      let currentBalance = parseFloat(localStorage.getItem(balanceKey)) || 137142.60;

      // If spins run out, process payment from balance directly
      if (state.spinsLeft <= 0) {
        if (currentBalance >= config.costForMore) {
          // Deduct cost and save new balance
          currentBalance -= config.costForMore;
          localStorage.setItem(balanceKey, currentBalance.toFixed(2));
          updateBalanceDisplay();

          // Add extra spins and save state
          state.spinsLeft += config.extraSpinsCount;
          localStorage.setItem(userStateKey, JSON.stringify(state));
          
          resultMsg.style.color = "var(--gold-light)";
          resultMsg.innerText = `Successfully purchased ${config.extraSpinsCount} more spins for $${config.costForMore}!`;
          updateUI();
        } else {
          // Insufficient funds handling
          resultMsg.style.color = "var(--danger)";
          resultMsg.innerText = "Insufficient balance. Redirecting to deposit...";
          setTimeout(() => {
            const paymentUrl = targetUserId 
              ? `deposit.html?id=${targetUserId}&amount=${config.costForMore}&type=spins` 
              : `deposit.html?amount=${config.costForMore}&type=spins`;
            window.location.href = paymentUrl;
          }, 2000);
        }
        return; // Prevent spin from firing immediately during a purchase click
      }

      isSpinning = true;
      spinBtn.disabled = true;
      resultMsg.innerText = '';

      // Deduct spin count and persist state
      state.spinsLeft--;
      localStorage.setItem(userStateKey, JSON.stringify(state));
      updateUI();

      // Random spin rotation calculation
      const randomSpin = Math.floor(Math.random() * 360) + 2160;
      currentAngle += randomSpin;

      canvas.style.transform = `rotate(${currentAngle}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;

        // Calculate winning sector accurately matching pointer location
        const actualDegree = currentAngle % 360;
        const sectorDegree = 360 / sectors.length;
        const winningIndex = Math.floor((360 - (actualDegree % 360)) / sectorDegree) % sectors.length;
        
        const winningSector = sectors[winningIndex];
        
        // Displays exact winning text string on screen
        resultMsg.style.color = "var(--success)";
        resultMsg.innerText = `Congratulations! You won ${winningSector.text}!`;

        // Add exact winning prize value directly to client balance storage
        currentBalance = parseFloat(localStorage.getItem(balanceKey)) || 137142.60;
        currentBalance += winningSector.value;
        localStorage.setItem(balanceKey, currentBalance.toFixed(2));

        updateBalanceDisplay();
        updateUI();
      }, 4000);
    }

    // Initialize View
    updateBalanceDisplay();
    drawWheel();
    updateUI();
  </script>
</body>
</html>
