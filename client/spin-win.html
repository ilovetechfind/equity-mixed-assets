<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Premium Lucky Spin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0a12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(212, 175, 55, 0.25);
      --text-muted: #94a3b8;
      --gold-primary: #d4af37;
      --gold-light: #fef08a;
      --gold-gradient: linear-gradient(135deg, #fef08a 0%, #d4af37 40%, #b8860b 80%, #9a7b20 100%);
      --gold-glow: 0 0 60px rgba(212, 175, 55, 0.3);
      --success: #4ade80;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      background: var(--bg-main);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.04) 0%, transparent 50%);
      background-attachment: fixed; 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 60px;
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 480px; text-align: center; }
    
    /* ---- Navigation ---- */
    .nav-bar { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 16px; 
      margin-top: 8px; 
      gap: 8px; 
    }
    .nav-btn { 
      background: rgba(255,255,255,0.04); 
      border: 1px solid rgba(212, 175, 55, 0.15); 
      backdrop-filter: blur(12px); 
      color: var(--gold-light); 
      padding: 10px 14px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 0.85rem; 
      text-decoration: none; 
      font-weight: 600; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      transition: 0.3s; 
      line-height: 1;
    }
    .nav-btn:hover { background: rgba(212, 175, 55, 0.12); transform: scale(1.02); }
    .nav-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; }
    
    .view-title { 
      font-size: 1.1rem; 
      font-weight: 800; 
      margin: 0; 
      background: var(--gold-gradient); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      letter-spacing: -0.3px; 
    }
    
    /* ---- Balance Card ---- */
    .balance-card {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.12) 0%, rgba(15, 23, 42, 0.6) 100%);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .balance-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .balance-amount {
      font-size: 2.4rem;
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 4px 0 12px 0;
      text-shadow: 0 0 40px rgba(212,175,55,0.2);
    }
    .balance-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .balance-actions .btn {
      padding: 10px 24px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-withdraw {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }
    .btn-withdraw:hover { transform: scale(1.04); box-shadow: 0 6px 30px rgba(16, 185, 129, 0.4); }
    .btn-deposit {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    }
    .btn-deposit:hover { transform: scale(1.04); box-shadow: 0 6px 30px rgba(59, 130, 246, 0.4); }
    .btn-home {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted);
    }
    .btn-home:hover { background: rgba(255,255,255,0.1); }

    /* ---- Hero Banner ---- */
    .plan-hero {
      background: linear-gradient(135deg, rgba(30, 27, 12, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--gold-glow), 0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .plan-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(212,175,55,0.05) 0%, transparent 60%);
      animation: shimmer 8s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(10%, 10%) scale(1.2); }
    }
    .plan-name { 
      font-size: 1.8rem; 
      font-weight: 900; 
      margin: 0 0 4px 0; 
      background: var(--gold-gradient); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      position: relative;
      letter-spacing: 0.5px;
    }
    .plan-subtitle { 
      font-size: 0.9rem; 
      color: var(--text-muted); 
      font-weight: 500; 
      position: relative;
    }

    /* ---- Wheel Card ---- */
    .wheel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    /* ---- Timer & Spins ---- */
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .stat-item {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 10px 18px;
      min-width: 100px;
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .stat-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gold-light);
      margin-top: 2px;
    }
    .stat-value.spins {
      color: #4ade80;
    }
    .stat-value.timer {
      color: #fbbf24;
    }

    .wheel-container {
      position: relative;
      width: 290px;
      height: 290px;
      margin: 0 auto 20px auto;
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #fef08a;
      z-index: 10;
      filter: drop-shadow(0 4px 16px rgba(212, 175, 55, 0.8));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.2), inset 0 0 40px rgba(212, 175, 55, 0.05);
      border: 4px solid rgba(212, 175, 55, 0.4);
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
    }

    /* ---- Action Button ---- */
    .action-btn {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--gold-gradient);
      color: #1a1500;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
      transition: 0.3s;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }
    .action-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
      opacity: 0;
      transition: 0.5s;
    }
    .action-btn:hover:not(:disabled)::before { opacity: 1; }
    .action-btn:active { transform: scale(0.97); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .action-btn.buy-mode { 
      background: linear-gradient(135deg, #38bdf8 0%, #0369a1 100%); 
      color: white; 
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4); 
    }

    /* ---- Result ---- */
    #result-msg {
      margin-top: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      min-height: 32px;
      padding: 8px;
      border-radius: 12px;
    }
    .win-animation {
      animation: winPulse 0.8s ease-in-out 3;
    }
    @keyframes winPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); color: #4ade80; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Navigation -->
    <nav class="nav-bar">
      <a href="dashboard.html" id="home-btn" class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
        <span>Home</span>
      </a>
      <h2 class="view-title">VIP Lucky Spin</h2>
      <div style="width:70px;"></div>
    </nav>

    <!-- Balance Card with Withdraw/Deposit buttons -->
    <div class="balance-card">
      <div class="balance-label">Available Balance</div>
      <div class="balance-amount" id="top-balance-display">$0.00</div>
      <div class="balance-actions">
        <a href="withdraw.html" id="withdraw-btn" class="btn btn-withdraw">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 7l-5-5-5 5M7 17l5 5 5-5"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
          </svg>
          Withdraw
        </a>
        <a href="deposit.html" id="deposit-btn" class="btn btn-deposit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 7l-5-5-5 5M7 17l5 5 5-5"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
          </svg>
          Deposit
        </a>
      </div>
    </div>

    <!-- Hero Banner -->
    <div class="plan-hero">
      <div class="plan-name">✦ Elite Rewards Wheel ✦</div>
      <div class="plan-subtitle">Spin to claim exclusive bonuses up to $300!</div>
    </div>

    <!-- Wheel Card -->
    <div class="wheel-card">
      <!-- Stats Row: Spins + Timer -->
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-label">Spins Remaining</div>
          <div class="stat-value spins" id="spinsDisplay">5</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Next Free Spins</div>
          <div class="stat-value timer" id="timerDisplay">⏳ 8h 45m</div>
        </div>
      </div>

      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="320" height="320"></canvas>
      </div>

      <button id="spinBtn" class="action-btn" onclick="startSpin()">
        <span>🔄 Spin the Wheel</span>
      </button>

      <div id="result-msg"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id') || '';

    const FREE_SPINS = 5;
    const RESET_INTERVAL_MS = (8 * 60 + 45) * 60 * 1000; // 8h 45m
    const COST_FOR_MORE = 150;
    const EXTRA_SPINS = 12;

    // ============================================================
    // DOM REFS
    // ============================================================
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultMsg = document.getElementById('result-msg');
    const spinsDisplay = document.getElementById('spinsDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const balanceDisplay = document.getElementById('top-balance-display');

    // ============================================================
    // KEYS
    // ============================================================
    const balanceKey = `user_balance_${targetUserId}`;
    const stateKey = `spin_state_${targetUserId}`;
    const lastResetKey = `spin_last_reset_${targetUserId}`;

    // ============================================================
    // SECTORS (all prizes ≤ $300)
    // ============================================================
    const sectors = [
      { color: '#1e293b', text: '$10', value: 10 },
      { color: '#0f172a', text: '$25', value: 25 },
      { color: '#172554', text: '$50', value: 50 },
      { color: '#1e3a8a', text: '$75', value: 75 },
      { color: '#1e1b4b', text: '$100', value: 100 },
      { color: '#312e81', text: '$125', value: 125 },
      { color: '#581c87', text: '$150', value: 150 },
      { color: '#701a75', text: '$175', value: 175 },
      { color: '#831843', text: '$200', value: 200 },
      { color: '#9f1239', text: '$225', value: 225 },
      { color: '#713f12', text: '$250', value: 250 },
      { color: '#365314', text: '$300', value: 300 }
    ];

    const arc = Math.PI / (sectors.length / 2);
    let startAngle = 0;
    let currentAngle = 0;
    let isSpinning = false;

    // ============================================================
    // BALANCE (new users start at 0)
    // ============================================================
    function getBalance() {
      let bal = localStorage.getItem(balanceKey);
      if (bal === null) {
        bal = '0.00';
        localStorage.setItem(balanceKey, bal);
      }
      return parseFloat(bal) || 0;
    }

    function setBalance(val) {
      localStorage.setItem(balanceKey, val.toFixed(2));
    }

    function updateBalanceDisplay() {
      const bal = getBalance();
      balanceDisplay.innerText = `$${bal.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
    }

    // ============================================================
    // SPIN STATE with 8h 45m reset
    // ============================================================
    function getState() {
      let state = JSON.parse(localStorage.getItem(stateKey));
      if (!state) {
        state = { spinsLeft: FREE_SPINS };
        localStorage.setItem(stateKey, JSON.stringify(state));
      }
      
      let lastReset = localStorage.getItem(lastResetKey);
      if (!lastReset) {
        lastReset = Date.now();
        localStorage.setItem(lastResetKey, String(lastReset));
      } else {
        lastReset = parseInt(lastReset, 10);
      }
      
      const now = Date.now();
      if (now - lastReset >= RESET_INTERVAL_MS) {
        state.spinsLeft = FREE_SPINS;
        localStorage.setItem(stateKey, JSON.stringify(state));
        localStorage.setItem(lastResetKey, String(now));
      }
      return state;
    }

    function saveState(state) {
      localStorage.setItem(stateKey, JSON.stringify(state));
    }

    // ============================================================
    // UPDATE UI
    // ============================================================
    function updateUI() {
      const state = getState();
      const remaining = state.spinsLeft;
      
      // Update spins display
      spinsDisplay.textContent = remaining;
      
      // Update button
      if (remaining > 0) {
        spinBtn.innerHTML = `<span>🔄 Spin the Wheel</span>`;
        spinBtn.className = "action-btn";
        spinBtn.disabled = false;
      } else {
        spinBtn.innerHTML = `<span>💰 Buy ${EXTRA_SPINS} spins for $${COST_FOR_MORE}</span>`;
        spinBtn.className = "action-btn buy-mode";
        spinBtn.disabled = false;
      }
      
      // Update timer countdown
      const lastReset = localStorage.getItem(lastResetKey);
      if (lastReset) {
        const elapsed = Date.now() - parseInt(lastReset, 10);
        const remainingMs = Math.max(0, RESET_INTERVAL_MS - elapsed);
        if (remainingMs > 0) {
          const totalMinutes = Math.floor(remainingMs / (60 * 1000));
          const hours = Math.floor(totalMinutes / 60);
          const minutes = totalMinutes % 60;
          timerDisplay.textContent = `⏳ ${hours}h ${minutes}m`;
        } else {
          timerDisplay.textContent = '⏳ Ready! Spin Now!';
        }
      }
      
      updateBalanceDisplay();
    }

    // ============================================================
    // DRAW WHEEL
    // ============================================================
    function drawSector(sector, i) {
      const angle = startAngle + i * arc;
      ctx.save();
      ctx.beginPath();
      ctx.arc(160, 160, 152, angle, angle + arc, false);
      ctx.lineTo(160, 160);
      ctx.fillStyle = sector.color;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.2)';
      ctx.stroke();

      ctx.save();
      ctx.translate(160, 160);
      ctx.rotate(angle + arc / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 6;
      ctx.fillText(sector.text, 138, 5);
      ctx.restore();
      ctx.restore();
    }

    function drawWheel() {
      ctx.clearRect(0, 0, 320, 320);
      for (let i = 0; i < sectors.length; i++) {
        drawSector(sectors[i], i);
      }
    }

    // ============================================================
    // SPIN ACTION
    // ============================================================
    function startSpin() {
      if (isSpinning) return;

      const state = getState();

      // If no spins left, redirect to deposit
      if (state.spinsLeft <= 0) {
        const depositUrl = targetUserId 
          ? `deposit.html?id=${targetUserId}&amount=${COST_FOR_MORE}&type=spins` 
          : `deposit.html?amount=${COST_FOR_MORE}&type=spins`;
        window.location.href = depositUrl;
        return;
      }

      // Deduct a spin
      state.spinsLeft--;
      saveState(state);

      isSpinning = true;
      spinBtn.disabled = true;
      resultMsg.innerText = '';
      resultMsg.className = '';

      // Random spin
      const randomSpin = Math.floor(Math.random() * 360) + 2160;
      currentAngle += randomSpin;
      canvas.style.transform = `rotate(${currentAngle}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;

        // Determine winning sector
        const actualDegree = currentAngle % 360;
        const sectorDegree = 360 / sectors.length;
        const winningIndex = Math.floor((360 - (actualDegree % 360)) / sectorDegree) % sectors.length;
        const winningSector = sectors[winningIndex];

        // Display win message
        resultMsg.className = 'win-animation';
        resultMsg.style.color = "#4ade80";
        resultMsg.innerText = `🎉 Congratulations! You won ${winningSector.text}!`;

        // Add exact amount to balance
        const currentBalance = getBalance();
        const newBalance = currentBalance + winningSector.value;
        setBalance(newBalance);

        updateUI();
        updateBalanceDisp
