<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Equity Mixed Assets - Spin & Win</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(18, 24, 38, 0.92);
      --border: rgba(255,255,255,0.08);
      --muted: #8b9bb4;
      --gold: #fbbf24;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 14px; padding-bottom: 40px;
      background: radial-gradient(circle at top, #1a1428 0%, var(--bg) 55%);
      color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh;
    }
    .wrap { max-width: 420px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .back {
      background: var(--card); border: 1px solid var(--border); color: #fff;
      padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.85rem;
    }
    .title { font-size: 1.15rem; font-weight: 800; margin: 0; }

    .hero {
      text-align: center; margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(0,0,0,0.2));
      border: 1px solid rgba(251,191,36,0.25); border-radius: 16px; padding: 14px;
    }
    .hero h2 {
      margin: 0 0 4px; font-size: 1.15rem; font-weight: 800;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { margin: 0; font-size: 0.8rem; color: var(--muted); }

    .bal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .bal-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
    }
    .bal-box .lbl { font-size: 0.65rem; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .bal-box .val { font-size: 1.2rem; font-weight: 800; margin-top: 4px; }
    .bal-box.spin .val { color: var(--gold); }
    .bal-box.main .val { color: #93c5fd; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px;
    }
    label {
      display: block; font-size: 0.72rem; color: var(--muted); font-weight: 700;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    input[type=number] {
      width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--border); color: #fff;
      padding: 12px 14px; border-radius: 12px; font-size: 1rem; outline: none; margin-bottom: 10px;
    }
    input:focus { border-color: var(--gold); }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .q {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #cbd5e1;
      padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }

    .fund-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .fund-btn {
      border: none; border-radius: 12px; padding: 11px; font-weight: 700; font-size: 0.82rem; cursor: pointer;
    }
    .fund-in { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
    .fund-out { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #34d399; }

    .wheel-wrap { position: relative; width: 300px; height: 300px; margin: 8px auto 16px; }
    .pointer {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent; border-right: 12px solid transparent;
      border-top: 22px solid var(--gold);
      z-index: 5; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    canvas { width: 300px; height: 300px; border-radius: 50%; display: block;
      box-shadow: 0 0 0 6px rgba(251,191,36,0.25), 0 10px 40px rgba(0,0,0,0.5);
    }

    .spin-btn {
      width: 100%; border: none; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 1.05rem;
      cursor: pointer; color: #0f172a;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 6px 20px rgba(251,191,36,0.35);
    }
    .spin-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    .result-line {
      text-align: center; min-height: 1.4em; margin-top: 12px; font-weight: 700; font-size: 0.95rem;
    }
    .result-line.win { color: var(--green); }
    .result-line.lose { color: var(--red); }

    .note { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.4; }

    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: #0f172a; border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 100%; max-width: 360px;
    }
    .modal h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .modal p { color: var(--muted); font-size: 0.85rem; margin: 0 0 14px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .modal-cancel {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
      padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .modal-ok {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; color: #fff;
      padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid var(--green); color: #34d399;
      padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 0.85rem;
      display: none; z-index: 100; max-width: 90%; text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="dashboard.html" class="back">← Back</a>
      <h1 class="title">Spin & Win</h1>
    </div>

    <div class="hero">
      <h2>Multiplier Wheel</h2>
      <p>Wager any amount · Hit a multiplier · Cash out to main balance</p>
    </div>

    <div class="bal-grid">
      <div class="bal-box main">
        <div class="lbl">Main Balance</div>
        <div class="val" id="main-bal">$0.00</div>
      </div>
      <div class="bal-box spin">
        <div class="lbl">Spin Balance</div>
        <div class="val" id="spin-bal">$0.00</div>
      </div>
    </div>

    <div class="card">
      <label>Move funds</label>
      <div class="fund-row">
        <button type="button" class="fund-btn fund-in" id="btn-deposit">↓ From Main</button>
        <button type="button" class="fund-btn fund-out" id="btn-withdraw">↑ To Main</button>
      </div>
      <p class="note" style="margin:8px 0 0">Deposit to spin · Withdraw any amount of winnings</p>
    </div>

    <div class="card">
      <label>Wager amount (from spin balance)</label>
      <input type="number" id="wager" placeholder="10.00" min="1" step="0.01" value="10">
      <div class="quick">
        <button type="button" class="q" data-amt="5">$5</button>
        <button type="button" class="q" data-amt="10">$10</button>
        <button type="button" class="q" data-amt="25">$25</button>
        <button type="button" class="q" data-amt="50">$50</button>
        <button type="button" class="q" data-amt="100">$100</button>
        <button type="button" class="q" data-amt="all">Max</button>
      </div>

      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
      </div>

      <button type="button" class="spin-btn" id="spin-btn">Spin the Wheel</button>
      <div class="result-line" id="result"></div>
      <p class="note">Wheel shows multipliers. Win = wager × multiplier. Many zeros — play smart.</p>
    </div>
  </div>

  <div class="modal-bg" id="fund-modal">
    <div class="modal">
      <h3 id="modal-title">Transfer</h3>
      <p id="modal-desc">Move funds</p>
      <label>Amount (USD)</label>
      <input type="number" id="fund-amount" placeholder="0.00" min="1" step="0.01">
      <div class="quick" id="modal-quick"></div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" id="modal-cancel">Cancel</button>
        <button type="button" class="modal-ok" id="modal-ok">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    // Multipliers — weighted with many zeros so house has edge, but wins exist
    // 16 segments for a clean wheel
    var SEGMENTS = [
      { m: 0,    color: '#1e293b', label: '0×' },
      { m: 0,    color: '#334155', label: '0×' },
      { m: 1.02, color: '#0f766e', label: '1.02×' },
      { m: 0,    color: '#1e293b', label: '0×' },
      { m: 1.2,  color: '#1d4ed8', label: '1.2×' },
      { m: 0,    color: '#334155', label: '0×' },
      { m: 1.5,  color: '#7c3aed', label: '1.5×' },
      { m: 0,    color: '#1e293b', label: '0×' },
      { m: 2,    color: '#b45309', label: '2×' },
      { m: 0,    color: '#334155', label: '0×' },
      { m: 1,    color: '#0369a1', label: '1×' },
      { m: 0,    color: '#1e293b', label: '0×' },
      { m: 3,    color: '#be123c', label: '3×' },
      { m: 0,    color: '#334155', label: '0×' },
      { m: 5,    color: '#a16207', label: '5×' },
      { m: 10,   color: '#fbbf24', label: '10×' }
    ];
    // 8 zeros out of 16 = 50% lose; rest return 1x–10x

    var userId = null;
    var mainBalance = 0;
    var spinBalance = 0;
    var spinning = false;
    var rotation = 0;
    var fundMode = 'deposit';

    var canvas = document.getElementById('wheel');
    var ctx = canvas.getContext('2d');
    var segAngle = (Math.PI * 2) / SEGMENTS.length;

    function fmt(n) {
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function spinKey() {
      return 'spin_balance_' + userId;
    }

    function renderBalances() {
      document.getElementById('main-bal').textContent = '$' + fmt(mainBalance);
      document.getElementById('spin-bal').textContent = '$' + fmt(spinBalance);
    }

    function drawWheel(rot) {
      var cx = canvas.width / 2;
      var cy = canvas.height / 2;
      var r = canvas.width / 2 - 4;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < SEGMENTS.length; i++) {
        var start = rot + i * segAngle - Math.PI / 2;
        var end = start + segAngle;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();
        ctx.fillStyle = SEGMENTS[i].color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // label
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + segAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = SEGMENTS[i].m >= 5 ? '#0f172a' : '#fff';
        ctx.font = 'bold 13px Plus Jakarta Sans, sans-serif';
        ctx.fillText(SEGMENTS[i].label, r - 14, 4);
        ctx.restore();
      }

      // center hub
      ctx.beginPath();
      ctx.arc(cx, cy, 28, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 11px Plus Jakarta Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SPIN', cx, cy + 4);
    }

    async function init() {
      var user = null;
      try {
        var s = await client.auth.getSession();
        user = s.data && s.data.session && s.data.session.user;
        if (!user) {
          var g = await client.auth.getUser();
          user = g.data && g.data.user;
        }
      } catch (e) {}
      if (!user) { window.location.href = 'index.html'; return; }
      userId = user.id;

      var { data: profile } = await client.from('profiles')
        .select('balance, spin_balance')
        .eq('id', userId).maybeSingle();

      mainBalance = Number(profile && profile.balance || 0);
      spinBalance = Number(profile && profile.spin_balance || 0);
      if (!profile || profile.spin_balance == null) {
        var ls = localStorage.getItem(spinKey());
        if (ls) spinBalance = Number(ls) || 0;
      }

      renderBalances();
      drawWheel(0);

      document.querySelectorAll('.q').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var a = btn.getAttribute('data-amt');
          if (a === 'all') {
            document.getElementById('wager').value = Math.max(0, Math.floor(spinBalance * 100) / 100);
          } else {
            document.getElementById('wager').value = a;
          }
        });
      });

      document.getElementById('spin-btn').addEventListener('click', startSpin);
      document.getElementById('btn-deposit').addEventListener('click', function () { openFund('deposit'); });
      document.getElementById('btn-withdraw').addEventListener('click', function () { openFund('withdraw'); });
      document.getElementById('modal-cancel').addEventListener('click', closeFund);
      document.getElementById('modal-ok').addEventListener('click', confirmFund);
    }

    function openFund(mode) {
      fundMode = mode;
      document.getElementById('modal-title').textContent =
        mode === 'deposit' ? 'Deposit to Spin' : 'Withdraw to Main';
      document.getElementById('modal-desc').textContent =
        mode === 'deposit'
          ? 'Move any amount from main balance into spin balance.'
          : 'Withdraw any amount from spin balance back to main.';
      document.getElementById('fund-amount').value = '';
      var q = document.getElementById('modal-quick');
      var max = mode === 'deposit' ? mainBalance : spinBalance;
      q.innerHTML = '';
      [10, 25, 50, 100].forEach(function (n) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'q';
        b.textContent = '$' + n;
        b.onclick = function () { document.getElementById('fund-amount').value = n; };
        q.appendChild(b);
      });
      var maxBtn = document.createElement('button');
      maxBtn.type = 'button';
      maxBtn.className = 'q';
      maxBtn.textContent = 'Max';
      maxBtn.onclick = function () {
        document.getElementById('fund-amount').value = Math.max(0, Math.floor(max * 100) / 100);
      };
      q.appendChild(maxBtn);
      document.getElementById('fund-modal').classList.add('show');
    }

    function closeFund() {
      document.getElementById('fund-modal').classList.remove('show');
    }

    async function confirmFund() {
      var amt = parseFloat(document.getElementById('fund-amount').value);
      if (!amt || amt <= 0) return toast('Enter a valid amount', true);

      if (fundMode === 'deposit') {
        if (amt > mainBalance) return toast('Not enough main balance', true);
        mainBalance -= amt;
        spinBalance += amt;
      } else {
        if (amt > spinBalance) return toast('Not enough spin balance', true);
        spinBalance -= amt;
        mainBalance += amt;
      }

      mainBalance = Math.round(mainBalance * 100) / 100;
      spinBalance = Math.round(spinBalance * 100) / 100;

      var payload = { balance: mainBalance, spin_balance: spinBalance };
      var { error } = await client.from('profiles').update(payload).eq('id', userId);
      if (error) {
        // column may be missing — still save local + main balance
        localStorage.setItem(spinKey(), String(spinBalance));
        await client.from('profiles').update({ balance: mainBalance }).eq('id', userId);
      }
      localStorage.setItem(spinKey(), String(spinBalance));

      closeFund();
      renderBalances();
      toast(fundMode === 'deposit'
        ? 'Deposited $' + fmt(amt) + ' to spin'
        : 'Withdrew $' + fmt(amt) + ' to main');
    }

    async function saveSpinBalance() {
      localStorage.setItem(spinKey(), String(spinBalance));
      try {
        await client.from('profiles').update({ spin_balance: spinBalance }).eq('id', userId);
      } catch (e) {}
    }

    function startSpin() {
      if (spinning) return;
      var wager = parseFloat(document.getElementById('wager').value);
      if (!wager || wager <= 0) return toast('Enter a wager amount', true);
      if (wager > spinBalance) return toast('Not enough spin balance — deposit first', true);
      if (wager < 1) return toast('Minimum wager is $1', true);

      spinning = true;
      document.getElementById('spin-btn').disabled = true;
      document.getElementById('result').textContent = '';
      document.getElementById('result').className = 'result-line';

      // Deduct wager immediately
      spinBalance = Math.round((spinBalance - wager) * 100) / 100;
      renderBalances();

      // Fair random segment (equal chance per segment as drawn)
      var winIndex = Math.floor(Math.random() * SEGMENTS.length);
      var mult = SEGMENTS[winIndex].m;

      // Pointer is at top (-90deg). Segment i is centered at i*seg + seg/2 from start.
      // We want winIndex center under pointer after rotation.
      var targetCenter = winIndex * segAngle + segAngle / 2;
      var extraTurns = 5 + Math.floor(Math.random() * 3);
      var finalRot = extraTurns * Math.PI * 2 + (Math.PI * 2 - targetCenter);

      var startRot = rotation;
      var diff = finalRot - (startRot % (Math.PI * 2));
      if (diff < 0) diff += Math.PI * 2;
      // add full turns
      diff += extraTurns * Math.PI * 2;

      var duration = 4200;
      var t0 = performance.now();

      function easeOut(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function frame(now) {
        var t = Math.min(1, (now - t0) / duration);
        rotation = startRot + diff * easeOut(t);
        drawWheel(rotation);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          finishSpin(wager, mult);
        }
      }
      requestAnimationFrame(frame);
    }

    async function finishSpin(wager, mult) {
      var payout = Math.round(wager * mult * 100) / 100;
      var resultEl = document.getElementById('result');

      if (mult <= 0 || payout <= 0) {
        resultEl.className = 'result-line lose';
        resultEl.textContent = '0× — Lost $' + fmt(wager);
        toast('Lost $' + fmt(wager), true);
      } else {
        spinBalance = Math.round((spinBalance + payout) * 100) / 100;
        var profit = Math.round((payout - wager) * 100) / 100;
        resultEl.className = 'result-line win';
        if (mult === 1) {
          resultEl.textContent = '1× — Stake returned $' + fmt(payout);
        } else {
          resultEl.textContent = mult + '× — Won $' + fmt(payout) +
            (profit > 0 ? ' (+$' + fmt(profit) + ')' : '');
        }
        toast('Won $' + fmt(payout) + ' (' + mult + '×)');
      }

      renderBalances();
      await saveSpinBalance();
      spinning = false;
      document.getElementById('spin-btn').disabled = false;
    }

    function toast(msg, isErr) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = isErr ? '#ef4444' : '#10b981';
      t.style.color = isErr ? '#fca5a5' : '#34d399';
      t.style.display = 'block';
      setTimeout(function () { t.style.display = 'none'; }, 2800);
    }

    init();
  </script>
</body>
</html>
