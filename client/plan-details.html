<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Plan Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #070b14;
      --card-bg: rgba(18, 24, 38, 0.6);
      --card-border: rgba(255, 255, 255, 0.05);
      --text-muted: #8b9bb4;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at top, rgba(29, 39, 61, 0.4) 0%, transparent 60%);
      background-attachment: fixed; 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 480px; }
    
    .nav-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; margin-top: 10px; }
    .back-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: white; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 6px;}
    .view-title { font-size: 1.4rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }

    .plan-header { text-align: center; margin-bottom: 30px; }
    .plan-icon { font-size: 4rem; margin-bottom: 15px; display: inline-block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
    .plan-name { font-size: 2rem; font-weight: 800; margin: 0 0 10px 0; }
    
    .details-card {
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      backdrop-filter: blur(12px); 
      border-radius: 20px; 
      padding: 24px; 
      margin-bottom: 24px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .detail-row:last-child { border-bottom: none; padding-bottom: 0; }
    .detail-row:first-child { padding-top: 0; }
    
    .detail-label { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
    .detail-value { font-size: 1.1rem; font-weight: 700; color: white; }
    .highlight { color: var(--accent); font-size: 1.3rem; }

    .invest-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      transition: 0.2s;
    }
    .invest-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <a href="investment-plan.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <h2 class="view-title">Plan Overview</h2>
    </div>

    <div class="plan-header">
      <div class="plan-icon" id="planIcon">💎</div>
      <h1 class="plan-name" id="planName">Loading...</h1>
    </div>

    <div class="details-card">
      <div class="detail-row">
        <span class="detail-label">Minimum Deposit</span>
        <span class="detail-value" id="minDep">$0</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Maximum Deposit</span>
        <span class="detail-value" id="maxDep">$0</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Daily ROI</span>
        <span class="detail-value highlight" id="roi">0%</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Duration</span>
        <span class="detail-value" id="duration">0 Days</span>
      </div>
    </div>

    <button class="invest-btn" onclick="alert('Proceeding to deposit for ' + document.getElementById('planName').innerText)">Invest Now</button>
  </div>

  <script>
    // Configuration for all 7 plans
    const planData = {
      starter: { name: "Starter Plan", icon: "🌱", min: "$100", max: "$499", roi: "3%", duration: "7 Days", color: "#94a3b8" },
      bronze: { name: "Bronze Tier", icon: "🟫", min: "$500", max: "$1,499", roi: "5%", duration: "14 Days", color: "#cd7f32" },
      silver: { name: "Silver Tier", icon: "🥈", min: "$1,500", max: "$4,999", roi: "8%", duration: "30 Days", color: "#c0c0c0" },
      gold: { name: "Gold Tier", icon: "🥇", min: "$5,000", max: "$9,999", roi: "12%", duration: "30 Days", color: "#ffd700" },
      platinum: { name: "Platinum Tier", icon: "💎", min: "$10,000", max: "$49,999", roi: "18%", duration: "60 Days", color: "#38bdf8" },
      diamond: { name: "Diamond Tier", icon: "🔮", min: "$50,000", max: "$99,999", roi: "25%", duration: "90 Days", color: "#a855f7" },
      crown: { name: "Crown Elite", icon: "👑", min: "$100,000", max: "Unlimited", roi: "35%", duration: "120 Days", color: "#f43f5e" }
    };

    // Get the plan from the URL (e.g., ?plan=gold)
    const urlParams = new URLSearchParams(window.location.search);
    const planKey = urlParams.get('plan');
    const plan = planData[planKey];

    // Populate the page if the plan exists
    if (plan) {
      document.getElementById('planName').innerText = plan.name;
      document.getElementById('planName').style.color = plan.color;
      document.getElementById('planIcon').innerText = plan.icon;
      document.getElementById('minDep').innerText = plan.min;
      document.getElementById('maxDep').innerText = plan.max;
      document.getElementById('roi').innerText = plan.roi;
      document.getElementById('duration').innerText = plan.duration;
    } else {
      document.getElementById('planName').innerText = "Plan Not Found";
    }
  </script>
</bod
