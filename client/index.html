<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background-color: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #334155; box-sizing: border-box; }
    .badge { background: #10b981; color: white; font-size: 11px; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; display: inline-block; margin-bottom: 12px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
    .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: white; box-sizing: border-box; font-size: 14px; outline: none; }

    /* Password container fix */
    .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    .password-wrapper input { width: 100%; padding-right: 48px; }
    
    .toggle-icon {
      position: absolute;
      right: 12px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      z-index: 20;
    }
    .toggle-icon svg { pointer-events: none; }

    .btn { width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 15px; }
    .links { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
    .links a { color: #10b981; text-decoration: none; }
    .error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 12px; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 6px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Client Portal</span>
    <div class="title">Client Login</div>

    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="client@example.com">
    </div>
    
    <div class="input-group">
      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="••••••••">
        <div class="toggle-icon" id="eye-btn" onclick="togglePass(event)" ontouchstart="togglePass(event)">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
    </div>
    
    <button class="btn" onclick="handleClientLogin()">Log In</button>
    
    <div id="error-msg" class="error"></div>

    <div class="links">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function togglePass(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const input = document.getElementById('password');
      const btn = document.getElementById('eye-btn');
      
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }

    async function handleClientLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('error-msg');

      errorDiv.style.display = 'none';

      if (!email || !password) {
        errorDiv.innerText = "Please fill in all fields.";
        errorDiv.style.display = 'block';
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        errorDiv.innerText = error.message;
        errorDiv.style.display = 'block';
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
