<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #131c38 0%, #070b19 100%);
      --card-bg: rgba(19, 27, 54, 0.7);
      --card-border: rgba(255, 255, 255, 0.07);
      --text-muted: #94a3b8;
    }

    body { background: var(--bg-gradient); background-attachment: fixed; color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 16px; padding-bottom: 100px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px; }
    .logo-text { background: linear-gradient(90deg, #4ade80, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
    .menu-btn { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: white; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; display: block; }
    
    .welcome-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .welcome-user { display: flex; align-items: center; gap: 12px; }
    
    .avatar-preview { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); background: #1e294b; display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; flex-shrink: 0; }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

    .balance-display { font-size: 2.2rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; }
    
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-action { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
    .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; box-shadow: none; }

    .bottom-nav { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 448px; margin: 0 auto; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-around; padding: 10px 0; border-radius: 20px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; }
    .nav-item.active { color: #4ade80; }
    .nav-icon { font-size: 18px; }

    .support-bubble { position: fixed; bottom: 85px; right: 20px; width: 52px; height: 52px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); cursor: pointer; z-index: 99; border: 2px solid rgba(255, 255, 255, 0.2); transition: transform 0.2s ease; text-decoration: none; font-size: 22px; }
    .support-bubble:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1 class="logo-text">Equity Mixed Assets</h1>
      <button class="menu-btn" onclick="window.location.href='settings.html'">⚙️</button>
    </header>

    <div class="card">
      <div class="welcome-row">
        <div class="welcome-user">
          <div class="avatar-preview" id="dash-avatar">👤</div>
          <span class="card-title" id="welcome-text" style="margin: 0;">WELCOME, USER</span>
        </div>
      </div>
      <div class="balance-display">$0.00</div>
      <div class="action-grid">
        <a href="deposit.html" class="btn-action">Deposit</a>
        <a href="investment-plan.html" class="btn-action btn-secondary">Investment Plan</a>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active"><span class="nav-icon">🏠</span>Home</a>
    <a href="investment-plan.html" class="nav-item"><span class="nav-icon">📈</span>Plans</a>
    <a href="deposit.html" class="nav-item"><span class="nav-icon">💳</span>Deposit</a>
    <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span>Settings</a>
  </nav>

  <a href="customer-care.html" class="support-bubble" title="Customer Care">🎧</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadDashProfile() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      
      const { data } = await client.from('profiles').select('username, avatar_url').eq('id', user.id).maybeSingle();
      if (data) {
        if (data.username) {
          document.getElementById('welcome-text').innerText = `WELCOME, ${data.username.toUpperCase()}`;
        }
        if (data.avatar_url) {
          document.getElementById('dash-avatar').innerHTML = `<img src="${data.avatar_url}" alt="Avatar">`;
        }
      }
    }
    loadDashProfile();
  </script>
</body>
</html>
