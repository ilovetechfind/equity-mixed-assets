<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    .navbar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 16px 24px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 24px; }
    .logo { font-size: 18px; font-weight: 700; color: #10b981; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .card { background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">Client Portal</div>
    <div>
      <span id="client-email" style="margin-right: 15px; color: #94a3b8; font-size: 14px;"></span>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <div class="card">
    <h2>Welcome to your Client Dashboard</h2>
    <p style="color: #94a3b8;">Your client account is active under /client/.</p>
  </div>

  <script>
    const SUPABASE_URL = "https://rrdddtmqojyheshznrwl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGRkdG1xb2p5aGVzaHpucndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODUxNjEsImV4cCI6MjEwMTg2MTE2MX0.0Gp4-6D-TKBMgvHYZhKncfyfcWRTGd2oeSzpJGUg8vQ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('client-email').innerText = session.user.email;
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    }

    checkAuth();
  </script>
</body>
</html>
