<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Mixed Assets - Starter Plan Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #070b19 100%);
      --card-bg: rgba(30, 27, 75, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #34d399;
    }

    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    
    .day-badge { display: inline-block; background: rgba(99, 102, 241, 0.2); border: 1px solid var(--primary); color: #818cf8; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; margin-bottom: 16px; }
    
    .value-display { font-size: 2rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.5px; }
    
    /* Graph Container */
    .graph-container { width: 100%; height: 110px; background: rgba(0,0,0,0.4); border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.06); }
    
    /* Progress Bar */
    .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
    .progress-track { width: 100%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); border-radius: 5px; transition: width 0.4s ease; }

    .time-subtext { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; background: rgba(0,0,0,0.2); padding: 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.04); }
    .stat-item label { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .stat-item span { font-size: 0.95rem; font-weight: 700; color: white; }

    .action-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; text-align: center; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); transition: opacity 0.2s; text-decoration: none; display: block; box-sizing: border-box; }
    .action-btn:hover { opacity: 0.9; }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <!-- Day Text -->
      <div id="client-day" class="day-badge">Day 27 of 30</div>
      
      <!-- Current Value -->
      <div id="client-current" class="value-display">$274,285.20</div>

      <!-- Live Graph Rendering -->
      <div class="graph-container">
        <svg id="clientSvgGraph" viewBox="0 0 300 100" preserveAspectRatio="none" style="width: 100%; height: 100%; display: block;">
          <path id="clientSvgPath" d="M0,30 Q 150,80 300,50 L 300,100 L 0,100 Z" fill="rgba(74, 222, 128, 0.25)" stroke="#4ade80" stroke-width="2"></path>
        </svg>
      </div>

      <!-- Volume Progress Bar -->
      <div class="progress-info">
        <span id="client-paid-volume-label">Paid Volume</span>
        <span id="client-paid-volume-text" style="color: white; font-weight: 700;">$140,000 / $200,000 Paid</span>
      </div>
      <div class="progress-track">
        <div id="client-progress-fill" class="progress-fill" style="width: 70%;"></div>
      </div>

      <!-- Time Remaining Subtext -->
      <div id="client-time-remaining" class="time-subtext">
        3 days remaining to clear installment structure and unlock total maturity claim.
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-item">
          <label>Total Goal</label>
          <span id="client-total-goal">$200,000</span>
        </div>
        <div class="stat-item">
          <label>Remaining Balance</label>
          <span id="client-remaining" style="color: #fca5a5;">$60,000</span>
        </div>
        <div class="stat-item">
          <label>Guaranteed Return</label>
          <span id="client-payout" style="color: #34d399;">$1,000,000</span>
        </div>
      </div>

      <!-- Installment Action Button -->
      <a href="#" id="client-btn-text" class="action-btn">Pay Next Installment ($60,000)</a>
    </div>
  </div>

  <script>
    // Grab user ID from URL parameters (e.g., client-page.html?id=123)
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('id') || 'default_user';

    // The exact same localStorage key used in your admin edit panel
    const storageKey = `config_starter_full_${targetUserId}`;

    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem(storageKey);
      if (saved) {
        try {
          const data = JSON.parse(saved);
          
          // Populate text fields
          if(data.dayText) document.getElementById('client-day').innerText = data.dayText;
          if(data.currentValue) document.getElementById('client-current').innerText = data.currentValue;
          if(data.paidVolumeText) document.getElementById('client-paid-volume-text').innerText = data.paidVolumeText;
          if(data.timeRemaining) document.getElementById('client-time-remaining').innerText = data.timeRemaining;
          if(data.totalGoal) document.getElementById('client-total-goal').innerText = data.totalGoal;
          if(data.remainingBalance) document.getElementById('client-remaining').innerText = data.remainingBalance;
          if(data.guaranteedPayout) document.getElementById('client-payout').innerText = data.guaranteedPayout;
          if(data.installmentButtonText) document.getElementById('client-btn-text').innerText = data.installmentButtonText;

          // Populate progress bar percentage
          if(data.progressPercent) {
            document.getElementById('client-progress-fill').style.width = data.progressPercent + '%';
          }

          // Populate live graph curve based on saved graph height
          if(data.graphHeight) {
            const numericVal = parseInt(data.graphHeight);
            const yCoord = 100 - numericVal;
            const pathString = `M0,${yCoord} Q 150,${yCoord * 0.4} 300,${yCoord * 0.7} L 300,100 L 0,100 Z`;
            document.getElementById('clientSvgPath').setAttribute('d', pathString);
          }

        } catch (e) {
          console.error("Error loading plan config data", e);
        }
      }
    });
  </script>
</body>
</html>
